# Optional overlay: attach profiled webserver-* services (docker-compose.yml)
# to an already-running independent sdkwork-api-cloud-gateway compose network.
#
# Used by scripts/docker/compose.mjs when SDKWORK_MODULE_API_GATEWAY_ATTACH_NETWORK
# is set. Standalone per-env deploys use docker-compose.platform-api-gateway-attach.yml.
#
# Imported cloud-mode sidecars dial sdkwork-api-cloud-gateway:8080
# checkout-direct (§17.3): the attached gateway must carry that network alias
# and serve on the declared port, so SDKWORK_MODULE_API_GATEWAY_PORT defaults
# to 8080 here.

# Bounded json-file log rotation: unbounded container logs eventually fill
# the host disk on long-lived deployments (OPERATIONS_SPEC.md §2.3).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"
services:
  webserver-development:
    environment:
      SDKWORK_MODULE_API_GATEWAY_DEPLOYMENT: docker
      SDKWORK_MODULE_API_GATEWAY_HOST: ${SDKWORK_MODULE_API_GATEWAY_HOST:-gateway}
      SDKWORK_MODULE_API_GATEWAY_PORT: ${SDKWORK_MODULE_API_GATEWAY_PORT:-8080}
    networks:
      default: {}
      platform_api_gateway_attach: {}

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  webserver-test:
    environment:
      SDKWORK_MODULE_API_GATEWAY_DEPLOYMENT: docker
      SDKWORK_MODULE_API_GATEWAY_HOST: ${SDKWORK_MODULE_API_GATEWAY_HOST:-gateway}
      SDKWORK_MODULE_API_GATEWAY_PORT: ${SDKWORK_MODULE_API_GATEWAY_PORT:-8080}
    networks:
      default: {}
      platform_api_gateway_attach: {}

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
  webserver-production:
    environment:
      SDKWORK_MODULE_API_GATEWAY_DEPLOYMENT: docker
      SDKWORK_MODULE_API_GATEWAY_HOST: ${SDKWORK_MODULE_API_GATEWAY_HOST:-gateway}
      SDKWORK_MODULE_API_GATEWAY_PORT: ${SDKWORK_MODULE_API_GATEWAY_PORT:-8080}
    networks:
      default: {}
      platform_api_gateway_attach: {}

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
networks:
  platform_api_gateway_attach:
    external: true
    name: ${SDKWORK_MODULE_API_GATEWAY_ATTACH_NETWORK:?SDKWORK_MODULE_API_GATEWAY_ATTACH_NETWORK must be set to the gateway compose network}
