# sdkwork-webserver — demo environment (external dependencies).
#
# Standalone compose file for the demo environment: the independent
# demonstration tier (ENVIRONMENT_SPEC "standalone.demo"); dedicated persistence
# (sdkwork_ai_demo) and -demo hostnames, never shared with other environments. Same image as every
# other environment ("One image, every environment"); the environment is
# selected at deploy time through env/demo.env.
#
# Port mapping:
#   Management: host 19080 -> container 3800
#   Public data plane: host 19098/38432 -> container 80/443 by default
#   (set SDKWORK_WEBSERVER_DEMO_IMPORT_HTTP_HOST_PORT=80 and
#    SDKWORK_WEBSERVER_DEMO_HTTPS_HOST_PORT=443 for the public edge when
#    development is not using host 80/443).
# Domain: server-demo.sdkwork.com (APP_RUNTIME_TOPOLOGY_NAMING §9 -demo suffix)
#
# Usage:
#   docker compose -f deployments/docker/docker-compose.demo.yml \
#     --env-file deployments/docker/env/demo.env up -d
#
#   docker compose -f deployments/docker/docker-compose.demo.yml down

name: sdkwork-webserver-demo

# Bounded json-file log rotation (DEPLOYMENT_SPEC.md §6 runtime hardening).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  webserver:
    image: registry.sdkwork.com/apps/sdkwork-webserver-standalone:${SDKWORK_WEBSERVER_IMAGE_TAG:-0.1.0}
    container_name: sdkwork-webserver-demo
    restart: unless-stopped
    logging: *default-logging
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${SDKWORK_WEBSERVER_DEMO_HOST_PORT:-19080}:3800"
      - "${SDKWORK_WEBSERVER_DEMO_IMPORT_HTTP_HOST_PORT:-19098}:80"
      - "${SDKWORK_WEBSERVER_DEMO_HTTPS_HOST_PORT:-38432}:443"
    env_file:
      - path: env/demo.env
        required: false
    environment:
      SDKWORK_WEBSERVER_CONTAINER_HEALTH_PORT: "3800"
      SDKWORK_WEBSERVER_ENVIRONMENT: demo
      SDKWORK_WEBSERVER_PROFILE_ID: standalone.demo
      SDKWORK_WEBSERVER_IMPORT_LISTENER_PORTS: ${SDKWORK_WEBSERVER_IMPORT_LISTENER_PORTS:-}
      SDKWORK_DEPLOY_APP_ROOT: /app/share/sdkwork/deploy
      SDKWORK_SKILLS_APP_ROOT: /app/share/sdkwork/skills
      SDKWORK_MCP_APP_ROOT: /app/share/sdkwork/mcp
      SDKWORK_SPACE_ROOT: ${SDKWORK_SPACE_ROOT:-/opt/deploy}
      SDKWORK_SPACE_HOST_PATH: ${SDKWORK_SPACE_HOST_PATH:-/opt/deploy}
      SDKWORK_SPACE_CLONE_URL: ${SDKWORK_SPACE_CLONE_URL:-https://github.com/sdkwork-ai/sdkwork-space.git}
      SDKWORK_SPACE_CLONE_PULL: ${SDKWORK_SPACE_CLONE_PULL:-true}
      # Import every enabled sibling module's deployments/webserver/ from the
      # space checkout (SDKWORK_WEBSERVER_SPEC.md §17); SDKWORK_SPACE_MODULES
      # remains the explicit override.
      SDKWORK_SPACE_AUTO_DISCOVER: ${SDKWORK_SPACE_AUTO_DISCOVER:-true}
      SDKWORK_SPACE_MODULES: ${SDKWORK_SPACE_MODULES:-}
      SDKWORK_WEBSERVER_MODULE_IMPORT_REQUIRED: ${SDKWORK_WEBSERVER_MODULE_IMPORT_REQUIRED:-false}
      SDKWORK_WEBSERVER_MODULE_IMPORT_PROBE_UPSTREAMS: ${SDKWORK_WEBSERVER_MODULE_IMPORT_PROBE_UPSTREAMS:-false}
      SDKWORK_MODULE_API_GATEWAY_DEPLOYMENT: ${SDKWORK_MODULE_API_GATEWAY_DEPLOYMENT:-docker}
      SDKWORK_MODULE_API_GATEWAY_HOST: ${SDKWORK_MODULE_API_GATEWAY_HOST:-}
      SDKWORK_MODULE_API_GATEWAY_PORT: ${SDKWORK_MODULE_API_GATEWAY_PORT:-3900}
      SDKWORK_MODULE_API_GATEWAY_BINARY: ${SDKWORK_MODULE_API_GATEWAY_BINARY:-/app/bin/sdkwork-api-cloud-gateway}
      SDKWORK_MODULE_API_GATEWAY_INSTALL_ROOT: ${SDKWORK_MODULE_API_GATEWAY_INSTALL_ROOT:-/opt/sdkwork/api-gateway}
      SDKWORK_DEPLOY_SANDBOX_KEY: ${SDKWORK_DEPLOY_SANDBOX_KEY:-deploy.local.opt_deploy}
      SDKWORK_DEPLOY_SANDBOX_ROOT: ${SDKWORK_DEPLOY_SANDBOX_ROOT:-/opt/deploy}
      SDKWORK_CORS_ALLOWED_ORIGINS: ${SDKWORK_CORS_ALLOWED_ORIGINS:-http://server-demo.sdkwork.com,http://localhost:19080,http://127.0.0.1:19080,app://dsh,app://birdcoder,app://sdkwork,app://dtupay,tauri://localhost,https://servicewechat.com,https://server-demo.sdkwork.com,https://server-demo.birdcoder.com,http://server-demo.birdcoder.com,https://server-demo.dtupay.com,http://server-demo.dtupay.com,https://server-demo.noaper.com,http://server-demo.noaper.com,https://server-demo.sdkwork.cn,http://server-demo.sdkwork.cn,https://server-demo.birdcoder.cn,http://server-demo.birdcoder.cn,https://server-demo.dtupay.cn,http://server-demo.dtupay.cn,https://server-demo.noaper.cn,http://server-demo.noaper.cn,https://server-demo.skubc.com,http://server-demo.skubc.com,https://server-demo.skubc.cn,http://server-demo.skubc.cn,https://server-demo.zowalk.com,http://server-demo.zowalk.com,https://server-demo.zowalk.cn,http://server-demo.zowalk.cn,https://server-demo.offer86.com,http://server-demo.offer86.com,https://server-demo.offer86.cn,http://server-demo.offer86.cn,https://server-demo.86offer.com,http://server-demo.86offer.com,https://server-demo.86offer.cn,http://server-demo.86offer.cn,https://server-app-demo.sdkwork.com,http://server-app-demo.sdkwork.com,https://server-app-demo.birdcoder.com,http://server-app-demo.birdcoder.com,https://server-app-demo.dtupay.com,http://server-app-demo.dtupay.com,https://server-app-demo.noaper.com,http://server-app-demo.noaper.com,https://server-app-demo.sdkwork.cn,http://server-app-demo.sdkwork.cn,https://server-app-demo.birdcoder.cn,http://server-app-demo.birdcoder.cn,https://server-app-demo.dtupay.cn,http://server-app-demo.dtupay.cn,https://server-app-demo.noaper.cn,http://server-app-demo.noaper.cn,https://server-app-demo.skubc.com,http://server-app-demo.skubc.com,https://server-app-demo.skubc.cn,http://server-app-demo.skubc.cn,https://server-app-demo.zowalk.com,http://server-app-demo.zowalk.com,https://server-app-demo.zowalk.cn,http://server-app-demo.zowalk.cn,https://server-app-demo.offer86.com,http://server-app-demo.offer86.com,https://server-app-demo.offer86.cn,http://server-app-demo.offer86.cn,https://server-app-demo.86offer.com,http://server-app-demo.86offer.com,https://server-app-demo.86offer.cn,http://server-app-demo.86offer.cn,https://server-admin-demo.sdkwork.com,http://server-admin-demo.sdkwork.com,https://server-admin-demo.birdcoder.com,http://server-admin-demo.birdcoder.com,https://server-admin-demo.dtupay.com,http://server-admin-demo.dtupay.com,https://server-admin-demo.noaper.com,http://server-admin-demo.noaper.com,https://server-admin-demo.sdkwork.cn,http://server-admin-demo.sdkwork.cn,https://server-admin-demo.birdcoder.cn,http://server-admin-demo.birdcoder.cn,https://server-admin-demo.dtupay.cn,http://server-admin-demo.dtupay.cn,https://server-admin-demo.noaper.cn,http://server-admin-demo.noaper.cn,https://server-admin-demo.skubc.com,http://server-admin-demo.skubc.com,https://server-admin-demo.skubc.cn,http://server-admin-demo.skubc.cn,https://server-admin-demo.zowalk.com,http://server-admin-demo.zowalk.com,https://server-admin-demo.zowalk.cn,http://server-admin-demo.zowalk.cn,https://server-admin-demo.offer86.com,http://server-admin-demo.offer86.com,https://server-admin-demo.offer86.cn,http://server-admin-demo.offer86.cn,https://server-admin-demo.86offer.com,http://server-admin-demo.86offer.com,https://server-admin-demo.86offer.cn,http://server-admin-demo.86offer.cn}
      SDKWORK_DATABASE_ENGINE: postgresql
      SDKWORK_DATABASE_HOST: ${WEBSERVER_POSTGRES_HOST:-host.docker.internal}
      SDKWORK_DATABASE_PORT: ${WEBSERVER_POSTGRES_PORT:-5432}
      SDKWORK_DATABASE_NAME: ${WEBSERVER_POSTGRES_DEMO_DB:-sdkwork_ai_demo}
      SDKWORK_DATABASE_SCHEMA: ${WEBSERVER_POSTGRES_DEMO_DB:-sdkwork_ai_demo}
      SDKWORK_DATABASE_SCHEMA_FALLBACK_PUBLIC: "false"
      SDKWORK_DATABASE_USERNAME: ${WEBSERVER_POSTGRES_DEMO_USER:-sdkwork_ai_demo}
      SDKWORK_DATABASE_PASSWORD: ${WEBSERVER_POSTGRES_DEMO_PASSWORD:-}
      SDKWORK_DATABASE_SSL_MODE: ${WEBSERVER_POSTGRES_SSL_MODE:-disable}
      SDKWORK_DATABASE_MAX_CONNECTIONS: "20"
      SDKWORK_WEBSERVER_REDIS_ENABLED: "true"
      SDKWORK_WEBSERVER_REDIS_HOST: ${WEBSERVER_REDIS_HOST:-host.docker.internal}
      SDKWORK_WEBSERVER_REDIS_PORT: ${WEBSERVER_REDIS_PORT:-6379}
      SDKWORK_WEBSERVER_REDIS_DATABASE: "4"
      SDKWORK_WEBSERVER_REDIS_TLS: ${WEBSERVER_REDIS_TLS:-false}
      SDKWORK_WEBSERVER_REDIS_PASSWORD: ${WEBSERVER_REDIS_PASSWORD:-}
      # Drive delivery cache (shared host directory, LRU website content cache).
      SDKWORK_DRIVE_WEBSITE_CACHE_ENABLED: ${SDKWORK_DRIVE_WEBSITE_CACHE_ENABLED:-true}
      SDKWORK_DRIVE_WEBSITE_CACHE_ROOT: ${SDKWORK_DRIVE_WEBSITE_CACHE_ROOT:-/opt/deploy/drive/website-cache}
      SDKWORK_DRIVE_WEBSITE_CACHE_ENVIRONMENT: demo
      SDKWORK_DRIVE_WEBSITE_CACHE_MAX_TOTAL_BYTES: ${SDKWORK_DRIVE_WEBSITE_CACHE_MAX_TOTAL_BYTES:-8589934592}
      SDKWORK_DRIVE_WEBSITE_CACHE_MAX_ENTRIES: ${SDKWORK_DRIVE_WEBSITE_CACHE_MAX_ENTRIES:-100000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:$${SDKWORK_WEBSERVER_CONTAINER_HEALTH_PORT:-3800}/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s
    volumes:
      - webserver-secrets-demo:/etc/sdkwork/webserver/secrets
      - webserver-data-demo:/var/lib/sdkwork/webserver
      - ${SDKWORK_DRIVE_CACHE_HOST_PATH:-/opt/deploy/drive}:/opt/deploy/drive:rw
      - ${SDKWORK_SPACE_HOST_PATH:-/opt/deploy}:/opt/deploy:ro
      - ${SDKWORK_SPACE_CHECKOUT_HOST_PATH:-${SDKWORK_SPACE_HOST_PATH:-/opt/deploy}/sdkwork-space}:/opt/deploy/sdkwork-space:rw
      - ${SDKWORK_MODULE_API_GATEWAY_CHECKOUT_HOST_PATH:-../../../sdkwork-api-cloud-gateway}:/opt/deploy/sdkwork-space/sdkwork-api-cloud-gateway:ro
      - ./scripts/entrypoint-standalone.sh:/usr/local/bin/sdkwork-webserver-entrypoint:ro
      # Mount workspace-built gateway so imports.d/import.conf aggregator works
      # (registry 0.1.0 rejects multi-module full nginx sidecars).
      - ../../target/release/sdkwork-api-webserver-standalone-gateway:/app/bin/sdkwork-api-webserver-standalone-gateway:ro
      - ../../../sdkwork-skills/database:/app/share/sdkwork/skills/database:ro
      - ../../../sdkwork-mcp/database:/app/share/sdkwork/mcp/database:ro
      - ../../../sdkwork-deployments/database:/app/share/sdkwork/deploy/database:ro

volumes:
  webserver-secrets-demo:
  webserver-data-demo:
