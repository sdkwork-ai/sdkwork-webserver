# sdkwork-webserver — development environment (external dependencies).
#
# Standalone compose file for the development environment. Uses external
# PostgreSQL and Redis (WSL host-native or remote managed services).
#
# Port mapping:
#   Management: host 13800 -> container 3800
#   Public data plane (modules + api*.brand): host 80/443 -> container 80/443
# Domain: server-dev.sdkwork.com / api-dev.* / im-dev.* / …
#
# Usage:
#   docker compose -f deployments/docker/docker-compose.development.yml \
#     --env-file deployments/docker/env/development.env up -d
#
#   docker compose -f deployments/docker/docker-compose.development.yml down

name: sdkwork-webserver-development

# Bounded json-file log rotation (DEPLOYMENT_SPEC.md §6 runtime hardening).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  webserver:
    image: registry.sdkwork.com/apps/sdkwork-webserver-standalone:${SDKWORK_WEBSERVER_IMAGE_TAG:-0.1.0}
    container_name: sdkwork-webserver-development
    restart: unless-stopped
    logging: *default-logging
    # Resource governance (OPERATIONS_SPEC.md §6 runtime hardening): bound
    # CPU / memory / process count so one runaway container cannot starve the
    # host or the co-located per-environment stacks. Env-tunable per
    # deployment; the data plane needs a high fd ceiling.
    deploy:
      resources:
        limits:
          cpus: "${SDKWORK_WEBSERVER_CPU_LIMIT:-4.0}"
          memory: ${SDKWORK_WEBSERVER_MEMORY_LIMIT:-4g}
          pids: 512
        reservations:
          cpus: "0.5"
          memory: 512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Listen on privileged 80/443 inside the container (module sidecars declare
    # listen 80 / 443 ssl per SDKWORK_WEBSERVER_SPEC.md).
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${SDKWORK_WEBSERVER_DEV_HOST_PORT:-13800}:3800"
      - "${SDKWORK_WEBSERVER_DEV_IMPORT_HTTP_HOST_PORT:-80}:80"
      - "${SDKWORK_WEBSERVER_DEV_HTTPS_HOST_PORT:-443}:443"
    env_file:
      - path: env/development.env
        required: false
    environment:
      SDKWORK_WEBSERVER_CONTAINER_HEALTH_PORT: "3800"
      SDKWORK_WEBSERVER_ENVIRONMENT: development
      SDKWORK_WEBSERVER_PROFILE_ID: standalone.development
      # Identity listen: module nginx sidecars use listen 80 / 443 ssl.
      SDKWORK_WEBSERVER_IMPORT_LISTENER_PORTS: ${SDKWORK_WEBSERVER_IMPORT_LISTENER_PORTS:-}
      SDKWORK_DEPLOY_APP_ROOT: /app/share/sdkwork/deploy
      SDKWORK_SKILLS_APP_ROOT: /app/share/sdkwork/skills
      SDKWORK_MCP_APP_ROOT: /app/share/sdkwork/mcp
      SDKWORK_SPACE_ROOT: ${SDKWORK_SPACE_ROOT:-/opt/deploy}
      SDKWORK_SPACE_HOST_PATH: ${SDKWORK_SPACE_HOST_PATH:-/opt/deploy}
      SDKWORK_SPACE_CLONE_URL: ${SDKWORK_SPACE_CLONE_URL:-https://github.com/sdkwork-ai/sdkwork-space.git}
      SDKWORK_SPACE_CLONE_PULL: ${SDKWORK_SPACE_CLONE_PULL:-true}
      # Import every enabled sibling module's deployments/webserver/ from the
      # space checkout (SDKWORK_WEBSERVER_SPEC.md §17); SDKWORK_SPACE_MODULES
      # remains the explicit override.
      SDKWORK_SPACE_AUTO_DISCOVER: ${SDKWORK_SPACE_AUTO_DISCOVER:-true}
      SDKWORK_SPACE_MODULES: ${SDKWORK_SPACE_MODULES:-}
      SDKWORK_WEBSERVER_MODULE_IMPORT_REQUIRED: ${SDKWORK_WEBSERVER_MODULE_IMPORT_REQUIRED:-false}
      SDKWORK_WEBSERVER_MODULE_IMPORT_PROBE_UPSTREAMS: ${SDKWORK_WEBSERVER_MODULE_IMPORT_PROBE_UPSTREAMS:-false}
      SDKWORK_MODULE_API_GATEWAY_DEPLOYMENT: ${SDKWORK_MODULE_API_GATEWAY_DEPLOYMENT:-docker}
      SDKWORK_MODULE_API_GATEWAY_HOST: ${SDKWORK_MODULE_API_GATEWAY_HOST:-}
      SDKWORK_MODULE_API_GATEWAY_PORT: ${SDKWORK_MODULE_API_GATEWAY_PORT:-3900}
      SDKWORK_MODULE_API_GATEWAY_BINARY: ${SDKWORK_MODULE_API_GATEWAY_BINARY:-/app/bin/sdkwork-api-cloud-gateway}
      SDKWORK_MODULE_API_GATEWAY_INSTALL_ROOT: ${SDKWORK_MODULE_API_GATEWAY_INSTALL_ROOT:-/opt/sdkwork/api-gateway}
      SDKWORK_DEPLOY_SANDBOX_KEY: ${SDKWORK_DEPLOY_SANDBOX_KEY:-deploy.local.opt_deploy}
      SDKWORK_DEPLOY_SANDBOX_ROOT: ${SDKWORK_DEPLOY_SANDBOX_ROOT:-/opt/deploy}
      SDKWORK_CORS_ALLOWED_ORIGINS: ${SDKWORK_CORS_ALLOWED_ORIGINS:-http://server-dev.sdkwork.com,http://localhost:13800,http://127.0.0.1:13800,app://dsh,app://birdcoder,app://sdkwork,app://dtupay,tauri://localhost,https://servicewechat.com,https://server-dev.sdkwork.com,https://server-dev.birdcoder.com,http://server-dev.birdcoder.com,https://server-dev.dtupay.com,http://server-dev.dtupay.com,https://server-dev.noaper.com,http://server-dev.noaper.com,https://server-dev.sdkwork.cn,http://server-dev.sdkwork.cn,https://server-dev.birdcoder.cn,http://server-dev.birdcoder.cn,https://server-dev.dtupay.cn,http://server-dev.dtupay.cn,https://server-dev.noaper.cn,http://server-dev.noaper.cn,https://server-dev.skubc.com,http://server-dev.skubc.com,https://server-dev.skubc.cn,http://server-dev.skubc.cn,https://server-dev.zowalk.com,http://server-dev.zowalk.com,https://server-dev.zowalk.cn,http://server-dev.zowalk.cn,https://server-dev.offer86.com,http://server-dev.offer86.com,https://server-dev.offer86.cn,http://server-dev.offer86.cn,https://server-dev.86offer.com,http://server-dev.86offer.com,https://server-dev.86offer.cn,http://server-dev.86offer.cn,https://server-app-dev.sdkwork.com,http://server-app-dev.sdkwork.com,https://server-app-dev.birdcoder.com,http://server-app-dev.birdcoder.com,https://server-app-dev.dtupay.com,http://server-app-dev.dtupay.com,https://server-app-dev.noaper.com,http://server-app-dev.noaper.com,https://server-app-dev.sdkwork.cn,http://server-app-dev.sdkwork.cn,https://server-app-dev.birdcoder.cn,http://server-app-dev.birdcoder.cn,https://server-app-dev.dtupay.cn,http://server-app-dev.dtupay.cn,https://server-app-dev.noaper.cn,http://server-app-dev.noaper.cn,https://server-app-dev.skubc.com,http://server-app-dev.skubc.com,https://server-app-dev.skubc.cn,http://server-app-dev.skubc.cn,https://server-app-dev.zowalk.com,http://server-app-dev.zowalk.com,https://server-app-dev.zowalk.cn,http://server-app-dev.zowalk.cn,https://server-app-dev.offer86.com,http://server-app-dev.offer86.com,https://server-app-dev.offer86.cn,http://server-app-dev.offer86.cn,https://server-app-dev.86offer.com,http://server-app-dev.86offer.com,https://server-app-dev.86offer.cn,http://server-app-dev.86offer.cn,https://server-admin-dev.sdkwork.com,http://server-admin-dev.sdkwork.com,https://server-admin-dev.birdcoder.com,http://server-admin-dev.birdcoder.com,https://server-admin-dev.dtupay.com,http://server-admin-dev.dtupay.com,https://server-admin-dev.noaper.com,http://server-admin-dev.noaper.com,https://server-admin-dev.sdkwork.cn,http://server-admin-dev.sdkwork.cn,https://server-admin-dev.birdcoder.cn,http://server-admin-dev.birdcoder.cn,https://server-admin-dev.dtupay.cn,http://server-admin-dev.dtupay.cn,https://server-admin-dev.noaper.cn,http://server-admin-dev.noaper.cn,https://server-admin-dev.skubc.com,http://server-admin-dev.skubc.com,https://server-admin-dev.skubc.cn,http://server-admin-dev.skubc.cn,https://server-admin-dev.zowalk.com,http://server-admin-dev.zowalk.com,https://server-admin-dev.zowalk.cn,http://server-admin-dev.zowalk.cn,https://server-admin-dev.offer86.com,http://server-admin-dev.offer86.com,https://server-admin-dev.offer86.cn,http://server-admin-dev.offer86.cn,https://server-admin-dev.86offer.com,http://server-admin-dev.86offer.com,https://server-admin-dev.86offer.cn,http://server-admin-dev.86offer.cn}
      SDKWORK_DATABASE_ENGINE: postgresql
      SDKWORK_DATABASE_HOST: ${WEBSERVER_POSTGRES_HOST:-host.docker.internal}
      SDKWORK_DATABASE_PORT: ${WEBSERVER_POSTGRES_PORT:-5432}
      SDKWORK_DATABASE_NAME: ${WEBSERVER_POSTGRES_DEV_DB:-sdkwork_ai_dev}
      SDKWORK_DATABASE_SCHEMA: ${WEBSERVER_POSTGRES_DEV_DB:-sdkwork_ai_dev}
      SDKWORK_DATABASE_SCHEMA_FALLBACK_PUBLIC: "false"
      SDKWORK_DATABASE_USERNAME: ${WEBSERVER_POSTGRES_DEV_USER:-sdkwork_ai_dev}
      SDKWORK_DATABASE_PASSWORD: ${WEBSERVER_POSTGRES_DEV_PASSWORD:-}
      SDKWORK_DATABASE_SSL_MODE: ${WEBSERVER_POSTGRES_SSL_MODE:-disable}
      SDKWORK_DATABASE_MAX_CONNECTIONS: "10"
      SDKWORK_WEBSERVER_REDIS_ENABLED: "true"
      SDKWORK_WEBSERVER_REDIS_HOST: ${WEBSERVER_REDIS_HOST:-host.docker.internal}
      SDKWORK_WEBSERVER_REDIS_PORT: ${WEBSERVER_REDIS_PORT:-6379}
      SDKWORK_WEBSERVER_REDIS_DATABASE: "0"
      SDKWORK_WEBSERVER_REDIS_TLS: ${WEBSERVER_REDIS_TLS:-false}
      SDKWORK_WEBSERVER_REDIS_PASSWORD: ${WEBSERVER_REDIS_PASSWORD:-}
      # Drive delivery cache (shared host directory, LRU website content cache).
      SDKWORK_DRIVE_WEBSITE_CACHE_ENABLED: ${SDKWORK_DRIVE_WEBSITE_CACHE_ENABLED:-true}
      SDKWORK_DRIVE_WEBSITE_CACHE_ROOT: ${SDKWORK_DRIVE_WEBSITE_CACHE_ROOT:-/opt/deploy/drive/website-cache}
      SDKWORK_DRIVE_WEBSITE_CACHE_ENVIRONMENT: development
      SDKWORK_DRIVE_WEBSITE_CACHE_MAX_TOTAL_BYTES: ${SDKWORK_DRIVE_WEBSITE_CACHE_MAX_TOTAL_BYTES:-8589934592}
      SDKWORK_DRIVE_WEBSITE_CACHE_MAX_ENTRIES: ${SDKWORK_DRIVE_WEBSITE_CACHE_MAX_ENTRIES:-100000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:$${SDKWORK_WEBSERVER_CONTAINER_HEALTH_PORT:-3800}/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s
    volumes:
      - webserver-secrets-development:/etc/sdkwork/webserver/secrets
      - webserver-data-development:/var/lib/sdkwork/webserver
      - ${SDKWORK_DRIVE_CACHE_HOST_PATH:-/opt/deploy/drive}:/opt/deploy/drive:rw
      - ${SDKWORK_SPACE_HOST_PATH:-/opt/deploy}:/opt/deploy:ro
      # Writable: entrypoint materializes docker nginx sidecars in checkout
      # (imports.d/import.conf includes .../deployments/webserver/nginx.*.<env>.conf).
      - ${SDKWORK_SPACE_CHECKOUT_HOST_PATH:-${SDKWORK_SPACE_HOST_PATH:-/opt/deploy}/sdkwork-space}:/opt/deploy/sdkwork-space:rw
      # Platform API plane sidecar (api*.brand): ensure import even when the
      # space checkout lacks sdkwork-api-cloud-gateway as a submodule.
      - ${SDKWORK_MODULE_API_GATEWAY_CHECKOUT_HOST_PATH:-../../../sdkwork-api-cloud-gateway}:/opt/deploy/sdkwork-space/sdkwork-api-cloud-gateway:ro
      - ../../bin/container/entrypoint-standalone.sh:/usr/local/bin/sdkwork-webserver-entrypoint:ro
      # Dev: mount workspace-built gateway so imports.d/import.conf aggregator works.
      - ../../target/release/sdkwork-api-webserver-standalone-gateway:/app/bin/sdkwork-api-webserver-standalone-gateway:ro
      # Bundled module API gateway (SDKWORK_MODULE_API_GATEWAY_DEPLOYMENT=bundled):
      # mount the cloud-gateway release binary + install root from the sibling repo.
      - ${SDKWORK_MODULE_API_GATEWAY_BINARY_HOST_PATH:-../../../sdkwork-api-cloud-gateway/target/release/sdkwork-api-cloud-gateway}:/app/bin/sdkwork-api-cloud-gateway:ro
      - ${SDKWORK_MODULE_API_GATEWAY_INSTALL_ROOT_HOST_PATH:-../../../sdkwork-api-cloud-gateway/dist/container-image-build}:/opt/sdkwork/api-gateway:ro
      - ../../../sdkwork-skills/database:/app/share/sdkwork/skills/database:ro
      - ../../../sdkwork-mcp/database:/app/share/sdkwork/mcp/database:ro
      - ../../../sdkwork-deployments/database:/app/share/sdkwork/deploy/database:ro

volumes:
  webserver-secrets-development:
  webserver-data-development:
