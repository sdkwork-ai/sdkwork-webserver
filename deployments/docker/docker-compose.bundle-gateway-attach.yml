# Attach each webserver bundle instance to an independently deployed
# sdkwork-api-cloud-gateway network. The gateway must publish the canonical
# sdkwork-api-cloud-gateway alias on port 8080 on that network.
services:
  webserver:
    environment:
      SDKWORK_MODULE_API_GATEWAY_DEPLOYMENT: docker
      SDKWORK_MODULE_API_GATEWAY_HOST: sdkwork-api-cloud-gateway
      SDKWORK_MODULE_API_GATEWAY_PORT: "8080"
    networks:
      - sdkwork
      - module-api-gateway

networks:
  module-api-gateway:
    name: ${SDKWORK_MODULE_API_GATEWAY_ATTACH_NETWORK:?SDKWORK_MODULE_API_GATEWAY_ATTACH_NETWORK must be set}
    external: true
