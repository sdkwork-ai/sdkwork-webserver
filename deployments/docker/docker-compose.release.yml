# Compose for a release-tarball deployment of sdkwork-webserver.
#
# Every knob an operator normally changes lives in the .env file referenced by
# `--env-file`; this file only consumes them. Changing a port, a database, or
# Redis must not require editing this compose file.
#
#   cat > .env <<'ENV'
#   SDKWORK_VERSION=0.1.9
#   HOST_HTTP_PORT=8080
#   CONTAINER_HTTP_PORT=8080
#   POSTGRES_DB=sdkwork_ai_prod
#   POSTGRES_USER=sdkwork_app
#   POSTGRES_PASSWORD=change-me
#   REDIS_PASSWORD=change-me
#   ENV
#   docker compose -f docker-compose.release.yml --env-file .env up -d
#
# `config.toml` is read from /opt/sdkwork/etc/webserver/config.toml on the host.
# Its [ingress].bind port MUST equal CONTAINER_HTTP_PORT, because the right-hand
# side of the port mapping addresses the container port directly.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdkwork_ai_prod}
      POSTGRES_USER: ${POSTGRES_USER:-sdkwork_app}
      # Read from the environment rather than a file: the compose .env already
      # holds the value, and a second copy on disk would only add a leak surface.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published by default: only the webserver container needs this socket.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdkwork_app} -d ${POSTGRES_DB:-sdkwork_ai_prod}"]
      interval: 5s
      timeout: 3s
      retries: 30

  cache:
    image: redis:7
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - cache-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  webserver:
    build:
      context: .
      dockerfile: Dockerfile.release
    image: sdkwork-webserver:${SDKWORK_VERSION:-0.1.9}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    ports:
      # Left side is the host port the operator picks; right side must match
      # [ingress].bind in config.toml.
      - "${HOST_HTTP_PORT:-8080}:${CONTAINER_HTTP_PORT:-8080}"
    environment:
      # The resolver cache reads this over [resolution_cache.redis].url in
      # config.toml, so the connection stays in one place when Redis is
      # managed outside the image.
      SDKWORK_WEBSERVER_REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379
      SDKWORK_DATABASE_HOST: db
      SDKWORK_DATABASE_PORT: "5432"
      SDKWORK_DATABASE_NAME: ${POSTGRES_DB:-sdkwork_ai_prod}
      SDKWORK_DATABASE_USERNAME: ${POSTGRES_USER:-sdkwork_app}
    volumes:
      - ${SDKWORK_CONFIG_DIR:-/opt/sdkwork/etc/webserver}:/etc/sdkwork/webserver:ro
      - deploy-state:/opt/deploy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${CONTAINER_HTTP_PORT:-8080}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  db-data:
  cache-data:
  deploy-state:
