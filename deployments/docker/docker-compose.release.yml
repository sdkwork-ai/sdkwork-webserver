# Compose for a release-tarball deployment of sdkwork-webserver.
#
# Every knob an operator normally changes lives either in the .env file
# referenced by `--env-file` or in the mounted config.toml; this file only
# consumes them. Changing a port, a database, or Redis must not require editing
# this compose file.
#
#   sudo install -d -m 0700 /opt/sdkwork/etc/webserver/secrets
#   echo -n 'a strong db password' | sudo tee \
#     /opt/sdkwork/etc/webserver/secrets/database.secret > /dev/null
#   echo -n 'a strong redis password' | sudo tee \
#     /opt/sdkwork/etc/webserver/secrets/redis.secret > /dev/null
#   sudo chown -R 10001:10001 /opt/sdkwork/etc/webserver
#   sudo chmod 0600 /opt/sdkwork/etc/webserver/secrets/*.secret
#
#   cat > .env <<'ENV'
#   SDKWORK_VERSION=0.1.9
#   HOST_HTTP_PORT=8080
#   CONTAINER_HTTP_PORT=8080
#   POSTGRES_DB=sdkwork_ai_prod
#   POSTGRES_USER=sdkwork_app
#   ENV
#   docker compose -f docker-compose.release.yml --env-file .env up -d
#
# Passwords deliberately do NOT appear in .env. The db service reads the same
# `database.secret` file that config.toml's `password_file` points at, so the
# role and the application cannot drift onto different credentials, and the
# value never lands in `docker inspect` output or a shell history.
#
# `config.toml` is read from /opt/sdkwork/etc/webserver/config.toml on the host.
# Its [ingress].bind port MUST equal CONTAINER_HTTP_PORT, because the right-hand
# side of the port mapping addresses the container port directly.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sdkwork_ai_prod}
      POSTGRES_USER: ${POSTGRES_USER:-sdkwork_app}
      # File, not an inline value: this is the same file config.toml reads, so a
      # rotated password takes effect on both sides from one edit.
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - database_password
    volumes:
      - db-data:/var/lib/postgresql/data
    # Not published by default: only the webserver container needs this socket.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdkwork_app} -d ${POSTGRES_DB:-sdkwork_ai_prod}"]
      interval: 5s
      timeout: 3s
      retries: 30

  cache:
    image: redis:7
    restart: unless-stopped
    # redis-server cannot read a password file, so the wrapper turns the secret
    # into argv. `$$` keeps Compose from interpolating the inner shell.
    entrypoint:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - cache-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  webserver:
    build:
      context: .
      dockerfile: Dockerfile.release
    image: sdkwork-webserver:${SDKWORK_VERSION:-0.1.9}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    ports:
      # Left side is the host port the operator picks; right side must match
      # [ingress].bind in config.toml.
      - "${HOST_HTTP_PORT:-8080}:${CONTAINER_HTTP_PORT:-8080}"
    environment:
      # config.toml is authoritative for the database: at startup the gateway
      # materialises [database] into these very variables and overwrites
      # anything set here. Injecting them from .env would look like a knob and
      # silently do nothing, so they are deliberately absent.
      #
      # The redis url IS honoured, because [resolution_cache.redis].url has no
      # env contract of its own; the entrypoint builds it from redis.secret.
      SDKWORK_WEBSERVER_REDIS_HOST: cache
      SDKWORK_WEBSERVER_REDIS_PORT: "6379"
    volumes:
      - ${SDKWORK_CONFIG_DIR:-/opt/sdkwork/etc/webserver}:/etc/sdkwork/webserver:ro
      - deploy-state:/opt/deploy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${CONTAINER_HTTP_PORT:-8080}/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

secrets:
  # Sourced from the host so one file feeds both the role and the application.
  database_password:
    file: ${SDKWORK_CONFIG_DIR:-/opt/sdkwork/etc/webserver}/secrets/database.secret
  redis_password:
    file: ${SDKWORK_CONFIG_DIR:-/opt/sdkwork/etc/webserver}/secrets/redis.secret

volumes:
  db-data:
  cache-data:
  deploy-state:
