    volumes:
      - webserver-secrets-test:/etc/sdkwork/webserver/secrets
      - webserver-data-test:/var/lib/sdkwork/webserver
      - ${SDKWORK_DRIVE_CACHE_HOST_PATH:-/opt/deploy/drive}:/opt/deploy/drive:rw
      - ../../../sdkwork-skills/database:/app/share/sdkwork/skills/database:ro
      - ../../../sdkwork-mcp/database:/app/share/sdkwork/mcp/database:ro
      - ../../../sdkwork-deployments/database:/app/share/sdkwork/deploy/database:ro

    logging: *default-logging
  webserver-staging:
    <<: *webserver-common
    profiles: [staging]
    container_name: sdkwork-webserver-staging
    ports:
      - "${SDKWORK_WEBSERVER_STAGING_HOST_PORT:-18081}:3800"
      - "${SDKWORK_WEBSERVER_STAGING_IMPORT_HTTP_HOST_PORT:-18099}:80"
      - "${SDKWORK_WEBSERVER_STAGING_HTTPS_HOST_PORT:-38431}:443"
    env_file:
      - path: env/staging.env
        required: false
    environment:
      SDKWORK_WEBSERVER_CONTAINER_HEALTH_PORT: "3800"
      SDKWORK_WEBSERVER_ENVIRONMENT: staging
      SDKWORK_WEBSERVER_PROFILE_ID: standalone.staging
