# SDKWork Web Server — WSL Ubuntu multi-environment standalone gateway stacks.
#
# Dependency modes (modeled on sdkwork-api-cloud-gateway):
#
#   ① Built-in PostgreSQL + Redis (default):
#      bash bin/docker-deploy.sh install --environment development
#
#   ② External PostgreSQL + Redis:
#      bash bin/docker-deploy.sh install --environment development   # external host deps are the default
#
#   ③ All environments, shared built-in postgres/redis:
#      bash bin/docker-deploy.sh install --environment <env> --embedded
#
# Per-environment env files: deployments/docker/env/<environment>.env
# (copy from deployments/docker/env/<environment>.env.example)

name: sdkwork-webserver

# Bounded json-file log rotation: unbounded container logs eventually fill
# the host disk on long-lived deployments (DEPLOYMENT_SPEC.md §6 runtime
# hardening). Every service in every shipped compose file attaches this.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-webserver-common: &webserver-common
  image: registry.sdkwork.com/apps/sdkwork-webserver-standalone:${SDKWORK_WEBSERVER_IMAGE_TAG:-0.1.0}
  restart: unless-stopped
  logging: *default-logging
  cap_add:
    - NET_BIND_SERVICE
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    SDKWORK_WEBSERVER_IMPORT_LISTENER_PORTS: ${SDKWORK_WEBSERVER_IMPORT_LISTENER_PORTS:-}
    # Universal import plane (ENVIRONMENT_SPEC §6.2.2): comma-separated
    # lifecycle environments one instance imports for every module. Empty
    # keeps the instance's own SDKWORK_WEBSERVER_ENVIRONMENT only; set e.g.
    # "development,test,staging,demo,production" so one server routes all
    # commissioned domain edges of imported modules.
    SDKWORK_WEBSERVER_IMPORT_ENVIRONMENTS: ${SDKWORK_WEBSERVER_IMPORT_ENVIRONMENTS:-}
    SDKWORK_SPACE_ROOT: ${SDKWORK_SPACE_ROOT:-/opt/deploy}
    SDKWORK_SPACE_HOST_PATH: ${SDKWORK_SPACE_HOST_PATH:-/opt/deploy}
    SDKWORK_SPACE_CLONE_URL: ${SDKWORK_SPACE_CLONE_URL:-https://github.com/sdkwork-ai/sdkwork-space.git}
    SDKWORK_SPACE_CLONE_PULL: ${SDKWORK_SPACE_CLONE_PULL:-true}
    # Import every enabled sibling module's deployments/webserver/ from the
    # space checkout (SDKWORK_WEBSERVER_SPEC.md §17); SDKWORK_SPACE_MODULES
    # remains the explicit override.
    SDKWORK_SPACE_AUTO_DISCOVER: ${SDKWORK_SPACE_AUTO_DISCOVER:-true}
    SDKWORK_SPACE_MODULES: ${SDKWORK_SPACE_MODULES:-}
    SDKWORK_WEBSERVER_MODULE_IMPORT_REQUIRED: ${SDKWORK_WEBSERVER_MODULE_IMPORT_REQUIRED:-false}
    SDKWORK_WEBSERVER_MODULE_IMPORT_PROBE_UPSTREAMS: ${SDKWORK_WEBSERVER_MODULE_IMPORT_PROBE_UPSTREAMS:-false}
    # Module /api/ proxy target: docker (sibling container via
    # docker-compose.platform-api-gateway.yml; default), bundled (in-container
    # process), or external.
    SDKWORK_MODULE_API_GATEWAY_DEPLOYMENT: ${SDKWORK_MODULE_API_GATEWAY_DEPLOYMENT:-docker}
    SDKWORK_MODULE_API_GATEWAY_HOST: ${SDKWORK_MODULE_API_GATEWAY_HOST:-}
    SDKWORK_MODULE_API_GATEWAY_PORT: ${SDKWORK_MODULE_API_GATEWAY_PORT:-3900}
    SDKWORK_MODULE_API_GATEWAY_BINARY: ${SDKWORK_MODULE_API_GATEWAY_BINARY:-/app/bin/sdkwork-api-cloud-gateway}
    SDKWORK_MODULE_API_GATEWAY_INSTALL_ROOT: ${SDKWORK_MODULE_API_GATEWAY_INSTALL_ROOT:-/opt/sdkwork/api-gateway}
    SDKWORK_DEPLOY_SANDBOX_KEY: ${SDKWORK_DEPLOY_SANDBOX_KEY:-deploy.local.opt_deploy}
    SDKWORK_DEPLOY_SANDBOX_ROOT: ${SDKWORK_DEPLOY_SANDBOX_ROOT:-/opt/deploy}
    # Drive delivery cache (shared host directory, LRU website content cache):
    # entries are immutable and content-addressed so all instances on the host
    # share one cache under /opt/deploy/drive (DEPLOYMENT_SPEC.md).
    SDKWORK_DRIVE_WEBSITE_CACHE_ENABLED: ${SDKWORK_DRIVE_WEBSITE_CACHE_ENABLED:-true}
    SDKWORK_DRIVE_WEBSITE_CACHE_ROOT: ${SDKWORK_DRIVE_WEBSITE_CACHE_ROOT:-/opt/deploy/drive/website-cache}
    SDKWORK_DRIVE_WEBSITE_CACHE_MAX_TOTAL_BYTES: ${SDKWORK_DRIVE_WEBSITE_CACHE_MAX_TOTAL_BYTES:-8589934592}
    SDKWORK_DRIVE_WEBSITE_CACHE_MAX_ENTRIES: ${SDKWORK_DRIVE_WEBSITE_CACHE_MAX_ENTRIES:-100000}
  volumes:
    - ${SDKWORK_SPACE_HOST_PATH:-/opt/deploy}:/opt/deploy:ro
    - ${SDKWORK_SPACE_CHECKOUT_HOST_PATH:-${SDKWORK_SPACE_HOST_PATH:-/opt/deploy}/sdkwork-space}:/opt/deploy/sdkwork-space:rw
    - ${SDKWORK_MODULE_API_GATEWAY_CHECKOUT_HOST_PATH:-../../../sdkwork-api-cloud-gateway}:/opt/deploy/sdkwork-space/sdkwork-api-cloud-gateway:ro
    - ${SDKWORK_DRIVE_CACHE_HOST_PATH:-/opt/deploy/drive}:/opt/deploy/drive:rw
    - ../../bin/container/entrypoint-standalone.sh:/usr/local/bin/sdkwork-webserver-entrypoint:ro
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "curl -fsS http://127.0.0.1:$${SDKWORK_WEBSERVER_CONTAINER_HEALTH_PORT:-3800}/healthz || exit 1",
      ]
    interval: 15s
    timeout: 5s
    retries: 8
    start_period: 120s

services:
  postgres:
    image: postgres:16-alpine
    profiles: [development, test, staging, production]
    restart: unless-stopped
    logging: *default-logging
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-200}"]
    environment:
      POSTGRES_USER: ${WEBSERVER_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${WEBSERVER_POSTGRES_PASSWORD:?WEBSERVER_POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${WEBSERVER_POSTGRES_DB:-postgres}
      WEBSERVER_POSTGRES_DEV_DB: ${WEBSERVER_POSTGRES_DEV_DB:-sdkwork_ai_dev}
      WEBSERVER_POSTGRES_DEV_USER: ${WEBSERVER_POSTGRES_DEV_USER:-sdkwork_ai_dev}
      WEBSERVER_POSTGRES_DEV_PASSWORD: ${WEBSERVER_POSTGRES_DEV_PASSWORD:-sdkworkdev123}
      WEBSERVER_POSTGRES_TEST_DB: ${WEBSERVER_POSTGRES_TEST_DB:-sdkwork_ai_test}
      WEBSERVER_POSTGRES_TEST_USER: ${WEBSERVER_POSTGRES_TEST_USER:-sdkwork_ai_test}
      WEBSERVER_POSTGRES_TEST_PASSWORD: ${WEBSERVER_POSTGRES_TEST_PASSWORD:-sdkworktest123}
      WEBSERVER_POSTGRES_STAGING_DB: ${WEBSERVER_POSTGRES_STAGING_DB:-sdkwork_ai_staging}
      WEBSERVER_POSTGRES_STAGING_USER: ${WEBSERVER_POSTGRES_STAGING_USER:-sdkwork_ai_staging}
      WEBSERVER_POSTGRES_STAGING_PASSWORD: ${WEBSERVER_POSTGRES_STAGING_PASSWORD:-sdkworkstaging123}
      WEBSERVER_POSTGRES_PROD_DB: ${WEBSERVER_POSTGRES_PROD_DB:-sdkwork_ai_prod}
      WEBSERVER_POSTGRES_PROD_USER: ${WEBSERVER_POSTGRES_PROD_USER:-sdkwork_ai_prod}
      WEBSERVER_POSTGRES_PROD_PASSWORD: ${WEBSERVER_POSTGRES_PROD_PASSWORD:-sdkworkprod123}
    volumes:
      - webserver-postgres-data:/var/lib/postgresql/data
      - ../../bin/container/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${WEBSERVER_POSTGRES_USER:-postgres} -d ${WEBSERVER_POSTGRES_DB:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    profiles: [development, test, staging, production]
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - webserver-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  webserver-development:
    <<: *webserver-common
    profiles: [development]
    container_name: sdkwork-webserver-development
    ports:
      - "${SDKWORK_WEBSERVER_DEV_HOST_PORT:-13800}:3800"
      - "${SDKWORK_WEBSERVER_DEV_IMPORT_HTTP_HOST_PORT:-80}:80"
      - "${SDKWORK_WEBSERVER_DEV_HTTPS_HOST_PORT:-443}:443"
    env_file:
      - path: env/development.env
        required: false
    environment:
      SDKWORK_WEBSERVER_CONTAINER_HEALTH_PORT: "3800"
      SDKWORK_WEBSERVER_ENVIRONMENT: development
      SDKWORK_WEBSERVER_PROFILE_ID: standalone.development
      SDKWORK_DRIVE_WEBSITE_CACHE_ENVIRONMENT: development
      # Skills database host convention expects:
      #   <SDKWORK_SKILLS_APP_ROOT>/database/database.manifest.json
      # We mount only /app/share/sdkwork/skills/database, so set app root
      # to /app/share/sdkwork/skills to match that path convention.
      SDKWORK_SKILLS_APP_ROOT: /app/share/sdkwork/skills
      SDKWORK_CORS_ALLOWED_ORIGINS: ${SDKWORK_CORS_ALLOWED_ORIGINS:-http://server-dev.sdkwork.com,app://dsh,app://birdcoder,app://sdkwork,app://dtupay,tauri://localhost,https://servicewechat.com,https://server-dev.sdkwork.com,https://server-dev.birdcoder.com,http://server-dev.birdcoder.com,https://server-dev.dtupay.com,http://server-dev.dtupay.com,https://server-dev.noaper.com,http://server-dev.noaper.com,https://server-dev.sdkwork.cn,http://server-dev.sdkwork.cn,https://server-dev.birdcoder.cn,http://server-dev.birdcoder.cn,https://server-dev.dtupay.cn,http://server-dev.dtupay.cn,https://server-dev.noaper.cn,http://server-dev.noaper.cn,https://server-dev.skubc.com,http://server-dev.skubc.com,https://server-dev.skubc.cn,http://server-dev.skubc.cn,https://server-dev.zowalk.com,http://server-dev.zowalk.com,https://server-dev.zowalk.cn,http://server-dev.zowalk.cn,https://server-dev.offer86.com,http://server-dev.offer86.com,https://server-dev.offer86.cn,http://server-dev.offer86.cn,https://server-dev.86offer.com,http://server-dev.86offer.com,https://server-dev.86offer.cn,http://server-dev.86offer.cn,https://server-app-dev.sdkwork.com,http://server-app-dev.sdkwork.com,https://server-app-dev.birdcoder.com,http://server-app-dev.birdcoder.com,https://server-app-dev.dtupay.com,http://server-app-dev.dtupay.com,https://server-app-dev.noaper.com,http://server-app-dev.noaper.com,https://server-app-dev.sdkwork.cn,http://server-app-dev.sdkwork.cn,https://server-app-dev.birdcoder.cn,http://server-app-dev.birdcoder.cn,https://server-app-dev.dtupay.cn,http://server-app-dev.dtupay.cn,https://server-app-dev.noaper.cn,http://server-app-dev.noaper.cn,https://server-app-dev.skubc.com,http://server-app-dev.skubc.com,https://server-app-dev.skubc.cn,http://server-app-dev.skubc.cn,https://server-app-dev.zowalk.com,http://server-app-dev.zowalk.com,https://server-app-dev.zowalk.cn,http://server-app-dev.zowalk.cn,https://server-app-dev.offer86.com,http://server-app-dev.offer86.com,https://server-app-dev.offer86.cn,http://server-app-dev.offer86.cn,https://server-app-dev.86offer.com,http://server-app-dev.86offer.com,https://server-app-dev.86offer.cn,http://server-app-dev.86offer.cn,https://server-admin-dev.sdkwork.com,http://server-admin-dev.sdkwork.com,https://server-admin-dev.birdcoder.com,http://server-admin-dev.birdcoder.com,https://server-admin-dev.dtupay.com,http://server-admin-dev.dtupay.com,https://server-admin-dev.noaper.com,http://server-admin-dev.noaper.com,https://server-admin-dev.sdkwork.cn,http://server-admin-dev.sdkwork.cn,https://server-admin-dev.birdcoder.cn,http://server-admin-dev.birdcoder.cn,https://server-admin-dev.dtupay.cn,http://server-admin-dev.dtupay.cn,https://server-admin-dev.noaper.cn,http://server-admin-dev.noaper.cn,https://server-admin-dev.skubc.com,http://server-admin-dev.skubc.com,https://server-admin-dev.skubc.cn,http://server-admin-dev.skubc.cn,https://server-admin-dev.zowalk.com,http://server-admin-dev.zowalk.com,https://server-admin-dev.zowalk.cn,http://server-admin-dev.zowalk.cn,https://server-admin-dev.offer86.com,http://server-admin-dev.offer86.com,https://server-admin-dev.offer86.cn,http://server-admin-dev.offer86.cn,https://server-admin-dev.86offer.com,http://server-admin-dev.86offer.com,https://server-admin-dev.86offer.cn,http://server-admin-dev.86offer.cn}
      SDKWORK_DATABASE_ENGINE: postgresql
      SDKWORK_DATABASE_HOST: ${WEBSERVER_POSTGRES_HOST:-postgres}
      SDKWORK_DATABASE_PORT: ${WEBSERVER_POSTGRES_PORT:-5432}
      SDKWORK_DATABASE_NAME: ${WEBSERVER_POSTGRES_DEV_DB:-sdkwork_ai_dev}
      SDKWORK_DATABASE_SCHEMA: ${WEBSERVER_POSTGRES_DEV_DB:-sdkwork_ai_dev}
      SDKWORK_DATABASE_SCHEMA_FALLBACK_PUBLIC: "false"
      SDKWORK_DATABASE_USERNAME: ${WEBSERVER_POSTGRES_DEV_USER:-sdkwork_ai_dev}
      SDKWORK_DATABASE_PASSWORD: ${WEBSERVER_POSTGRES_DEV_PASSWORD:-sdkworkdev123}
      SDKWORK_DATABASE_SSL_MODE: ${WEBSERVER_POSTGRES_SSL_MODE:-disable}
      SDKWORK_DATABASE_MAX_CONNECTIONS: "10"
      SDKWORK_WEBSERVER_REDIS_ENABLED: "true"
      SDKWORK_WEBSERVER_REDIS_HOST: ${WEBSERVER_REDIS_HOST:-redis}
      SDKWORK_WEBSERVER_REDIS_PORT: ${WEBSERVER_REDIS_PORT:-6379}
      SDKWORK_WEBSERVER_REDIS_DATABASE: "0"
      SDKWORK_WEBSERVER_REDIS_TLS: ${WEBSERVER_REDIS_TLS:-false}
      SDKWORK_WEBSERVER_REDIS_PASSWORD: ${WEBSERVER_REDIS_PASSWORD:-}
    volumes:
      - webserver-secrets-development:/etc/sdkwork/webserver/secrets
      - webserver-data-development:/var/lib/sdkwork/webserver
      - ${SDKWORK_DRIVE_CACHE_HOST_PATH:-/opt/deploy/drive}:/opt/deploy/drive:rw
      - ../../../sdkwork-skills/database:/app/share/sdkwork/skills/database:ro
      - ../../../sdkwork-mcp/database:/app/share/sdkwork/mcp/database:ro
      - ../../../sdkwork-deployments/database:/app/share/sdkwork/deploy/database:ro

    logging: *default-logging
  webserver-test:
    <<: *webserver-common
    profiles: [test]
    container_name: sdkwork-webserver-test
    ports:
      - "${SDKWORK_WEBSERVER_TEST_HOST_PORT:-18888}:3800"
      - "${SDKWORK_WEBSERVER_TEST_IMPORT_HTTP_HOST_PORT:-18898}:80"
      - "${SDKWORK_WEBSERVER_TEST_HTTPS_HOST_PORT:-28430}:443"
    env_file:
      - path: env/test.env
        required: false
    environment:
      SDKWORK_WEBSERVER_CONTAINER_HEALTH_PORT: "3800"
      SDKWORK_WEBSERVER_ENVIRONMENT: test
      SDKWORK_WEBSERVER_PROFILE_ID: standalone.test
      SDKWORK_DRIVE_WEBSITE_CACHE_ENVIRONMENT: test
      SDKWORK_SKILLS_APP_ROOT: /app/share/sdkwork/skills
      SDKWORK_CORS_ALLOWED_ORIGINS: ${SDKWORK_CORS_ALLOWED_ORIGINS:-http://server-test.sdkwork.com,app://dsh,app://birdcoder,app://sdkwork,app://dtupay,tauri://localhost,https://servicewechat.com,https://server-test.sdkwork.com,https://server-test.birdcoder.com,http://server-test.birdcoder.com,https://server-test.dtupay.com,http://server-test.dtupay.com,https://server-test.noaper.com,http://server-test.noaper.com,https://server-test.sdkwork.cn,http://server-test.sdkwork.cn,https://server-test.birdcoder.cn,http://server-test.birdcoder.cn,https://server-test.dtupay.cn,http://server-test.dtupay.cn,https://server-test.noaper.cn,http://server-test.noaper.cn,https://server-test.skubc.com,http://server-test.skubc.com,https://server-test.skubc.cn,http://server-test.skubc.cn,https://server-test.zowalk.com,http://server-test.zowalk.com,https://server-test.zowalk.cn,http://server-test.zowalk.cn,https://server-test.offer86.com,http://server-test.offer86.com,https://server-test.offer86.cn,http://server-test.offer86.cn,https://server-test.86offer.com,http://server-test.86offer.com,https://server-test.86offer.cn,http://server-test.86offer.cn,https://server-app-test.sdkwork.com,http://server-app-test.sdkwork.com,https://server-app-test.birdcoder.com,http://server-app-test.birdcoder.com,https://server-app-test.dtupay.com,http://server-app-test.dtupay.com,https://server-app-test.noaper.com,http://server-app-test.noaper.com,https://server-app-test.sdkwork.cn,http://server-app-test.sdkwork.cn,https://server-app-test.birdcoder.cn,http://server-app-test.birdcoder.cn,https://server-app-test.dtupay.cn,http://server-app-test.dtupay.cn,https://server-app-test.noaper.cn,http://server-app-test.noaper.cn,https://server-app-test.skubc.com,http://server-app-test.skubc.com,https://server-app-test.skubc.cn,http://server-app-test.skubc.cn,https://server-app-test.zowalk.com,http://server-app-test.zowalk.com,https://server-app-test.zowalk.cn,http://server-app-test.zowalk.cn,https://server-app-test.off