# sdkwork-webserver — production environment (external dependencies).
#
# Standalone compose file for the production environment. Uses external
# PostgreSQL and Redis (WSL host-native or remote managed services).
#
# Port mapping: host 18080 -> container 8080
# Domain: server.sdkwork.com
#
# Usage:
#   docker compose -f deployments/docker/docker-compose.production.yml \
#     --env-file deployments/docker/env/production.env up -d
#
#   docker compose -f deployments/docker/docker-compose.production.yml down

name: sdkwork-webserver-production

services:
  webserver:
    image: registry.sdkwork.com/apps/sdkwork-webserver-standalone:${SDKWORK_WEBSERVER_IMAGE_TAG:-0.1.0}
    container_name: sdkwork-webserver-production
    restart: unless-stopped
    ports:
      - "${SDKWORK_WEBSERVER_PROD_HOST_PORT:-18080}:8080"
      - "${SDKWORK_WEBSERVER_PROD_HTTPS_HOST_PORT:-38430}:8430"
    env_file:
      - path: env/production.env
        required: false
    environment:
      SDKWORK_WEBSERVER_CONTAINER_HEALTH_PORT: "8080"
      SDKWORK_WEBSERVER_ENVIRONMENT: production
      SDKWORK_WEBSERVER_PROFILE_ID: standalone.production
      SDKWORK_DEPLOY_APP_ROOT: /app/share/sdkwork/deploy
      SDKWORK_SKILLS_APP_ROOT: /app/share/sdkwork/skills
      SDKWORK_MCP_APP_ROOT: /app/share/sdkwork/mcp
      SDKWORK_SPACE_ROOT: ${SDKWORK_SPACE_ROOT:-/opt/deploy}
      SDKWORK_SPACE_CLONE_URL: ${SDKWORK_SPACE_CLONE_URL:-https://github.com/sdkwork-ai/sdkwork-space.git}
      SDKWORK_SPACE_CLONE_PULL: ${SDKWORK_SPACE_CLONE_PULL:-true}
      SDKWORK_DEPLOY_SANDBOX_KEY: ${SDKWORK_DEPLOY_SANDBOX_KEY:-deploy.local.opt_deploy}
      SDKWORK_DEPLOY_SANDBOX_ROOT: ${SDKWORK_DEPLOY_SANDBOX_ROOT:-/opt/deploy}
      SDKWORK_CORS_ALLOWED_ORIGINS: ${SDKWORK_CORS_ALLOWED_ORIGINS:-http://server.sdkwork.com,http://localhost:18080,http://127.0.0.1:18080}
      SDKWORK_DATABASE_ENGINE: postgresql
      SDKWORK_DATABASE_HOST: ${WEBSERVER_POSTGRES_HOST:-host.docker.internal}
      SDKWORK_DATABASE_PORT: ${WEBSERVER_POSTGRES_PORT:-5432}
      SDKWORK_DATABASE_NAME: ${WEBSERVER_POSTGRES_PROD_DB:-sdkwork_ai_prod}
      SDKWORK_DATABASE_SCHEMA: ${WEBSERVER_POSTGRES_PROD_DB:-sdkwork_ai_prod}
      SDKWORK_DATABASE_SCHEMA_FALLBACK_PUBLIC: "false"
      SDKWORK_DATABASE_USERNAME: ${WEBSERVER_POSTGRES_PROD_USER:-sdkwork_ai_prod}
      SDKWORK_DATABASE_PASSWORD: ${WEBSERVER_POSTGRES_PROD_PASSWORD:-}
      SDKWORK_DATABASE_SSL_MODE: ${WEBSERVER_POSTGRES_SSL_MODE:-disable}
      SDKWORK_DATABASE_MAX_CONNECTIONS: "20"
      SDKWORK_WEBSERVER_REDIS_ENABLED: "true"
      SDKWORK_WEBSERVER_REDIS_HOST: ${WEBSERVER_REDIS_HOST:-host.docker.internal}
      SDKWORK_WEBSERVER_REDIS_PORT: ${WEBSERVER_REDIS_PORT:-6379}
      SDKWORK_WEBSERVER_REDIS_DATABASE: "2"
      SDKWORK_WEBSERVER_REDIS_TLS: ${WEBSERVER_REDIS_TLS:-false}
      SDKWORK_WEBSERVER_REDIS_PASSWORD: ${WEBSERVER_REDIS_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:$${SDKWORK_WEBSERVER_CONTAINER_HEALTH_PORT:-8080}/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s
    volumes:
      - webserver-secrets-production:/etc/sdkwork/webserver/secrets
      - webserver-data-production:/var/lib/sdkwork/webserver
      - webserver-opt-deploy-production:/opt/deploy
      - ./scripts/entrypoint-standalone.sh:/usr/local/bin/sdkwork-webserver-entrypoint:ro
      - ../../../sdkwork-skills/database:/app/share/sdkwork/skills/database:ro
      - ../../../sdkwork-mcp/database:/app/share/sdkwork/mcp/database:ro
      - ../../../sdkwork-deployments/database:/app/share/sdkwork/deploy/database:ro

volumes:
  webserver-secrets-production:
  webserver-data-production:
  webserver-opt-deploy-production:
