    volumes:
      - gateway-data:/var/lib/sdkwork/api-gateway
      - gateway-secrets:/run/secrets/sdkwork/api-gateway
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:${SDKWORK_MODULE_API_GATEWAY_UPSTREAM_PORT:-8080}/readyz >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 240s

  # Knowledgebase RPC sidecar (canonical gateway compose): provisions the
  # mTLS secrets under the shared gateway-secrets volume that the gateway
  # consumes for the IM Knowledgebase RPC client.
  knowledgebase-rpc:
    image: ${SDKWORK_MODULE_API_GATEWAY_IMAGE:-sdkwork-api-cloud-gateway:local}
    entrypoint: ["/opt/sdkwork/api-gateway/container/knowledgebase-rpc-entrypoint"]
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${SDKWORK_KB_RPC_CPU_LIMIT:-1.0}"
          memory: ${SDKWORK_KB_RPC_MEMORY_LIMIT:-1g}
          pids: 256
        reservations:
          cpus: "0.25"
          memory: 256m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      sdkwork:
        aliases:
          - knowledgebase-rpc
    environment:
      SDKWORK_KNOWLEDGEBASE_ENVIRONMENT: ${SDKWORK_WEBSERVER_ENVIRONMENT:?required}
      SDKWORK_KNOWLEDGEBASE_DEPLOYMENT_PROFILE: standalone
      SDKWORK_KNOWLEDGEBASE_RPC_ENABLED: "true"
      SDKWORK_KNOWLEDGEBASE_RPC_BIND_ADDR: 0.0.0.0:50054
      SDKWORK_KNOWLEDGEBASE_RPC_TLS_ENABLED: "true"
      SDKWORK_KNOWLEDGEBASE_RPC_MTLS_ENABLED: "true"
      SDKWORK_KNOWLEDGEBASE_RPC_HEALTH_ENABLED: "true"
      SDKWORK_KNOWLEDGEBASE_RPC_SERVER_CERT_PATH: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/server.crt
      SDKWORK_KNOWLEDGEBASE_RPC_SERVER_KEY_PATH: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/server.key
      SDKWORK_KNOWLEDGEBASE_RPC_CLIENT_CA_CERTIFICATE_PATH: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/ca.crt
      SDKWORK_KNOWLEDGEBASE_RPC_SPIFFE_TRUST_DOMAIN: sdkwork.internal
      SDKWORK_KNOWLEDGEBASE_RPC_IM_CALLER_CONTEXT_SIGNING_KEY_FILE: /run/secrets/sdkwork/api-gateway/knowledgebase-rpc/caller-context.key
      SDKWORK_KNOWLEDGEBASE_DRIVE_STORAGE_ROOT: /var/lib/sdkwork/api-gateway/knowledgebase-drive
      SDKWORK_KNOWLEDGEBASE_OPERATOR_ID: sdkwork-knowledgebase
      SDKWORK_KNOWLEDGEBASE_ACTOR_ID: 1
      SDKWORK_KNOWLEDGEBASE_TENANT_ID: 100001
      SDKWORK_KNOWLEDGEBASE_ORGANIZATION_ID: 1
      SDKWORK_DATABASE_URL: postgresql://${SDKWORK_DATABASE_USERNAME:-sdkwork_ai_dev}:${SDKWORK_DATABASE_PASSWORD:-sdkworkdev123}@${SDKWORK_DATABASE_HOST:-postgres}:${SDKWORK_DATABASE_PORT:-5432}/${SDKWORK_DATABASE_NAME:-sdkwork_ai_dev}?sslmode=${SDKWORK_DATABASE_SSL_MODE:-disable}&options=-c%20search_path%3D${SDKWORK_DATABASE_SCHEMA:-${SDKWORK_DATABASE_NAME:-sdkwork_ai_dev}},public
      SDKWORK_API_CLOUD_GATEWAY_PROVISION_KNOWLEDGEBASE_RPC_SECRETS: "true"
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - gateway-data:/var/lib/sdkwork/api-gateway
      - gateway-secrets:/run/secrets/sdkwork/api-gateway
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/50054'"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

networks:
  sdkwork:
    name: sdkwork-webserver-${SDKWORK_WEBSERVER_ENVIRONMENT:?required}
    external: true

volumes:
  gateway-data:
    name: sdkwork-webserver-${SDKWORK_WEBSERVER_ENVIRONMENT:?required}-gateway-data
    external: true
  gateway-secrets:
    name: sdkwork-webserver-${SDKWORK_WEBSERVER_ENVIRONMENT:?required}-gateway-secrets
    external: true
