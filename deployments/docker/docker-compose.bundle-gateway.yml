# Gateway sibling for the unified install bundle (SDKWORK_WEBSERVER_SPEC.md
# §17.3 / §8.1). Imported cloud-mode sidecars dial the canonical upstream
# `sdkwork-api-cloud-gateway:8080`; this container binds
# SDKWORK_MODULE_API_GATEWAY_UPSTREAM_PORT (default 8080) behind that DNS
# alias on the shared per-environment network. Runs as its own compose project
# sdkwork-webserver-<env>-gateway (managed by deploy.sh).
#
# The environment block is generated from the canonical gateway repository
# docker-compose.yml (docker compose config --format json) so sibling modules
# and embedded routers receive the complete SDKWORK_* matrix. Database URL is
# interpolated from the deployment env file; bind follows the upstream port.

# Bounded json-file log rotation (DEPLOYMENT_SPEC.md §6 runtime hardening).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  gateway:
    image: ${SDKWORK_MODULE_API_GATEWAY_IMAGE:-sdkwork-api-cloud-gateway:local}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      knowledgebase-rpc:
        # Health-gated startup: the gateway serves module /api/ traffic, so
        # waiting for the kb-rpc gRPC health avoids a burst of failed dials
        # during first boot.
        condition: service_healthy
    # Resource governance (OPERATIONS_SPEC.md §6): the gateway terminates
    # module /api/ traffic for 70+ modules — headroom with a hard bound.
    deploy:
      resources:
        limits:
          cpus: "${SDKWORK_MODULE_GATEWAY_CPU_LIMIT:-4.0}"
          memory: ${SDKWORK_MODULE_GATEWAY_MEMORY_LIMIT:-4g}
          pids: 512
        reservations:
          cpus: "0.5"
          memory: 512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      sdkwork:
        aliases:
          - sdkwork-api-cloud-gateway
    environment:
      SDKWORK_API_CLOUD_GATEWAY_BIND: 0.0.0.0:${SDKWORK_MODULE_API_GATEWAY_UPSTREAM_PORT:-8080}
      SDKWORK_DATABASE_URL: postgresql://${SDKWORK_DATABASE_USERNAME:-sdkwork_ai_dev}:${SDKWORK_DATABASE_PASSWORD:-sdkworkdev123}@${SDKWORK_DATABASE_HOST:-postgres}:${SDKWORK_DATABASE_PORT:-5432}/${SDKWORK_DATABASE_NAME:-sdkwork_ai_dev}?sslmode=${SDKWORK_DATABASE_SSL_MODE:-disable}&options=-c%20search_path%3D${SDKWORK_DATABASE_SCHEMA:-${SDKWORK_DATABASE_NAME:-sdkwork_ai_dev}},public
      # Canvas/IM modules persist through the embedded SQLite driver (their
      # schemas use SQLite-only statements such as PRAGMA and cannot run on
      # postgres); the file lives on the gateway-data volume.
      SDKWORK_DATABASE_SQLITE_URL: sqlite:///var/lib/sdkwork/api-gateway/canvas-pages.db?mode=rwc
      IMAGE_DRIVE_OBJECT_STORE_ROOT: /var/lib/sdkwork/api-gateway/image-drive-objects
      RUST_LOG: info
      SDKWORK_API_CLOUD_GATEWAY_ALLOWED_HOSTS: ''
      SDKWORK_API_CLOUD_GATEWAY_DEPLOYMENT_PROFILE: standalone
      SDKWORK_API_CLOUD_GATEWAY_ENVIRONMENT: ${SDKWORK_WEBSERVER_ENVIRONMENT:?required}
      SDKWORK_API_CLOUD_GATEWAY_IAM_ALLOWED_AUDIENCES: sdkwork-api-cloud-gateway
      SDKWORK_API_CLOUD_GATEWAY_MIGRATE_ON_START: true
      SDKWORK_API_CLOUD_GATEWAY_POSTGRES_CA_FILE: ''
      SDKWORK_API_CLOUD_GATEWAY_PROFILE_ID: standalone.${SDKWORK_WEBSERVER_ENVIRONMENT:?required}
      SDKWORK_API_CLOUD_GATEWAY_PROVISION_IAM_SIGNING_MASTER_SECRET: true
      SDKWORK_API_CLOUD_GATEWAY_PROVISION_PAYMENT_CREDENTIAL_KEY: true
      SDKWORK_API_CLOUD_GATEWAY_RUNTIME_TARGET: container
      SDKWORK_API_CLOUD_GATEWAY_WEB_REDIS_URL: redis://${SDKWORK_WEBSERVER_REDIS_HOST:-redis}:${SDKWORK_WEBSERVER_REDIS_PORT:-6379}/2
      # BirdCoder server runtime requires its environment to be explicit
      # (fail-fast at startup); derive it from the deployed webserver env.
      SDKWORK_BIRDCODER_DEPLOYMENT_PROFILE: standalone
      SDKWORK_BIRDCODER_ENVIRONMENT: ${SDKWORK_WEBSERVER_ENVIRONMENT:?required}
      SDKWORK_BIRDCODER_RUNTIME_TARGET: container
      SDKWORK_CLOUDROUTER_API_KEY_PEPPER: cloudrouter-local-dev-pepper-change-me
      SDKWORK_CLOUDROUTER_APP_SESSION_SECRET: cloudrouter-local-dev-app-session-change-me
      SDKWORK_CLOUDROUTER_INTERNAL_GATEWAY_SIGNING_SECRET: cloudrouter-local-dev-signing-secret-change-me
      SDKWORK_CLOUDROUTER_OPEN_API_BASE_URL: http://127.0.0.1:3900
      SDKWORK_CLOUDROUTER_PAYMENT_WEBHOOK_SECRET: cloudrouter-local-dev-payment-webhook-change-me
      SDKWORK_CLOUDROUTER_REDIS_DATABASE: 0
      SDKWORK_CLOUDROUTER_REDIS_ENABLED: true
      SDKWORK_CLOUDROUTER_REDIS_HOST: ${SDKWORK_WEBSERVER_REDIS_HOST:-redis}
      SDKWORK_CLOUDROUTER_REDIS_KEY_PREFIX: cloudrouter
      SDKWORK_CLOUDROUTER_REDIS_MAX_CONNECTIONS: 50
      SDKWORK_CLOUDROUTER_REDIS_PASSWORD: ''
      SDKWORK_CLOUDROUTER_REDIS_PASSWORD_FILE: ''
      SDKWORK_CLOUDROUTER_REDIS_PORT: ${SDKWORK_WEBSERVER_REDIS_PORT:-6379}
      SDKWORK_CLOUDROUTER_REDIS_TLS: false
      SDKWORK_CLOUDROUTER_REDIS_USERNAME: ''
      SDKWORK_CLOUDROUTER_TRUSTED_SUBJECT_SECRET: cloudrouter-local-dev-trusted-subject-change-me
      SDKWORK_CLOUDROUTER_UPSTREAM_CREDENTIAL_KEY_RING: '${SDKWORK_CLOUDROUTER_UPSTREAM_CREDENTIAL_KEY_RING:-{"activeKeyId":"development-local-v1","activeKey":"-H9WLZu6Ou7TZHIOSrl5axiRAK10KOkjrcFbYnWZabk","fingerprintKey":"HiYnoe11mwTzAyCWK0JVfhLahiVMRvZNi_IrxaZgh5o","decryptionKeys":[]}}'
