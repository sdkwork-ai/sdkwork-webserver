# sdkwork-webserver — staging environment (external dependencies).
#
# Standalone compose file for the staging environment: the production-like
# rehearsal tier (ENVIRONMENT_SPEC "standalone.staging"). Same image as every
# other environment ("One image, every environment"); the environment is
# selected at deploy time through env/staging.env.
#
# Port mapping:
#   Management: host 18081 -> container 3800
#   Public data plane: host 18099/38431 -> container 80/443 by default
#   (set SDKWORK_WEBSERVER_STAGING_IMPORT_HTTP_HOST_PORT=80 and
#    SDKWORK_WEBSERVER_STAGING_HTTPS_HOST_PORT=443 for the public edge when
#    development is not using host 80/443).
# Domain: server-staging.sdkwork.com (APP_RUNTIME_TOPOLOGY_NAMING §9 -staging suffix)
#
# Usage:
#   docker compose -f deployments/docker/docker-compose.staging.yml \
#     --env-file deployments/docker/env/staging.env up -d
#
#   docker compose -f deployments/docker/docker-compose.staging.yml down

name: sdkwork-webserver-staging

# Bounded json-file log rotation (DEPLOYMENT_SPEC.md §6 runtime hardening).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  webserver:
    image: registry.sdkwork.com/apps/sdkwork-webserver-standalone:${SDKWORK_WEBSERVER_IMAGE_TAG:-0.1.0}
    container_name: sdkwork-webserver-staging
    restart: unless-stopped
    logging: *default-logging
    # Resource governance (OPERATIONS_SPEC.md §6 runtime hardening): bound
    # CPU / memory / process count so one runaway container cannot starve the
    # host or the co-located per-environment stacks. Env-tunable per
    # deployment; the data plane needs a high fd ceiling.
    deploy:
      resources:
        limits:
          cpus: "${SDKWORK_WEBSERVER_CPU_LIMIT:-4.0}"
          memory: ${SDKWORK_WEBSERVER_MEMORY_LIMIT:-4g}
          pids: 512
        reservations:
          cpus: "0.5"
          memory: 512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${SDKWORK_WEBSERVER_STAGING_HOST_PORT:-18081}:3800"
      - "${SDKWORK_WEBSERVER_STAGING_IMPORT_HTTP_HOST_PORT:-18099}:80"
      - "${SDKWORK_WEBSERVER_STAGING_HTTPS_HOST_PORT:-38431}:443"
    env_file:
      - path: env/staging.env
        required: false
    environment:
      SDKWORK_WEBSERVER_CONTAINER_HEALTH_PORT: "3800"
      SDKWORK_WEBSERVER_ENVIRONMENT: staging
      SDKWORK_WEBSERVER_PROFILE_ID: standalone.staging
      SDKWORK_WEBSERVER_IMPORT_LISTENER_PORTS: ${SDKWORK_WEBSERVER_IMPORT_LISTENER_PORTS:-}
      SDKWORK_DEPLOY_APP_ROOT: /app/share/sdkwork/deploy
      SDKWORK_SKILLS_APP_ROOT: /app/share/sdkwork/skills
      SDKWORK_MCP_APP_ROOT: /app/share/sdkwork/mcp
      SDKWORK_SPACE_ROOT: ${SDKWORK_SPACE_ROOT:-/opt/deploy}
      SDKWORK_SPACE_HOST_PATH: ${SDKWORK_SPACE_HOST_PATH:-/opt/deploy}
      SDKWORK_SPACE_CLONE_URL: ${SDKWORK_SPACE_CLONE_URL:-https://github.com/sdkwork-ai/sdkwork-space.git}
      SDKWORK_SPACE_CLONE_PULL: ${SDKWORK_SPACE_CLONE_PULL:-true}
      # Import every enabled sibling module's deployments/webserver/ from the
      # space checkout (SDKWORK_WEBSERVER_SPEC.md §17); SDKWORK_SPACE_MODULES
      # remains the explicit override.
      SDKWORK_SPACE_AUTO_DISCOVER: ${SDKWORK_SPACE_AUTO_DISCOVER:-true}
      SDKWORK_SPACE_MODULES: ${SDKWORK_SPACE_MODULES:-}
      SDKWORK_WEBSERVER_MODULE_IMPORT_REQUIRED: ${SDKWORK_WEBSERVER_MODULE_IMPORT_REQUIRED:-false}
      SDKWORK_WEBSERVER_MODULE_IMPORT_PROBE_UPSTREAMS: ${SDKWORK_WEBSERVER_MODULE_IMPORT_PROBE_UPSTREAMS:-false}
      SDKWORK_MODULE_API_GATEWAY_DEPLOYMENT: ${SDKWORK_MODULE_API_GATEWAY_DEPLOYMENT:-docker}
      SDKWORK_MODULE_API_GATEWAY_HOST: ${SDKWORK_MODULE_API_GATEWAY_HOST:-}
      SDKWORK_MODULE_API_GATEWAY_PORT: ${SDKWORK_MODULE_API_GATEWAY_PORT:-3900}
      SDKWORK_MODULE_API_GATEWAY_BINARY: ${SDKWORK_MODULE_API_GATEWAY_BINARY:-/app/bin/sdkwork-api-cloud-gateway}
      SDKWORK_MODULE_API_GATEWAY_INSTALL_ROOT: ${SDKWORK_MODULE_API_GATEWAY_INSTALL_ROOT:-/opt/sdkwork/api-gateway}
      SDKWORK_DEPLOY_SANDBOX_KEY: ${SDKWORK_DEPLOY_SANDBOX_KEY:-deploy.local.opt_deploy}
      SDKWORK_DEPLOY_SANDBOX_ROOT: ${SDKWORK_DEPLOY_SANDBOX_ROOT:-/opt/deploy}
      SDKWORK_CORS_ALLOWED_ORIGINS: ${SDKWORK_CORS_ALLOWED_ORIGINS:-http://server-staging.sdkwork.com,http://localhost:18081,http://127.0.0.1:18081,app://dsh,app://birdcoder,app://sdkwork,app://dtupay,tauri://localhost,https://servicewechat.com,https://server-staging.sdkwork.com,https://server-staging.birdcoder.com,http://server-staging.birdcoder.com,https://server-staging.dtupay.com,http://server-staging.dtupay.com,https://server-staging.noaper.com,http://server-staging.noaper.com,https://server-staging.sdkwork.cn,http://server-staging.sdkwork.cn,https://server-staging.birdcoder.cn,http://server-staging.birdcoder.cn,https://server-staging.dtupay.cn,http://server-staging.dtupay.cn,https://server-staging.noaper.cn,http://server-staging.noaper.cn,https://server-staging.skubc.com,http://server-staging.skubc.com,https://server-staging.skubc.cn,http://server-staging.skubc.cn,https://server-staging.zowalk.com,http://server-staging.zowalk.com,https://server-staging.zowalk.cn,http://server-staging.zowalk.cn,https://server-staging.offer86.com,http://server-staging.offer86.com,https://server-staging.offer86.cn,http://server-staging.offer86.cn,https://server-staging.86offer.com,http://server-staging.86offer.com,https://server-staging.86offer.cn,http://server-staging.86offer.cn,https://server-app-staging.sdkwork.com,http://server-app-staging.sdkwork.com,https://server-app-staging.birdcoder.com,http://server-app-staging.birdcoder.com,https://server-app-staging.dtupay.com,http://server-app-staging.dtupay.com,https://server-app-staging.noaper.com,http://server-app-staging.noaper.com,https://server-app-staging.sdkwork.cn,http://server-app-staging.sdkwork.cn,https://server-app-staging.birdcoder.cn,http://server-app-staging.birdcoder.cn,https://server-app-staging.dtupay.cn,http://server-app-staging.dtupay.cn,https://server-app-staging.noaper.cn,http://server-app-staging.noaper.cn,https://server-app-staging.skubc.com,http://server-app-staging.skubc.com,https://server-app-staging.skubc.cn,http://server-app-staging.skubc.cn,https://server-app-staging.zowalk.com,http://server-app-staging.zowalk.com,https://server-app-staging.zowalk.cn,http://server-app-staging.zowalk.cn,https://server-app-staging.offer86.com,http://server-app-staging.offer86.com,https://server-app-staging.offer86.cn,http://server-app-staging.offer86.cn,https://server-app-staging.86offer.com,http://server-app-staging.86offer.com,https://server-app-staging.86offer.cn,http://server-app-staging.86offer.cn,https://server-admin-staging.sdkwork.com,http://server-admin-staging.sdkwork.com,https://server-admin-staging.birdcoder.com,http://server-admin-staging.birdcoder.com,https://server-admin-staging.dtupay.com,http://server-admin-staging.dtupay.com,https://server-admin-staging.noaper.com,http://server-admin-staging.noaper.com,https://server-admin-staging.sdkwork.cn,http://server-admin-staging.sdkwork.cn,https://server-admin-staging.birdcoder.cn,http://server-admin-staging.birdcoder.cn,https://server-admin-staging.dtupay.cn,http://server-admin-staging.dtupay.cn,https://server-admin-staging.noaper.cn,http://server-admin-staging.noaper.cn,https://server-admin-staging.skubc.com,http://server-admin-staging.skubc.com,https://server-admin-staging.skubc.cn,http://server-admin-staging.skubc.cn,https://server-admin-staging.zowalk.com,http://server-admin-staging.zowalk.com,https://server-admin-staging.zowalk.cn,http://server-admin-staging.zowalk.cn,https://server-admin-staging.offer86.com,http://server-admin-staging.offer86.com,https://server-admin-staging.offer86.cn,http://server-admin-staging.offer86.cn,https://server-admin-staging.86offer.com,http://server-admin-staging.86offer.com,https://server-admin-staging.86offer.cn,http://server-admin-staging.86offer.cn}
      SDKWORK_DATABASE_ENGINE: postgresql
      SDKWORK_DATABASE_HOST: ${WEBSERVER_POSTGRES_HOST:-host.docker.internal}
      SDKWORK_DATABASE_PORT: ${WEBSERVER_POSTGRES_PORT:-5432}
      SDKWORK_DATABASE_NAME: ${WEBSERVER_POSTGRES_STAGING_DB:-sdkwork_ai_staging}
      SDKWORK_DATABASE_SCHEMA: ${WEBSERVER_POSTGRES_STAGING_DB:-sdkwork_ai_staging}
      SDKWORK_DATABASE_SCHEMA_FALLBACK_PUBLIC: "false"
      SDKWORK_DATABASE_USERNAME: ${WEBSERVER_POSTGRES_STAGING_USER:-sdkwork_ai_staging}
      SDKWORK_DATABASE_PASSWORD: ${WEBSERVER_POSTGRES_STAGING_PASSWORD:-}
      SDKWORK_DATABASE_SSL_MODE: ${WEBSERVER_POSTGRES_SSL_MODE:-disable}
      SDKWORK_DATABASE_MAX_CONNECTIONS: "20"
      SDKWORK_WEBSERVER_REDIS_ENABLED: "true"
      SDKWORK_WEBSERVER_REDIS_HOST: ${WEBSERVER_REDIS_HOST:-host.docker.internal}
      SDKWORK_WEBSERVER_REDIS_PORT: ${WEBSERVER_REDIS_PORT:-6379}
      SDKWORK_WEBSERVER_REDIS_DATABASE: "3"
      SDKWORK_WEBSERVER_REDIS_TLS: ${WEBSERVER_REDIS_TLS:-false}
      SDKWORK_WEBSERVER_REDIS_PASSWORD: ${WEBSERVER_REDIS_PASSWORD:-}
      # Drive delivery cache (shared host directory, LRU website content cache).
      SDKWORK_DRIVE_WEBSITE_CACHE_ENABLED: ${SDKWORK_DRIVE_WEBSITE_CACHE_ENABLED:-true}
      SDKWORK_DRIVE_WEBSITE_CACHE_ROOT: ${SDKWORK_DRIVE_WEBSITE_CACHE_ROOT:-/opt/deploy/drive/website-cache}
      SDKWORK_DRIVE_WEBSITE_CACHE_ENVIRONMENT: staging
      SDKWORK_DRIVE_WEBSITE_CACHE_MAX_TOTAL_BYTES: ${SDKWORK_DRIVE_WEBSITE_CACHE_MAX_TOTAL_BYTES:-8589934592}
      SDKWORK_DRIVE_WEBSITE_CACHE_MAX_ENTRIES: ${SDKWORK_DRIVE_WEBSITE_CACHE_MAX_ENTRIES:-100000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:$${SDKWORK_WEBSERVER_CONTAINER_HEALTH_PORT:-3800}/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s
    volumes:
      - webserver-secrets-staging:/etc/sdkwork/webserver/secrets
      - webserver-data-staging:/var/lib/sdkwork/webserver
      - ${SDKWORK_DRIVE_CACHE_HOST_PATH:-/opt/deploy/drive}:/opt/deploy/drive:rw
      - ${SDKWORK_SPACE_HOST_PATH:-/opt/deploy}:/opt/deploy:ro
      - ${SDKWORK_SPACE_CHECKOUT_HOST_PATH:-${SDKWORK_SPACE_HOST_PATH:-/opt/deploy}/sdkwork-space}:/opt/deploy/sdkwork-space:rw
      - ${SDKWORK_MODULE_API_GATEWAY_CHECKOUT_HOST_PATH:-../../../sdkwork-api-cloud-gateway}:/opt/deploy/sdkwork-space/sdkwork-api-cloud-gateway:ro
      - ../../bin/container/entrypoint-standalone.sh:/usr/local/bin/sdkwork-webserver-entrypoint:ro
      # Mount workspace-built gateway so imports.d/import.conf aggregator works
      # (registry 0.1.0 rejects multi-module full nginx sidecars).
      - ../../target/release/sdkwork-api-webserver-standalone-gateway:/app/bin/sdkwork-api-webserver-standalone-gateway:ro
      - ../../../sdkwork-skills/database:/app/share/sdkwork/skills/database:ro
      - ../../../sdkwork-mcp/database:/app/share/sdkwork/mcp/database:ro
      - ../../../sdkwork-deployments/database:/app/share/sdkwork/deploy/database:ro

volumes:
  webserver-secrets-staging:
  webserver-data-staging:
