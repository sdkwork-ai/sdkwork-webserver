# Production — port 80 domain routing to host-mapped container port 18080.
# Domains: server.sdkwork.com, server.birdcoder.com, server.dtupay.com
#
# For public HTTPS, add a TLS server block and ACME issuance after DNS resolves.

upstream sdkwork_webserver_production {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name
        server.sdkwork.com
        server.birdcoder.com
        server.dtupay.com;

    location / {
        proxy_pass http://sdkwork_webserver_production;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
