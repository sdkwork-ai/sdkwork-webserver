# Test — port 80 domain routing to host-mapped container port 18888.
# Domains: server-test.sdkwork.com, server-test.birdcoder.com, server-test.dtupay.com

upstream sdkwork_webserver_test {
    server 127.0.0.1:18888;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name
        server-test.sdkwork.com
        server-test.birdcoder.com
        server-test.dtupay.com;

    location / {
        proxy_pass http://sdkwork_webserver_test;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
