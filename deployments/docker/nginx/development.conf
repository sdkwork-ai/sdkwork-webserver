# Development — port 80 domain routing to host-mapped container port 13800.
# Domains: server-dev.sdkwork.com, server-dev.birdcoder.com, server-dev.dtupay.com

upstream sdkwork_webserver_development {
    server 127.0.0.1:13800;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name
        server-dev.sdkwork.com
        server-dev.birdcoder.com
        server-dev.dtupay.com;

    location / {
        proxy_pass http://sdkwork_webserver_development;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
