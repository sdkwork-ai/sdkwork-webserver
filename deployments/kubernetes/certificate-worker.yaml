# SDKWork Web Server certificate worker (cloud profile).
#
# The certificate worker owns the durable certificate operation queue:
# pending issuance and renewal operations are claimed with SKIP LOCKED leases,
# executed against the ACME CA, and finalized into immutable certificate
# versions. After every successful operation it projects the node's listener
# certificate bindings into the self-hosted TLS runtime material root and
# snapshot file the data plane watches for hot reload (no nginx involved).
#
# Run exactly one replica: the worker id must stay stable because operation
# leases and ACME account credentials are keyed by process identity. The
# `sdkwork-webserver-certificate-state` PVC carries the encrypted ACME account
# credentials, the HTTP-01 challenge webroot, and the TLS material root; it
# must be shared with the data plane workload when self-hosted TLS hot reload
# (`tlsRuntime=assignment`) and HTTP-01 challenge serving are enabled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-webserver-certificate-worker
  labels:
    app.kubernetes.io/name: sdkwork-webserver
    app.kubernetes.io/component: certificate-worker
    app.kubernetes.io/part-of: sdkwork-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sdkwork-webserver
      app.kubernetes.io/component: certificate-worker
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sdkwork-webserver
        app.kubernetes.io/component: certificate-worker
        app.kubernetes.io/part-of: sdkwork-webserver
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: certificate-worker
          image: registry.sdkwork.com/apps/sdkwork-webserver@sha256:__SDKWORK_IMAGE_DIGEST__
          imagePullPolicy: IfNotPresent
          command:
            - /app/bin/sdkwork-webserver-certificate-worker
          # The worker is a loop, not an HTTP service: liveness is the
          # per-cycle heartbeat file the binary touches (the loop cadence is
          # seconds; the watchdog bounds one cycle at one minute), so a
          # wedged reactor is restarted instead of holding its lease until
          # expiry.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/worker-heartbeat 2>/dev/null || echo 0) )) -lt 600
            periodSeconds: 30
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/worker-heartbeat 2>/dev/null || echo 0) )) -lt 600
            periodSeconds: 60
            failureThreshold: 3
          env:
            - name: SDKWORK_WEBSERVER_ENVIRONMENT
              value: production
            - name: SDKWORK_WEBSERVER_DEPLOYMENT_PROFILE
              value: cloud
            - name: SDKWORK_WEBSERVER_PROFILE_ID
              value: cloud.production
            - name: SDKWORK_WEBSERVER_SNOWFLAKE_NODE_ID
              value: "10001"
            - name: SDKWORK_WEBSERVER_CERT_WORKER_ID
              value: certificate-worker-0
            - name: SDKWORK_WEBSERVER_CERT_OPERATION_POLL_INTERVAL_SECS
              value: "5"
            - name: SDKWORK_WEBSERVER_CERT_RENEW_SCAN_INTERVAL_SECS
              value: "3600"
            - name: SDKWORK_WEBSERVER_CERT_RENEW_BEFORE_DAYS
              value: "30"
            - name: SDKWORK_WEBSERVER_CERT_WORKER_HEARTBEAT_PATH
              value: /tmp/worker-heartbeat
            - name: SDKWORK_WEBSERVER_SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: sdkwork-webserver-runtime
                  key: secret-encryption-key
            - name: SDKWORK_WEBSERVER_ACME_DIRECTORY_URL
              value: https://acme-v02.api.letsencrypt.org/directory
            - name: SDKWORK_WEBSERVER_ACME_PROFILE
              value: production
            - name: SDKWORK_WEBSERVER_ACME_CONTACT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-webserver-runtime
                  key: acme-contact-email
            - name: SDKWORK_WEBSERVER_ACME_OPERATION_TIMEOUT_MS
              value: "180000"
            - name: SDKWORK_WEBSERVER_ACME_WEBROOT
              value: /var/lib/sdkwork/webserver/acme-webroot
            - name: SDKWORK_WEBSERVER_ACME_ACCOUNT_ROOT
              value: /var/lib/sdkwork/webserver/acme-accounts
            - name: SDKWORK_WEBSERVER_NODE_UUID
              valueFrom:
                secretKeyRef:
                  name: __SDKWORK_WEBSITE_NODE_SECRET_NAME__
                  key: node-uuid
            - name: SDKWORK_WEBSERVER_TLS_MATERIAL_ROOT
              value: /var/lib/sdkwork/webserver/tls-materials
            - name: SDKWORK_WEBSERVER_TLS_RUNTIME_SNAPSHOT_FILE
              value: /var/lib/sdkwork/webserver/tls-materials/tls-runtime.json
            - name: SDKWORK_WEBSERVER_TLS_SNAPSHOT_ALPN
              value: h2,http/1.1
            - name: SDKWORK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sdkwork-webserver-runtime
                  key: database-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: certificate-state
              mountPath: /var/lib/sdkwork/webserver
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: certificate-state
          persistentVolumeClaim:
            claimName: sdkwork-webserver-certificate-state
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sdkwork-webserver-certificate-state
  labels:
    app.kubernetes.io/name: sdkwork-webserver
    app.kubernetes.io/component: certificate-worker
    app.kubernetes.io/part-of: sdkwork-webserver
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
