# Standalone deltas per SDKWORK_WEBSERVER_SPEC.md: inherits server.common.toml.
# Target matches topology defaults.gatewayBind (127.0.0.1:3800). Per-environment
# binds (standalone.test :8888, standalone.production :8080) are resolved from
# etc/topology/<profile>.env by deploy tooling; do not hardcode placeholder ports.
profile = "standalone"

[[http.upstream]]
name = "gateway"
[[http.upstream.target]]
address = "127.0.0.1:3800"
weight = 1
maxFails = 3
failTimeout = "10s"
