# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/webserver/webserver.pid;
error_log /var/log/sdkwork/webserver/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3800;
    }
    server {
        listen 80;
        server_name server-staging.sdkwork.com server-staging.birdcoder.com server-staging.dtupay.com server-staging.sdkwork.cn server-staging.birdcoder.cn server-staging.dtupay.cn server-staging.skubc.com server-staging.skubc.cn server-staging.zowalk.com server-staging.zowalk.cn server-staging.offer86.com server-staging.offer86.cn server-staging.86offer.com server-staging.86offer.cn server-app-staging.sdkwork.com server-app-staging.birdcoder.com server-app-staging.dtupay.com server-app-staging.sdkwork.cn server-app-staging.birdcoder.cn server-app-staging.dtupay.cn server-app-staging.skubc.com server-app-staging.skubc.cn server-app-staging.zowalk.com server-app-staging.zowalk.cn server-app-staging.offer86.com server-app-staging.offer86.cn server-app-staging.86offer.com server-app-staging.86offer.cn server-admin-staging.sdkwork.com server-admin-staging.birdcoder.com server-admin-staging.dtupay.com server-admin-staging.sdkwork.cn server-admin-staging.birdcoder.cn server-admin-staging.dtupay.cn server-admin-staging.skubc.com server-admin-staging.skubc.cn server-admin-staging.zowalk.com server-admin-staging.zowalk.cn server-admin-staging.offer86.com server-admin-staging.offer86.cn server-admin-staging.86offer.com server-admin-staging.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
