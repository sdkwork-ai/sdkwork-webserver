# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/webserver/webserver.pid;
error_log /var/log/sdkwork/webserver/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3800;
    }
    server {
        listen 80;
        server_name server-test.sdkwork.com server-test.birdcoder.com server-test.dtupay.com server-test.sdkwork.cn server-test.birdcoder.cn server-test.dtupay.cn server-app-test.sdkwork.com server-app-test.birdcoder.com server-app-test.dtupay.com server-app-test.sdkwork.cn server-app-test.birdcoder.cn server-app-test.dtupay.cn server-admin-test.sdkwork.com server-admin-test.birdcoder.com server-admin-test.dtupay.com server-admin-test.sdkwork.cn server-admin-test.birdcoder.cn server-admin-test.dtupay.cn;
        location /api/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }
        location / {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
