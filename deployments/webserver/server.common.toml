# SDKWork Web Server module web server configuration per
# SDKWORK_WEBSERVER_SPEC.md (layout v2). Shared baseline inherited by both
# deployment profiles. Hosts follow topology cloudPublicHosts and
# APP_RUNTIME_TOPOLOGY_NAMING.md §9.2 (role host server; applicationCode webserver).
# Upstream targets are profile-specific (server.standalone.toml / server.cloud.toml).
specVersion = 1
kind = "sdkwork.webserver.server"
id = "webserver"
description = "SDKWork Web Server module: website delivery edge and management API hosts"

[nginx]
enabled = true
profile = "http-core-v1"
unknownDirectivePolicy = "error"
strict = true
confFile = "nginx.conf"

[main]
user = "sdkwork"
workerProcesses = "auto"
pid = "/run/sdkwork/webserver/webserver.pid"
errorLog = "/var/log/sdkwork/webserver/webserver/error.log warn"

[main.events]
workerConnections = 1024

[http]
sendfile = true
tcpNopush = true
tcpNodelay = true
keepaliveTimeout = 75
clientMaxBodySize = "1100m"
serverTokens = "off"
gzip = true
gzipTypes = ["text/css", "application/javascript", "application/json", "image/svg+xml"]
map = ["$http_upgrade $connection_upgrade default upgrade"]

[http.certificates.sdkwork]
# Wildcard/SAN certificate covering *.sdkwork.com per NGINX_SPEC section 3.
certFile = "/opt/certs/letsencrypt/live/sdkwork.com/fullchain.pem"
certKeyFile = "/opt/certs/letsencrypt/live/sdkwork.com/privkey.pem"
chainFile = "/opt/certs/letsencrypt/live/sdkwork.com/chain.pem"
ocspStapling = true

# Shared upstream definition; target set is profile-specific.
[[http.upstream]]
name = "gateway"
loadBalancing = "least-connections"
keepalive = 32

# ---------------------------------------------------------------------------
# Production public ingress (application.public-ingress)
# ---------------------------------------------------------------------------
[[http.server]]
listen = ["443 ssl", "80"]
serverName = ["server.sdkwork.com"]
http2 = true
# Edge nginx for sdkwork-webserver is reverse-proxy only (deploy.yaml mode: api).
# Adaptive Web PC/H5, website delivery, and static roots are owned by the
# sdkwork-webserver process — not stock nginx file roots (SDKWORK_DEPLOY_SPEC.md §7 / §8).
# Process roots: runtime config.toml [app_roots] / SDKWORK_WEBSERVER_*_STATIC_ROOT
# (pc vs h5 vs static-fallback; optional *_by_environment maps). See
# SDKWORK_WEBSERVER_SPEC.md §13.6 and etc/examples/config.toml.example.

[http.server.tls]
cert = "sdkwork"
protocols = ["TLSv1.2", "TLSv1.3"]
preferServerCiphers = true
sessionCache = "shared:SSL:10m"

[[http.server.location]]
match = "/api/"
proxyPass = "http://gateway"
proxySetHeader = ["Host $host", "X-Real-IP $remote_addr", "X-Forwarded-For $proxy_add_x_forwarded_for", "X-Forwarded-Proto $scheme"]
proxyHttpVersion = "1.1"
proxyBuffering = false
proxyReadTimeout = "120s"
proxySendTimeout = "120s"

[[http.server.location]]
match = "/app/"
proxyPass = "http://gateway"
proxySetHeader = ["Host $host", "X-Forwarded-For $proxy_add_x_forwarded_for", "X-Forwarded-Proto $scheme"]
proxyHttpVersion = "1.1"
proxyReadTimeout = "120s"

[[http.server.location]]
match = "/backend/"
proxyPass = "http://gateway"
proxySetHeader = ["Host $host", "X-Forwarded-For $proxy_add_x_forwarded_for", "X-Forwarded-Proto $scheme"]
proxyHttpVersion = "1.1"
proxyReadTimeout = "120s"

[[http.server.location]]
match = "= /healthz"
proxyPass = "http://gateway"
proxyHttpVersion = "1.1"
proxySetHeader = ["Host $host"]

[[http.server.location]]
match = "= /readyz"
proxyPass = "http://gateway"
proxyHttpVersion = "1.1"
proxySetHeader = ["Host $host"]

[[http.server.location]]
match = "/"
proxyPass = "http://gateway"
proxySetHeader = ["Host $host", "X-Real-IP $remote_addr", "X-Forwarded-For $proxy_add_x_forwarded_for", "X-Forwarded-Proto $scheme"]
proxyHttpVersion = "1.1"
proxyBuffering = false
proxyReadTimeout = "120s"
proxySendTimeout = "120s"

# ---------------------------------------------------------------------------
# Production app-api host (application.app-http)
# ---------------------------------------------------------------------------
[[http.server]]
listen = ["443 ssl", "80"]
serverName = ["server-app.sdkwork.com"]
http2 = true

[http.server.tls]
cert = "sdkwork"
protocols = ["TLSv1.2", "TLSv1.3"]

[[http.server.location]]
match = "/app/"
proxyPass = "http://gateway"
proxySetHeader = ["Host $host", "X-Forwarded-For $proxy_add_x_forwarded_for", "X-Forwarded-Proto $scheme"]
proxyHttpVersion = "1.1"
proxyReadTimeout = "120s"

[[http.server.location]]
match = "/"
returnStatus = 404
returnBody = "not found"

# ---------------------------------------------------------------------------
# Production backend-admin host (application.backend-http)
# ---------------------------------------------------------------------------
[[http.server]]
listen = ["443 ssl", "80"]
serverName = ["server-admin.sdkwork.com"]
http2 = true

[http.server.tls]
cert = "sdkwork"
protocols = ["TLSv1.2", "TLSv1.3"]

[[http.server.location]]
match = "/backend/"
proxyPass = "http://gateway"
proxySetHeader = ["Host $host", "X-Forwarded-For $proxy_add_x_forwarded_for", "X-Forwarded-Proto $scheme"]
proxyHttpVersion = "1.1"
proxyReadTimeout = "120s"

[[http.server.location]]
match = "/"
returnStatus = 404
returnBody = "not found"

