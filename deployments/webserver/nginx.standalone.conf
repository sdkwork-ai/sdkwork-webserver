# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/webserver/webserver.pid;
error_log /var/log/sdkwork/webserver/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    map $http_upgrade $connection_upgrade {
        default default upgrade;
    }
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:3800 max_fails=3 fail_timeout=10s;
    }
    server {
        listen 443 ssl;
        listen 80;
        server_name server.sdkwork.com;
        http2 on;
        ssl_certificate /opt/certs/letsencrypt/live/sdkwork.com/fullchain.pem;
        ssl_certificate_key /opt/certs/letsencrypt/live/sdkwork.com/privkey.pem;
        ssl_trusted_certificate /opt/certs/letsencrypt/live/sdkwork.com/chain.pem;
        ssl_stapling on;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        location /api/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
        location /app/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
        }
        location /backend/ {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 120s;
        }
        location = /healthz {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
        }
        location = /readyz {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
        }
        location / {
            proxy_pass http://gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
    server {
        listen 443 ssl;
        listen 80;
        server_name server-app.sdkwork.com;
        http2 on;
        ssl_certificate /opt/certs/letsencrypt/live/sdkwork.com/fullchain.pem;
