include = ["snippets/gateway-locations.nonproduction.conf"]


# Secure-response baseline for the product console family (SECURITY_SPEC
# secure-response-headers; the proxied API plane carries the gateway's own
# baseline). HSTS is a typed field so the response policy emits it only over
# HTTPS; a raw add_header would leak the field onto plaintext responses. CSP
# stays unset here: the console shell injects its credential-entry bootstrap
# script and loads bundled assets, so the policy needs the shell's actual
# resource inventory rather than a guessed default.
[http.server.securityHeaders]
xFrameOptions = "DENY"
referrerPolicy = "strict-origin-when-cross-origin"

[http.server.securityHeaders.strictTransportSecurity]
maxAgeSeconds = 31536000
includeSubDomains = true
