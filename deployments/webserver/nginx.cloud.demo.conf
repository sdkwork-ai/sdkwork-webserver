# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/webserver/webserver.pid;
error_log /var/log/sdkwork/webserver/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name server-demo.sdkwork.com server-demo.birdcoder.com server-demo.dtupay.com server-demo.noaper.com server-demo.sdkwork.cn server-demo.birdcoder.cn server-demo.dtupay.cn server-demo.noaper.cn server-demo.skubc.com server-demo.skubc.cn server-demo.zowalk.com server-demo.zowalk.cn server-demo.offer86.com server-demo.offer86.cn server-demo.86offer.com server-demo.86offer.cn server-app-demo.sdkwork.com server-app-demo.birdcoder.com server-app-demo.dtupay.com server-app-demo.noaper.com server-app-demo.sdkwork.cn server-app-demo.birdcoder.cn server-app-demo.dtupay.cn server-app-demo.noaper.cn server-app-demo.skubc.com server-app-demo.skubc.cn server-app-demo.zowalk.com server-app-demo.zowalk.cn server-app-demo.offer86.com server-app-demo.offer86.cn server-app-demo.86offer.com server-app-demo.86offer.cn server-admin-demo.sdkwork.com server-admin-demo.birdcoder.com server-admin-demo.dtupay.com server-admin-demo.noaper.com server-admin-demo.sdkwork.cn server-admin-demo.birdcoder.cn server-admin-demo.dtupay.cn server-admin-demo.noaper.cn server-admin-demo.skubc.com server-admin-demo.skubc.cn server-admin-demo.zowalk.com server-admin-demo.zowalk.cn server-admin-demo.offer86.com server-admin-demo.offer86.cn server-admin-demo.86offer.com server-admin-demo.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
