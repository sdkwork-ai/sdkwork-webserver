# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/webserver/webserver.pid;
error_log /var/log/sdkwork/webserver/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name server-dev.sdkwork.com server-dev.birdcoder.com server-dev.dtupay.com server-dev.sdkwork.cn server-dev.birdcoder.cn server-dev.dtupay.cn server-dev.skubc.com server-dev.skubc.cn server-dev.zowalk.com server-dev.zowalk.cn server-dev.offer86.com server-dev.offer86.cn server-dev.86offer.com server-dev.86offer.cn server-app-dev.sdkwork.com server-app-dev.birdcoder.com server-app-dev.dtupay.com server-app-dev.sdkwork.cn server-app-dev.birdcoder.cn server-app-dev.dtupay.cn server-app-dev.skubc.com server-app-dev.skubc.cn server-app-dev.zowalk.com server-app-dev.zowalk.cn server-app-dev.offer86.com server-app-dev.offer86.cn server-app-dev.86offer.com server-app-dev.86offer.cn server-admin-dev.sdkwork.com server-admin-dev.birdcoder.com server-admin-dev.dtupay.com server-admin-dev.sdkwork.cn server-admin-dev.birdcoder.cn server-admin-dev.dtupay.cn server-admin-dev.skubc.com server-admin-dev.skubc.cn server-admin-dev.zowalk.com server-admin-dev.zowalk.cn server-admin-dev.offer86.com server-admin-dev.offer86.cn server-admin-dev.86offer.com server-admin-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
