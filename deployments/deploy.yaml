version: 2
defaultProfile: cloud.production
profiles:
  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - tls: sdkwork.com
        mode: web
        web: adaptive
        domain: server-admin.sdkwork.com
        aliases:
          - server-app.sdkwork.com
          - server.sdkwork.com
      - tls: birdcoder.com
        mode: web
        web: adaptive
        domain: server-admin.birdcoder.com
        aliases:
          - server-app.birdcoder.com
          - server.birdcoder.com
      - tls: dtupay.com
        mode: web
        web: adaptive
        domain: server-admin.dtupay.com
        aliases:
          - server-app.dtupay.com
          - server.dtupay.com
      - tls: sdkwork.cn
        mode: web
        web: adaptive
        domain: server-admin.sdkwork.cn
        aliases:
          - server-app.sdkwork.cn
          - server.sdkwork.cn
      - tls: birdcoder.cn
        mode: web
        web: adaptive
        domain: server-admin.birdcoder.cn
        aliases:
          - server-app.birdcoder.cn
          - server.birdcoder.cn
      - tls: dtupay.cn
        mode: web
        web: adaptive
        domain: server-admin.dtupay.cn
        aliases:
          - server-app.dtupay.cn
          - server.dtupay.cn
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.production
        env: etc/topology/cloud.production.env
      kubernetes:
        reference: deployments/kubernetes/
      websiteDelivery:
        servicePattern: sdkwork-webserver-website-{tenantFleetName}
        providerEventServicePattern: sdkwork-webserver-events-{tenantFleetName}-{nodeName}
        tenantFleetName: required-opaque-tf-base32-render-input
        tenantScope: node-secret-only
        hostRouting: runtime-set
        tlsRouting: external-ingress
        tlsRuntimeActivation: deferred
        listenerConfig: per-node-immutable-config-map
        trustedProxyCidrs: required-render-input
        customDomains: true
  cloud.test:
