name: sdkwork_webserver_flutter_mobile
description: SDKWork Web Server Flutter Mobile Application
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  sdkwork_webserver_flutter_mobile_core:
    path: packages/sdkwork_webserver_flutter_mobile_core
  sdkwork_webserver_flutter_mobile_commons:
    path: packages/sdkwork_webserver_flutter_mobile_commons
  sdkwork_webserver_flutter_mobile_shell:
    path: packages/sdkwork_webserver_flutter_mobile_shell
  sdkwork_webserver_flutter_mobile_applications:
    path: packages/sdkwork_webserver_flutter_mobile_applications

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  sdkwork_common_flutter:
    path: ../../../sdkwork-sdk-commons/sdkwork-sdk-common-flutter

flutter:
  uses-material-design: true
