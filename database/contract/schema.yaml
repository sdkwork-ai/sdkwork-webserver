schema_version: 1
kind: sdkwork.database.schema
database_role: authoritative-server
module_id: webserver
contract_version: 1.6.0
owner_team: web-platform
compliance_level: L2
engines:
  - postgres
table_prefix: webserver_
tables:
  - name: webserver_site
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      organization_id: { type: int64, required: true }
      data_scope: { type: enum_int32, required: true }
      user_id: { type: int64, required: false }
      name: { type: string, required: true }
      slug: { type: string, required: true }
      description: { type: string, required: false }
      application_type: { type: string, required: true }
      site_type: { type: enum_int32, required: true }
      status: { type: enum_int32, required: true }
      runtime_config: { type: json, required: true }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
      deleted_at: { type: instant, required: false }
      deleted_by: { type: int64, required: false }
    constraints:
      - { name: webserver_site_pkey, type: primary_key, columns: [id] }
      - { name: uk_webserver_site_uuid, type: unique, columns: [uuid] }
      - { name: uk_webserver_site_tenant_id, type: unique, columns: [tenant_id, id] }
      - { name: uk_webserver_site_slug, type: unique, columns: [tenant_id, slug] }
      - { name: chk_webserver_site_application_type, type: check }
      - { name: chk_webserver_site_type, type: check }
      - { name: chk_webserver_site_status, type: check }
    indexes:
      - { name: uk_webserver_site_uuid, columns: [uuid], unique: true }
      - { name: uk_webserver_site_tenant_id, columns: [tenant_id, id], unique: true }
      - { name: uk_webserver_site_slug, columns: [tenant_id, slug], unique: true, predicate: "deleted_at IS NULL" }
      - { name: idx_webserver_site_tenant_status_updated, columns: [tenant_id, organization_id, status, updated_at] }
      - { name: idx_webserver_site_tenant_application_type_updated, columns: [tenant_id, application_type, updated_at] }
      - { name: idx_webserver_site_user_updated, columns: [tenant_id, user_id, updated_at] }
      - { name: idx_webserver_site_slug, columns: [tenant_id, slug] }
  - name: webserver_root_domain
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      organization_id: { type: int64, required: true }
      hostname: { type: string, required: true }
      display_name: { type: string, required: false }
      dns_provider: { type: string, required: false }
      provider_zone_ref: { type: string, required: false }
      status: { type: enum_int32, required: true }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
      deleted_at: { type: instant, required: false }
    constraints:
      - { name: webserver_root_domain_pkey, type: primary_key, columns: [id] }
      - { name: uk_webserver_root_domain_uuid, type: unique, columns: [uuid] }
      - { name: uk_webserver_root_domain_tenant_id, type: unique, columns: [tenant_id, id] }
      - { name: chk_webserver_root_domain_status, type: check }
    indexes:
      - { name: uk_webserver_root_domain_uuid, columns: [uuid], unique: true }
      - { name: uk_webserver_root_domain_tenant_id, columns: [tenant_id, id], unique: true }
      - { name: uk_webserver_root_domain_active_hostname, columns: [hostname], unique: true, predicate: "deleted_at IS NULL" }
      - { name: idx_webserver_root_domain_tenant_updated, columns: [tenant_id, updated_at, id] }
  - name: webserver_domain
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      organization_id: { type: int64, required: true }
      user_id: { type: int64, required: false }
      root_domain_id: { type: int64, required: true }
      hostname: { type: string, required: true }
      hostname_type: { type: string, required: true }
      verification_status: { type: string, required: true }
      verified_at: { type: instant, required: false }
      status: { type: enum_int32, required: true }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
      deleted_at: { type: instant, required: false }
    constraints:
      - { name: webserver_domain_pkey, type: primary_key, columns: [id] }
      - { name: uk_webserver_domain_uuid, type: unique, columns: [uuid] }
      - { name: uk_webserver_domain_tenant_id, type: unique, columns: [tenant_id, id] }
      - name: fk_webserver_domain_root_domain
        type: foreign_key
        columns: [tenant_id, root_domain_id]
        references_table: webserver_root_domain
        references_columns: [tenant_id, id]
      - { name: chk_webserver_domain_hostname_type, type: check }
      - { name: chk_webserver_domain_verification_status, type: check }
      - { name: chk_webserver_domain_verified_at, type: check }
      - { name: chk_webserver_domain_status, type: check }
    indexes:
      - { name: uk_webserver_domain_uuid, columns: [uuid], unique: true }
      - { name: uk_webserver_domain_tenant_id, columns: [tenant_id, id], unique: true }
      - { name: uk_webserver_domain_active_hostname, columns: [hostname], unique: true, predicate: "deleted_at IS NULL" }
      - { name: idx_webserver_domain_tenant_status, columns: [tenant_id, status, updated_at, id], predicate: "deleted_at IS NULL" }
      - { name: idx_webserver_domain_root_updated, columns: [tenant_id, root_domain_id, updated_at, id], predicate: "deleted_at IS NULL" }
      - { name: idx_webserver_domain_user_updated, columns: [tenant_id, user_id, updated_at, id], predicate: "user_id IS NOT NULL AND deleted_at IS NULL" }
  - name: webserver_domain_verification
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      domain_id: { type: int64, required: true }
      method: { type: string, required: true }
      record_name: { type: string, required: true }
      proof_sha256: { type: string, required: true }
      status: { type: string, required: true }
      observed_sha256: { type: string, required: false }
      attempt_count: { type: int32, required: true }
      next_attempt_at: { type: instant, required: false }
      expires_at: { type: instant, required: true }
      checked_at: { type: instant, required: false }
      verified_at: { type: instant, required: false }
      failure_code: { type: string, required: false }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
    constraints:
      - { name: webserver_domain_verification_pkey, type: primary_key, columns: [id] }
      - { name: uk_webserver_domain_verification_uuid, type: unique, columns: [uuid] }
      - name: fk_webserver_domain_verification_domain
        type: foreign_key
        columns: [tenant_id, domain_id]
        references_table: webserver_domain
        references_columns: [tenant_id, id]
      - { name: chk_webserver_domain_verification_method, type: check }
      - { name: chk_webserver_domain_verification_status, type: check }
      - { name: chk_webserver_domain_verification_hash, type: check }
      - { name: chk_webserver_domain_verification_attempts, type: check }
    indexes:
      - { name: uk_webserver_domain_verification_uuid, columns: [uuid], unique: true }
      - { name: uk_webserver_domain_verification_active, columns: [domain_id], unique: true, predicate: "((status)::text = ANY ((ARRAY['PENDING'::character varying, 'CHECKING'::character varying])::text[]))" }
      - { name: idx_webserver_domain_verification_due, columns: [status, next_attempt_at, expires_at, id], predicate: "((status)::text = ANY ((ARRAY['PENDING'::character varying, 'CHECKING'::character varying])::text[]))" }
  - name: webserver_site_binding
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      organization_id: { type: int64, required: true }
      site_id: { type: int64, required: true }
      domain_id: { type: int64, required: true }
      environment: { type: string, required: true }
      path_prefix: { type: string, required: true }
      action_type: { type: string, required: true }
      is_primary: { type: bool, required: true }
      redirect_scheme: { type: string, required: false }
      redirect_hostname: { type: string, required: false }
      redirect_path_prefix: { type: string, required: false }
      redirect_status_code: { type: int32, required: false }
      preserve_path: { type: bool, required: true }
      preserve_query: { type: bool, required: true }
      status: { type: string, required: true }
      activated_at: { type: instant, required: false }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
      deleted_at: { type: instant, required: false }
    constraints:
      - { name: webserver_site_binding_pkey, type: primary_key, columns: [id] }
      - { name: uk_webserver_site_binding_uuid, type: unique, columns: [uuid] }
      - { name: uk_webserver_site_binding_tenant_id, type: unique, columns: [tenant_id, id] }
      - name: fk_webserver_site_binding_site
        type: foreign_key
        columns: [tenant_id, site_id]
        references_table: webserver_site
        references_columns: [tenant_id, id]
      - name: fk_webserver_site_binding_domain
        type: foreign_key
        columns: [tenant_id, domain_id]
        references_table: webserver_domain
        references_columns: [tenant_id, id]
      - { name: chk_webserver_site_binding_environment, type: check }
      - { name: chk_webserver_site_binding_action, type: check }
      - { name: chk_webserver_site_binding_status, type: check }
      - { name: chk_webserver_site_binding_redirect_status, type: check }
      - { name: chk_webserver_site_binding_redirect, type: check }
    indexes:
      - { name: uk_webserver_site_binding_uuid, columns: [uuid], unique: true }
      - { name: uk_webserver_site_binding_tenant_id, columns: [tenant_id, id], unique: true }
      - { name: uk_webserver_site_binding_active_route, columns: [domain_id, environment, path_prefix], unique: true, predicate: "(((status)::text = ANY ((ARRAY['PENDING'::character varying, 'ACTIVE'::character varying, 'PAUSED'::character varying])::text[])) AND (deleted_at IS NULL))" }
      - { name: uk_webserver_site_binding_primary, columns: [site_id, environment], unique: true, predicate: "((is_primary = true) AND ((status)::text = 'ACTIVE'::text) AND (deleted_at IS NULL))" }
      - { name: idx_webserver_site_binding_site_status, columns: [tenant_id, site_id, environment, status, updated_at, id], predicate: "deleted_at IS NULL" }
      - { name: idx_webserver_site_binding_domain_status, columns: [tenant_id, domain_id, environment, status, updated_at, id], predicate: "deleted_at IS NULL" }
  - name: webserver_tls_policy
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      site_binding_id: { type: int64, required: true }
      certificate_source: { type: string, required: true }
      challenge_method: { type: string, required: true }
      minimum_tls_version: { type: string, required: true }
      maximum_tls_version: { type: string, required: true }
      alpn_json: { type: json, required: true }
      auto_renew: { type: bool, required: true }
      renew_before_days: { type: int32, required: true }
      status: { type: string, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
      deleted_at: { type: instant, required: false }
    constraints:
      - { name: webserver_tls_policy_pkey, type: primary_key, columns: [id] }
      - { name: uk_webserver_tls_policy_uuid, type: unique, columns: [uuid] }
      - name: fk_webserver_tls_policy_binding
        type: foreign_key
        columns: [tenant_id, site_binding_id]
        references_table: webserver_site_binding
        references_columns: [tenant_id, id]
      - { name: chk_webserver_tls_policy_source, type: check }
      - { name: chk_webserver_tls_policy_challenge, type: check }
      - { name: chk_webserver_tls_policy_versions, type: check }
      - { name: chk_webserver_tls_policy_renewal, type: check }
      - { name: chk_webserver_tls_policy_status, type: check }
    indexes:
      - { name: uk_webserver_tls_policy_uuid, columns: [uuid], unique: true }
      - { name: uk_webserver_tls_policy_active_binding, columns: [site_binding_id], unique: true, predicate: "(((status)::text = 'ACTIVE'::text) AND (deleted_at IS NULL))" }
  - name: webserver_nginx_config
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      site_id: { type: int64, required: true }
      domain_id: { type: int64, required: false }
      config_type: { type: enum_int32, required: true }
      config_name: { type: string, required: true }
      config_content: { type: text, required: true }
      config_hash: { type: string, required: true }
      is_active: { type: bool, required: true }
      version_no: { type: int32, required: true }
      deployed_at: { type: instant, required: false }
      status: { type: enum_int32, required: true }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
    constraints:
      - { name: webserver_nginx_config_pkey, type: primary_key, columns: [id] }
      - { name: uk_webserver_nginx_config_uuid, type: unique, columns: [uuid] }
      - name: fk_webserver_nginx_config_site
        type: foreign_key
        columns: [site_id]
        references_table: webserver_site
        references_columns: [id]
    indexes:
      - { name: uk_webserver_nginx_config_uuid, columns: [uuid], unique: true }
      - { name: idx_webserver_nginx_config_site_active, columns: [site_id, is_active] }
      - { name: idx_webserver_nginx_config_type_status, columns: [config_type, status] }
      - { name: idx_webserver_nginx_config_tenant_updated, columns: [tenant_id, updated_at, id] }
  - name: webserver_certificate
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      organization_id: { type: int64, required: true }
      user_id: { type: int64, required: false }
      cert_name: { type: string, required: true }
      cert_type: { type: enum_int32, required: true }
      ca_profile: { type: string, required: true }
      preferred_key_algorithm: { type: string, required: true }
      auto_renew: { type: bool, required: true }
      renewal_status: { type: enum_int32, required: true }
      status: { type: enum_int32, required: true }
      current_version_id: { type: int64, required: false }
      metadata: { type: json, required: true }
      created_at: { type: instant, required: true }
      updated_at: { type: instant, required: true }
      version: { type: int64, required: true }
      deleted_at: { type: instant, required: false }
    constraints:
      - { name: webserver_certificate_pkey, type: primary_key, columns: [id] }
      - { name: uk_webserver_certificate_uuid, type: unique, columns: [uuid] }
      - { name: uk_webserver_certificate_tenant_id, type: unique, columns: [tenant_id, id] }
      - { name: chk_webserver_certificate_type, type: check }
      - { name: chk_webserver_certificate_ca_profile, type: check }
      - { name: chk_webserver_certificate_key_algorithm, type: check }
      - { name: chk_webserver_certificate_renewal_status, type: check }
      - { name: chk_webserver_certificate_status, type: check }
    indexes:
      - { name: uk_webserver_certificate_uuid, columns: [uuid], unique: true }
      - { name: uk_webserver_certificate_tenant_id, columns: [tenant_id, id], unique: true }
      - { name: idx_webserver_certificate_renewal, columns: [tenant_id, renewal_status, updated_at, id], predicate: "auto_renew = true AND status IN (1, 2) AND deleted_at IS NULL" }
      - { name: idx_webserver_certificate_tenant_updated, columns: [tenant_id, updated_at, id], predicate: "deleted_at IS NULL" }
      - { name: idx_webserver_certificate_user_updated, columns: [tenant_id, user_id, updated_at, id], predicate: "user_id IS NOT NULL AND deleted_at IS NULL" }
  - name: webserver_certificate_identifier
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      certificate_id: { type: int64, required: true }
      domain_id: { type: int64, required: true }
      identifier_type: { type: string, required: true }
      hostname: { type: string, required: true }
      position: { type: int32, required: true }
      created_at: { type: instant, required: true }
    constraints:
      - { name: webserver_certificate_identifier_pkey, type: primary_key, columns: [id] }
      - { name: uk_webserver_certificate_identifier_uuid, type: unique, columns: [uuid] }
      - { name: uk_webserver_certificate_identifier_name, type: unique, columns: [certificate_id, hostname] }
      - { name: uk_webserver_certificate_identifier_position, type: unique, columns: [certificate_id, position] }
      - name: fk_webserver_certificate_identifier_certificate
        type: foreign_key
        columns: [tenant_id, certificate_id]
        references_table: webserver_certificate
        references_columns: [tenant_id, id]
      - name: fk_webserver_certificate_identifier_domain
        type: foreign_key
        columns: [tenant_id, domain_id]
        references_table: webserver_domain
        references_columns: [tenant_id, id]
      - { name: chk_webserver_certificate_identifier_type, type: check }
      - name: chk_webserver_certificate_identifier_position
        type: check
        columns: [position]
        expression: position BETWEEN 0 AND 7
    indexes:
      - { name: uk_webserver_certificate_identifier_uuid, columns: [uuid], unique: true }
      - { name: uk_webserver_certificate_identifier_name, columns: [certificate_id, hostname], unique: true }
      - { name: uk_webserver_certificate_identifier_position, columns: [certificate_id, '"position"'], unique: true }
      - { name: idx_webserver_certificate_identifier_domain, columns: [tenant_id, domain_id, certificate_id] }
  - name: webserver_certificate_version
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      certificate_id: { type: int64, required: true }
      version_no: { type: int64, required: true }
      serial_sha256: { type: string, required: true }
      fingerprint_sha256: { type: string, required: true }
      spki_sha256: { type: string, required: true }
      chain_sha256: { type: string, required: true }
      issuer: { type: string, required: true }
      subject: { type: string, required: true }
      key_algorithm: { type: string, required: true }
      not_before: { type: instant, required: true }
      not_after: { type: instant, required: true }
      secret_bundle_ref: { type: string, required: true }
      status: { type: string, required: true }
      created_at: { type: instant, required: true }
    constraints:
      - { name: webserver_certificate_version_pkey, type: primary_key, columns: [id] }
      - { name: uk_webserver_certificate_version_uuid, type: unique, columns: [uuid] }
      - { name: uk_webserver_certificate_version_id, type: unique, columns: [certificate_id, id] }
      - { name: uk_webserver_certificate_version_tenant_id, type: unique, columns: [tenant_id, id] }
      - { name: uk_webserver_certificate_version_no, type: unique, columns: [certificate_id, version_no] }
      - { name: uk_webserver_certificate_version_fingerprint, type: unique, columns: [tenant_id, fingerprint_sha256] }
      - name: fk_webserver_certificate_version_certificate
        type: foreign_key
        columns: [tenant_id, certificate_id]
        references_table: webserver_certificate
        references_columns: [tenant_id, id]
      - { name: chk_webserver_certificate_version_key_algorithm, type: check }
      - { name: chk_webserver_certificate_version_status, type: check }
      - { name: chk_webserver_certificate_version_validity, type: check }
      - { name: chk_webserver_certificate_version_hashes, type: check }
      - { name: chk_webserver_certificate_version_secret_ref, type: check }
    indexes:
      - { name: uk_webserver_certificate_version_uuid, columns: [uuid], unique: true }
      - { name: uk_webserver_certificate_version_id, columns: [certificate_id, id], unique: true }
      - { name: uk_webserver_certificate_version_tenant_id, columns: [tenant_id, id], unique: true }
      - { name: uk_webserver_certificate_version_no, columns: [certificate_id, version_no], unique: true }
      - { name: uk_webserver_certificate_version_fingerprint, columns: [tenant_id, fingerprint_sha256], unique: true }
      - { name: idx_webserver_certificate_version_lifecycle, columns: [tenant_id, status, not_after, id] }
  - name: webserver_certificate_secret_bundle
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      certificate_version_id: { type: int64, required: true }
      encryption_algorithm: { type: string, required: true }
      bundle_encrypted: { type: string, required: true }
      created_at: { type: instant, required: true }
    constraints:
      - { name: webserver_certificate_secret_bundle_pkey, type: primary_key, columns: [id] }
      - { name: uk_webserver_certificate_secret_bundle_uuid, type: unique, columns: [uuid] }
      - { name: uk_webserver_certificate_secret_bundle_version, type: unique, columns: [tenant_id, certificate_version_id] }
      - name: fk_webserver_certificate_secret_bundle_version
        type: foreign_key
        columns: [tenant_id, certificate_version_id]
        references_table: webserver_certificate_version
        references_columns: [tenant_id, id]
      - { name: chk_webserver_certificate_secret_bundle_algorithm, type: check }
      - { name: chk_webserver_certificate_secret_bundle_payload, type: check }
    indexes:
      - { name: uk_webserver_certificate_secret_bundle_uuid, columns: [uuid], unique: true }
      - { name: uk_webserver_certificate_secret_bundle_version, columns: [tenant_id, certificate_version_id], unique: true }
  - name: webserver_certificate_operation
    lifecycle_status: active
    owner: web-platform
    columns:
      id: { type: int64, required: true }
      uuid: { type: string, required: true }
      tenant_id: { type: int64, required: true }
      certificate_id: { type: int64, required: true }
      requested_by: { type: int64, required: false }
