[workspace]
resolver = "2"
members = [
  "crates/sdkwork-api-webserver-assembly",
  "crates/sdkwork-server-files-service",
  "crates/sdkwork-webserver-database-host",
  "crates/sdkwork-webserver-http-host",
  "crates/sdkwork-routes-webserver-common",
  "crates/sdkwork-webserver-contract",
  "crates/sdkwork-webserver-core",
  "crates/sdkwork-webserver-resolver-cache",
  "crates/sdkwork-webserver-delivery-runtime",
  "crates/sdkwork-webserver-drive-provider",
  "crates/sdkwork-webserver-knowledgebase-provider",
  "crates/sdkwork-webserver-source-provider",
  "crates/sdkwork-webserver-acme-service",
  "crates/sdkwork-webserver-edge-runtime",
  "crates/sdkwork-web-agent",
  "crates/sdkwork-webserver-certificate-worker",
  "crates/sdkwork-intelligence-webserver-service",
  "crates/sdkwork-intelligence-webserver-repository-sqlx",
  "crates/sdkwork-routes-webserver-app-api",
  "crates/sdkwork-routes-webserver-backend-api",
  "crates/sdkwork-routes-webserver-internal-api",
  "crates/sdkwork-api-webserver-standalone-gateway",
  "crates/sdkwork-webserver-website-delivery-edge-runtime",
]
exclude = [
  "sdks/sdkwork-web-backend-sdk/sdkwork-web-backend-sdk-rust/generated/server-openapi",
  "sdks/sdkwork-web-internal-sdk/sdkwork-web-internal-sdk-rust/generated/server-openapi",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
async-trait = "0.1"
atomic-waker = "1"
arc-swap = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
bytes = "1"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
crc = "3"
dotenvy = "0.15"
http = "1.4"
http-body = "1"
http-body-util = "0.1"
http-range-header = "0.4"
httpdate = "1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "tls12", "webpki-roots"] }
ipnet = { version = "2", features = ["serde"] }
futures-util = "0.3"
hashlink = "0.12"
hickory-resolver = "0.26"
mime_guess = "2"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-pki-types = "1"
url = "2"
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
socket2 = "0.6"
jsonschema = { version = "0.49", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls", "migrate"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["compression-gzip", "fs", "timeout", "trace"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
base64 = "0.22"
bcrypt = "0.17"
hex = "0.4"
md-5 = "0.10"
sha1 = "0.10"
h2 = "0.4"
sha2 = "0.10"
sync_wrapper = "1"
aes-gcm = "0.10"
instant-acme = { version = "0.8", features = ["rcgen", "time"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
x509-parser = "0.18"
time = { version = "0.3", features = ["formatting", "parsing"] }
zeroize = "1"
tokio-rustls = "0.26"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
woothee = "0.13"

sdkwork-server-files-service = { path = "crates/sdkwork-server-files-service" }
sdkwork-webserver-acme-service = { path = "crates/sdkwork-webserver-acme-service" }
sdkwork-webserver-edge-runtime = { path = "crates/sdkwork-webserver-edge-runtime" }
sdkwork-web-agent = { path = "crates/sdkwork-web-agent" }
sdkwork-webserver-certificate-worker = { path = "crates/sdkwork-webserver-certificate-worker" }
sdkwork-webserver-contract = { path = "crates/sdkwork-webserver-contract" }
sdkwork-webserver-core = { path = "crates/sdkwork-webserver-core" }
sdkwork-webserver-resolver-cache = { path = "crates/sdkwork-webserver-resolver-cache" }
sdkwork-webserver-delivery-runtime = { path = "crates/sdkwork-webserver-delivery-runtime" }
sdkwork-webserver-drive-provider = { path = "crates/sdkwork-webserver-drive-provider" }
sdkwork-webserver-knowledgebase-provider = { path = "crates/sdkwork-webserver-knowledgebase-provider" }
sdkwork-webserver-source-provider = { path = "crates/sdkwork-webserver-source-provider" }
sdkwork-webserver-database-host = { path = "crates/sdkwork-webserver-database-host" }
sdkwork-webserver-http-host = { path = "crates/sdkwork-webserver-http-host" }
sdkwork-intelligence-webserver-service = { path = "crates/sdkwork-intelligence-webserver-service" }
sdkwork-intelligence-webserver-repository-sqlx = { path = "crates/sdkwork-intelligence-webserver-repository-sqlx" }
sdkwork-routes-webserver-app-api = { path = "crates/sdkwork-routes-webserver-app-api" }
sdkwork-routes-webserver-backend-api = { path = "crates/sdkwork-routes-webserver-backend-api" }
sdkwork-api-deployments-assembly = { path = "../sdkwork-deployments/crates/sdkwork-api-deployments-assembly" }
sdkwork-routes-webserver-internal-api = { path = "crates/sdkwork-routes-webserver-internal-api" }
sdkwork-routes-webserver-common = { path = "crates/sdkwork-routes-webserver-common" }
sdkwork-api-webserver-assembly = { path = "crates/sdkwork-api-webserver-assembly" }
sdkwork-api-webserver-standalone-gateway = { path = "crates/sdkwork-api-webserver-standalone-gateway", default-features = false }
sdkwork-webserver-website-delivery-edge-runtime = { path = "crates/sdkwork-webserver-website-delivery-edge-runtime" }
sdkwork-web-backend-sdk = { path = "sdks/sdkwork-web-backend-sdk/sdkwork-web-backend-sdk-rust/generated/server-openapi" }
sdkwork-web-internal-sdk = { path = "sdks/sdkwork-web-internal-sdk/sdkwork-web-internal-sdk-rust/generated/server-openapi" }

sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork-api-iam-assembly = { path = "../sdkwork-iam/crates/sdkwork-api-iam-assembly" }
sdkwork-api-drive-assembly = { path = "../sdkwork-drive/crates/sdkwork-api-drive-assembly" }
sdkwork-api-skills-assembly = { path = "../sdkwork-skills/crates/sdkwork-api-skills-assembly" }
sdkwork-api-mcp-assembly = { path = "../sdkwork-mcp/crates/sdkwork-api-mcp-assembly" }
sdkwork-skills-database-host = { path = "../sdkwork-skills/crates/sdkwork-skills-database-host" }
sdkwork-mcp-database-host = { path = "../sdkwork-mcp/crates/sdkwork-mcp-database-host" }
sdkwork-iam-database-host = { path = "../sdkwork-iam/crates/sdkwork-iam-database-host" }
sdkwork-iam-embedded-application-bootstrap = { path = "../sdkwork-iam/crates/sdkwork-iam-embedded-application-bootstrap" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-web-store-sqlx = { path = "../sdkwork-web-framework/crates/sdkwork-web-store-sqlx", default-features = false, features = ["postgres"] }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config", package = "sdkwork-database-config" }
sdkwork-database-drift = { path = "../sdkwork-database/crates/sdkwork-database-drift", package = "sdkwork-database-drift" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle", package = "sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi", package = "sdkwork-database-spi" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", package = "sdkwork-database-sqlx" }
sdkwork-database-id = { path = "../sdkwork-database/crates/sdkwork-database-id", package = "sdkwork-database-id" }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
sdkwork-drive-contract = { path = "../sdkwork-drive/crates/sdkwork-drive-contract" }
sdkwork-drive-config = { path = "../sdkwork-drive/crates/sdkwork-drive-config" }
sdkwork-drive-object-runtime = { path = "../sdkwork-drive/crates/sdkwork-drive-object-runtime" }
sdkwork-drive-uploader-service = { path = "../sdkwork-drive/crates/sdkwork-drive-uploader-service" }
sdkwork-drive-workspace-service = { path = "../sdkwork-drive/crates/sdkwork-drive-workspace-service" }
sdkwork-drive-internal-sdk = { path = "../sdkwork-drive/sdks/sdkwork-drive-internal-sdk/sdkwork-drive-internal-sdk-rust/generated/server-openapi", package = "sdkwork-drive-internal-sdk-generated-rust" }
sdkwork-knowledgebase-internal-sdk = { path = "../sdkwork-knowledgebase/sdks/sdkwork-knowledgebase-internal-sdk/sdkwork-knowledgebase-internal-sdk-rust/generated/server-openapi", package = "sdkwork-knowledgebase-internal-sdk-generated-rust" }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Production binaries benefit from LTO and a single codegen unit; panic=unwind
# keeps a panicked Tokio task from terminating the long-running process.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
