[package]
name = "sdkwork-api-webserver-standalone-gateway"
version.workspace = true
edition.workspace = true

[features]
default = ["management"]
management = [
  "dep:sdkwork-api-webserver-assembly",
  "dep:sdkwork-api-iam-assembly",
  "dep:sdkwork-api-drive-assembly",
  "dep:sdkwork-api-skills-assembly",
  "dep:sdkwork-api-mcp-assembly",
  "dep:sdkwork-database-sqlx",
  "dep:sdkwork-web-axum",
  "dep:sdkwork-web-contract",
  "dep:sdkwork-web-store-sqlx",
  "dep:sdkwork-webserver-http-host",
  "dep:sdkwork-intelligence-webserver-repository-sqlx",
]

[lib]
name = "sdkwork_api_webserver_standalone_gateway"
path = "src/lib.rs"


[[bin]]
name = "sdkwork-api-webserver-standalone-gateway"
path = "src/main.rs"
required-features = ["management"]

[dependencies]
