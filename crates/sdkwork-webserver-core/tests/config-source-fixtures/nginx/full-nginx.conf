# Regression fixture: full nginx.conf style with http + stream, covering the
# http-core-v1 surface plus the extended execution directives (sub_filter,
# limit_conn, secure_link, dynamic proxy_pass, UDP stream).
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json;
    gzip_min_length 256;

    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cache:10m max_size=1g inactive=60m;
    proxy_cache_valid 200 1h;

    upstream backend {
        server 127.0.0.1:8080 weight=2 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8081 backup;
        keepalive 16;
    }

    upstream hash_backend {
        hash $request_uri consistent;
        server 127.0.0.1:8090;
        server 127.0.0.1:8091 down;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name www.example.com example.com;
        root /srv/www/example;
        index index.html;
        proxy_set_header X-Server-Level inherited;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            limit_req zone=api burst=10 nodelay;
            limit_conn perip 5;
            allow 127.0.0.1;
            deny all;
        }

        location = /healthz {
            return 200 "ok";
        }

        location /docs/ {
            alias /srv/www/docs/;
            sub_filter "Draft" "Final";
            sub_filter_once off;
            sub_filter_types text/html text/plain;
        }

        location /files/ {
            root /srv/www/files;
            secure_link_secret s3cret;
        }

        location /links/ {
            root /srv/www/links;
            secure_link $arg_st;
            secure_link_md5 "$secure_link_expires$uri$remote_addr key";
            secure_link_expires $arg_e;
        }

        location /dynamic/ {
            proxy_pass http://$host:$server_port;
            proxy_pass_request_headers off;
        }

        location / {
            try_files $uri $uri/ /index.html;
            rewrite ^/old/(.*)$ /new/$1 permanent;
        }
    }

    server {
        listen 443 ssl http2;
        server_name secure.example.com;
        ssl_certificate /etc/nginx/ssl/example.crt;
        ssl_certificate_key /etc/nginx/ssl/example.key;
        ssl_verify_client optional;
        ssl_client_certificate /etc/nginx/ssl/client-ca.pem;
        error_page 404 /404.html;
        location / {
            proxy_pass http://127.0.0.1:8443;
        }
        location /old/ {
            return 301 https://$host$request_uri;
        }
        location /listing/ {
            root /srv/www/listing;
            autoindex on;
        }
    }
}

stream {
    upstream tcp_backend {
        server 127.0.0.1:3306;
    }

    server {
        listen 3307;
        proxy_pass tcp_backend;
        proxy_timeout 1h;
    }

    server {
        listen 53 udp;
        proxy_pass 127.0.0.1:5353;
    }

    server {
        listen 3443 ssl;
        ssl_certificate /etc/nginx/ssl/stream.crt;
        ssl_certificate_key /etc/nginx/ssl/stream.key;
        ssl_verify_client on;
        ssl_client_certificate /etc/nginx/ssl/stream-ca.pem;
        proxy_pass 127.0.0.1:3444;
    }
}
