  - "../sdkwork-skills/sdks/sdkwork-skills-app-sdk/sdkwork-skills-app-sdk-typescript"
  - "../sdkwork-skills/sdks/sdkwork-skills-backend-sdk/sdkwork-skills-backend-sdk-typescript"
  - "../sdkwork-mcp/apps/sdkwork-mcp-pc/packages/sdkwork-mcp-pc-commons"
