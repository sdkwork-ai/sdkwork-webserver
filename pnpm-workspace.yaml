  # Identity & Access admin capability workspaces. The backend-admin "iam"
  # module mounts their pages over the shared SdkworkIamService facade (the same
  # packages sdkwork-cloudrouter consumes), so each must be a workspace member
  # for `workspace:*` resolution — same rule as the console cloud-account pair
  # below.
  - "../sdkwork-iam/apps/sdkwork-iam-pc/packages/sdkwork-iam-pc-admin-user"
  - "../sdkwork-iam/apps/sdkwork-iam-pc/packages/sdkwork-iam-pc-admin-tenant"
  - "../sdkwork-iam/apps/sdkwork-iam-pc/packages/sdkwork-iam-pc-admin-organization"
  - "../sdkwork-iam/apps/sdkwork-iam-pc/packages/sdkwork-iam-pc-admin-permission"
  - "../sdkwork-iam/apps/sdkwork-iam-pc/packages/sdkwork-iam-pc-admin-oauth"
  - "../sdkwork-iam/apps/sdkwork-iam-pc/packages/sdkwork-iam-pc-admin-account-binding"
  - "../sdkwork-iam/apps/sdkwork-iam-pc/packages/sdkwork-iam-pc-admin-audit"
  - "../sdkwork-iam/apps/sdkwork-iam-pc/packages/sdkwork-iam-pc-console-core"
  - "../sdkwork-iam/apps/sdkwork-iam-pc/packages/sdkwork-iam-pc-console-cloud-account"
  - "../sdkwork-iam/sdks/sdkwork-iam-app-sdk/sdkwork-iam-app-sdk-typescript"
  - "../sdkwork-iam/sdks/sdkwork-iam-backend-sdk/sdkwork-iam-backend-sdk-typescript"
  - "../sdkwork-iam/sdks/sdkwork-iam-open-sdk/sdkwork-iam-open-sdk-typescript"
  - "../sdkwork-deployments/apps/sdkwork-deployments-pc/packages/sdkwork-deployments-pc-commons"
  - "../sdkwork-deployments/apps/sdkwork-deployments-pc/packages/sdkwork-deployments-pc-console-core"
  - "../sdkwork-deployments/apps/sdkwork-deployments-pc/packages/sdkwork-deployments-pc-console-delivery"
  # Applications: the `deploy_app` publishing page is host-agnostic (its two
  # generated clients arrive as props), so the Web Server console and backend
  # admin mount the canonical page instead of re-implementing the application
  # lifecycle. The package is a `workspace:*` dep of
  # `@sdkwork/webserver-pc-console-delivery` and
  # `@sdkwork/webserver-pc-admin-apps`.
  - "../sdkwork-deployments/apps/sdkwork-deployments-pc/packages/sdkwork-deployments-pc-console-publishing"
  # The app-template marketplace rides the same rule: the storefront and the
  # author workbench are canonical `deploy_app_template` pages whose two
  # clients (deploy + order) arrive as props from
  # `createDeploymentsConsoleClients`, and the admin template catalog renders
  # the shared registry table over `createDeploymentsAdminRegistry`. Both are
  # `workspace:*` deps of `@sdkwork/webserver-pc-console-marketplace` and
  # `@sdkwork/webserver-pc-admin-app-templates`; the deployments backend SDK
  # is the generated transport `sdkwork-deployments-pc-admin-core` composes.
  - "../sdkwork-deployments/apps/sdkwork-deployments-pc/packages/sdkwork-deployments-pc-console-marketplace"
  - "../sdkwork-deployments/apps/sdkwork-deployments-pc/packages/sdkwork-deployments-pc-admin-core"
  - "../sdkwork-deployments/sdks/sdkwork-deployments-backend-sdk/sdkwork-deployments-backend-sdk-typescript"
  # Platform order center: the marketplace acquire flow is an `app_template_orders`
  # command on the order center's app API (the deployments module owns no
  # purchase of its own), and the deployments console-core factory that bridges
  # it declares the generated client with `workspace:*`, so the SDK must be a
  # member here for resolution — with the matching sdkwork-order entry in
  # sdkwork.workflow.json.
  - "../sdkwork-order/sdks/sdkwork-order-app-sdk/sdkwork-order-app-sdk-typescript"
  - "../sdkwork-deployments/sdks/sdkwork-deployments-app-sdk/sdkwork-deployments-app-sdk-typescript"
