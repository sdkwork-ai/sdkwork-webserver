  - "../sdkwork-iam/apps/sdkwork-iam-common/packages/sdkwork-iam-service"
  - "../sdkwork-iam/apps/sdkwork-iam-common/packages/sdkwork-iam-application-bootstrap"
  # The shared desktop-auth port `sdkwork-auth-pc-react` depends on; the sibling
  # checkout gained the dependency after this workspace's lockfile was cut, so
  # `workspace:*` resolution needs the package declared here too.
  - "../sdkwork-iam/apps/sdkwork-iam-common/packages/sdkwork-iam-desktop-auth"
  - "../sdkwork-iam/apps/sdkwork-iam-pc/packages/sdkwork-auth-pc-react"
  - "../sdkwork-iam/apps/sdkwork-iam-pc/packages/sdkwork-auth-runtime-pc-react"
