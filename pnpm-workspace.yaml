# Dual-platform native bindings: this checkout is built from both Windows
# (dev) and WSL Ubuntu (container image builds, DEPLOYMENT_SPEC §6). pnpm 10
# reads these settings from pnpm-workspace.yaml; keep both OS binding sets so
# vite/rolldown/esbuild resolve native packages on either side.
supportedArchitectures:
  os:
    - win32
    - linux
  cpu:
    - x64
  libc:
    - glibc
    - musl

# Single React runtime singleton: transitive packages that declare their own
# (older) react/react-dom ranges previously resolved a second copy next to the
# catalog's 19.2.8, splitting hooks state inside one renderer. Pin the exact
# version for every consumer so tests and the dev server share one instance.
# Resolve sibling-SDK package ranges to this workspace's checkouts first: the
# deployments app SDK declares `@sdkwork/drive-app-sdk: "^0.1.1"` for its npm
# consumers, and without these two settings that range resolves to the registry
# copy inside this workspace while every bridged page compiles against the
# checkout copy — two instances of one SDK whose uploader types then collide
# (the `deploy-app-operations` publishing service is where it surfaces first).
# This mirrors the sibling repos' `.npmrc` policy.
linkWorkspacePackages: true
preferWorkspacePackages: true

overrides:
  react: 19.2.8
  react-dom: 19.2.8
