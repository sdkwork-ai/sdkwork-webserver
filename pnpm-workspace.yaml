  - "../sdkwork-drive/sdks/sdkwork-drive-app-sdk/sdkwork-drive-app-sdk-typescript"
  # Storage Center: the drive-owned admin storage plane is consumed as a shared
  # module rather than forked. `sdkwork-drive-pc-admin-storage-providers` owns
  # the provider/service/types/i18n, `sdkwork-drive-pc-admin-storage-buckets`
  # owns the bucket list and its file manager dialog,
  # `sdkwork-drive-pc-file-preview` owns the reusable preview/editor components
  # that dialog opens, and `sdkwork-drive-pc-admin-core` owns the host-agnostic
  # admin storage SDK client; all are `workspace:*` deps of
  # `@sdkwork/webserver-pc-admin-storage` (or of each other), so every one of them
  # must be resolvable from this workspace too.
  - "../sdkwork-drive/apps/sdkwork-drive-pc/packages/sdkwork-drive-pc-commons"
  - "../sdkwork-drive/apps/sdkwork-drive-pc/packages/sdkwork-drive-pc-core"
