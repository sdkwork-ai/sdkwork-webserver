            "pattern": "^sv1:[a-f0-9]{64}$",
            "description": "Stable SHA-256 fingerprint of active nginx configs and certificates for the tenant."
          },
          "unchanged": {
            "type": "boolean",
            "description": "True when ifSyncVersion matched syncVersion; bundles are omitted to save bandwidth."
          },
          "nginxConfigs": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AgentNginxConfigBundle"
            }
          },
          "certificates": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AgentCertificateBundle"
            }
          }
        }
      },
      "AgentNginxConfigBundle": {
        "type": "object",
        "required": [
          "configId",
          "domain",
          "configContent",
          "fingerprint",
          "version"
        ],
        "properties": {
          "configId": {
            "type": "string",
            "format": "uuid"
          },
          "domain": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253
          },
          "configContent": {
            "type": "string",
            "maxLength": 1048576
          },
          "fingerprint": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$",
            "description": "SHA-256 hex digest of configContent."
          },
          "version": {
            "type": "string",
            "format": "int64",
            "pattern": "^-?[0-9]+$",
            "x-sdkwork-int64-string": true,
            "x-sdkwork-rust-type": "i64",
            "description": "Config revision number as a string to avoid JavaScript precision loss."
          }
        }
      },
      "AgentCertificateBundle": {
        "type": "object",
        "required": [
          "certificateId",
          "certName",
          "fingerprint",
          "hostnames",
          "fullchainPem",
          "privkeyPem"
        ],
        "properties": {
          "certificateId": {
            "type": "string",
            "format": "uuid"
          },
          "certName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 253
          },
          "fingerprint": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "hostnames": {
            "type": "array",
            "minItems": 1,
            "maxItems": 128,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 253
            }
          },
          "fullchainPem": {
            "type": "string",
            "maxLength": 2097152
          },
          "privkeyPem": {
            "type": "string",
            "maxLength": 2097152
          }
        }
      },
      "ServerPage": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ServerResponse"
            }
          },
          "total": {
            "type": "string",
            "format": "int64",
            "pattern": "^-?[0-9]+$",
            "x-sdkwork-int64-string": true,
            "x-sdkwork-rust-type": "i64",
            "description": "Total item count as a string to avoid JavaScript precision loss."
          }
        }
      },
      "AuditLogResponse": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "operatorId": {
            "type": "string",
            "format": "int64",
            "pattern": "^-?[0-9]+$",
            "x-sdkwork-int64-string": true,
            "x-sdkwork-rust-type": "i64",
            "description": "Operator user id as a string to avoid JavaScript precision loss."
          },
          "operatorType": {
            "type": "string"
          },
          "action": {
            "type": "string"
          },
          "targetType": {
            "type": "string"
          },
          "targetId": {
            "type": "string",
            "format": "int64",
            "pattern": "^-?[0-9]+$",
            "x-sdkwork-int64-string": true,
            "x-sdkwork-rust-type": "i64",
            "description": "Target snowflake id as a string to avoid JavaScript precision loss. Null when the audit action has no specific numeric target."
          },
          "targetUuid": {
            "type": [
              "string",
              "null"
            ]
          },
          "ipAddress": {
            "type": [
              "string",
              "null"
            ]
          },
          "changes": {
            "type": "object"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "AuditLogPage": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AuditLogResponse"
            }
          },
          "total": {
            "type": "string",
            "format": "int64",
            "pattern": "^-?[0-9]+$",
            "x-sdkwork-int64-string": true,
            "x-sdkwork-rust-type": "i64",
            "description": "Total item count as a string to avoid JavaScript precision loss."
          }
        }
      },
      "SdkWorkApiResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "data",
          "traceId"
        ],
        "properties": {
          "code": {
            "type": "integer",
            "format": "int32",
            "enum": [
              0
            ],
            "default": 0,
            "minimum": 0,
            "maximum": 0
          },
          "data": {
            "description": "Operation-specific payload typed per response schema."
          },
          "traceId": {
            "type": "string",
            "format": "uuid",
            "description": "Server-owned request correlation id."
          }
        }
      },
      "SdkWorkResourceData": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "item"
        ],
        "properties": {
          "item": {
            "type": "object",
            "additionalProperties": true,
            "description": "Typed domain resource for the operation."
          }
        }
      },
      "SdkWorkPageData": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "items",
          "pageInfo"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": true
            }
          },
          "pageInfo": {
            "$ref": "#/components/schemas/PageInfo"
          }
        }
      },
      "SdkWorkCommandData": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "accepted"
        ],
        "properties": {
          "accepted": {
            "type": "boolean",
            "const": true
          },
          "resourceId": {
            "type": "string"
          },
          "status": {
            "type": "string"
          }
        }
      },
      "SdkWorkAsyncData": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "accepted",
          "operationId",
          "status"
        ],
        "properties": {
          "accepted": {
            "type": "boolean",
            "const": true
          },
          "operationId": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "pending",
              "running",
              "succeeded",
              "failed",
              "cancelled"
            ]
          },
          "pollUrl": {
            "type": "string",
            "format": "uri-reference"
          }
        }
      },
      "PageInfo": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "mode"
        ],
        "properties": {
          "mode": {
            "type": "string",
            "enum": [
              "offset",
              "cursor"
            ]
          },
          "page": {
            "type": "integer",
            "minimum": 1
          },
          "pageSize": {
            "type": "integer",
            "minimum": 1,
            "maximum": 200
          },
          "totalItems": {
            "type": "string",
            "pattern": "^-?[0-9]+$"
          },
          "totalPages": {
            "type": "integer",
            "minimum": 0
          },
          "nextCursor": {
            "type": [
              "string",
              "null"
            ]
          },
          "hasMore": {
            "type": "boolean"
          }
        }
      },
      "SdkWorkPlatformErrorCode": {
        "type": "integer",
        "format": "int32",
        "minimum": 40001,
        "maximum": 79999,
        "description": "Platform or domain error code per API_SPEC.md section 15.3."
      },
      "FieldError": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "field",
          "message"
        ],
        "properties": {
          "field": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "code": {
            "type": "integer",
            "format": "int32",
            "minimum": 40011,
            "maximum": 40099
          }
        }
      },
      "SdkWorkResourceResponse": {
        "allOf": [
          {
            "$ref": "#/components/schemas/SdkWorkApiResponse"
          },
          {
            "type": "object",
            "required": [
              "data"
            ],
            "properties": {
              "data": {
                "$ref": "#/components/schemas/SdkWorkResourceData"
              }
            }
          }
        ]
      },
      "SdkWorkListResponse": {
        "allOf": [
          {
            "$ref": "#/components/schemas/SdkWorkApiResponse"
          },
          {
            "type": "object",
            "required": [
              "data"
            ],
            "properties": {
              "data": {
                "$ref": "#/components/schemas/SdkWorkPageData"
              }
            }
          }
        ]
      },
      "SdkWorkCommandResponse": {
        "allOf": [
          {
            "$ref": "#/components/schemas/SdkWorkApiResponse"
          },
          {
            "type": "object",
            "required": [
              "data"
            ],
            "properties": {
              "data": {
                "$ref": "#/components/schemas/SdkWorkCommandData"
              }
            }
          }
        ]
      }
    },
    "responses": {
      "BadRequest": {
        "description": "Invalid request parameters.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      },
      "Unauthorized": {
        "description": "Authentication is required.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      },
      "NotFound": {
        "description": "Resource not found.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      },
      "Conflict": {
        "description": "Resource conflict.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      },
      "ValidationError": {
        "description": "Request validation failed.",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/ProblemDetail"
            }
          }
        }
      }
    }
  }
}
