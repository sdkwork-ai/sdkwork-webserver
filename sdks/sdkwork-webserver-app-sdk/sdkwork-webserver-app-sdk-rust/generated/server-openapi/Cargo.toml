[workspace]

[workspace.package]
rust-version = "1.85"

[workspace.lints.rust]
# Generated-client baseline (RUST_CODE_SPEC §13): generated code contains no
# unsafe. Keep this manifest self-contained so the crate is a valid standalone
# workspace root and a valid path dependency.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[package]
name = "sdkwork-webserver-app-sdk-generated-rust"
version = "1.0.0"
edition = "2021"
rust-version.workspace = true
description = "sdkwork-webserver-app-sdk SDK"
license = "MIT"
authors = ["SDKWork Team"]

[lib]
name = "sdkwork_webserver_app_sdk_generated_rust"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
http = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
