daemon off;
master_process off;
error_log stderr notice;

# Differential HTTP fixture: one configuration is rendered twice, with a
# different `listen` port, and served by real nginx (the oracle) and by the
# Rust data plane (`serve-nginx`). `battery.py` sends the same request matrix to
# both endpoints and `compare.py` diffs the observable contract.
#
# Placeholders:
#   @PUBLIC@    absolute path to ./public (same physical files for both sides)
#   @PORT@      listener port of the side being measured
#   @UPSTREAM@  port the battery's deterministic mock upstream listens on
#   @DEAD@      a loopback port nothing listens on (502 mapping)
#   @HTPASSWD@  absolute path to ./htpasswd
#
# The `types` block is deliberate: an nginx-oracle package binary without
# `include mime.types` maps every extension to its `default_type`, which would
# make the MIME group vacuous. The SDKWork runtime ignores the block (its MIME
# table is fixed) and resolves the same extensions through its own table, so
# this file states the shared MIME contract instead of letting one side inherit
# a package default.
#
# Two virtual hosts share the listener so the `add_header` cases can be isolated
# from generated error/limit responses: the runtime applies a virtual host's
# custom response headers to every status, while nginx `add_header` skips 4xx/5xx
# without the `always` flag (the nginx mapping cannot currently express that
# per-header status list, see the differential report). `diff.example.com` is the
# default host and carries no `add_header`; `headers.example.com` carries the
# header policy and serves only statuses where both agree.
#
# `absolute_redirect off` pins nginx's directory redirect to a relative
# `Location`; the runtime always emits the relative form. The redirect *status*
# (301) and the exact path/query are compared.

events {
    worker_connections 256;
}

http {
    # ---- geo / split_clients ----------------------------------------------
    geo $geo_zone {
        default "none";
        127.0.0.0/8 "loopback";
        10.0.0.0/8 "private";
        127.0.0.1/32 "loopback-host";
    }
    geo $http_x_forwarded_for $xff_zone {
        ranges;
        default "no";
        10.0.0.5-10.0.0.10 "ten";
    }
    geo $http_x_forwarded_for $v6_zone {
        default "no";
        2001:db8::/32 "v6";
    }
    split_clients "$arg_key" $split_bucket {
        30% "a";
        30% "b";
        40% "c";
    }

    access_log off;
    default_type text/plain;

    # nginx `merge_slashes off` for the whole fixture (differential-probed
    # against nginx 1.29.6): repeated adjacent slashes stay in `$uri`, in
    # exact-location identity and in static/proxy path resolution. nginx parses
    # the request URI before virtual-host selection, so the value is effectively
    # listener-wide; declaring it at the http level is the only way one fixture
    # can pin the `off` semantics for both implementations. Every case below
    # that relies on it uses a deliberately doubled path (`/merge//exact`); the
    # rest of the battery's paths are unaffected because none of them contain a
    # repeated slash.
    merge_slashes off;

    # Test-only MIME map (the extensions the battery asserts). Real nginx
    # deployments get this from `include mime.types`; the runtime pins the same
    # canonical mapping internally.
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js;
        application/json                      json;
        text/plain                            txt;
        image/png                             png;
    }

    # ---- nginx `map` variables -------------------------------------------
    # Every semantic here is differential-probed against nginx 1.29.6: keys are
    # matched case-insensitively, an empty key matches an absent/empty source
    # value, `hostnames` enables `*.suffix` wildcards that do NOT match the
    # apex, regex keys are evaluated in authored order after hash keys, and a
    # regex match's `$1` capture expands inside the value.
    include maps.fragment;
    # The maps with an empty-string key (`"" anonymous-zone;`) are injected here
    # by the differential runner and the oracle script: the repository's JS
    # config parser cannot tokenise an empty directive name, while nginx's map
    # handler and the Rust importer can. See maps-empty-key.inc.
    # @EMPTY_KEY_MAP@

    # A map whose result is always the empty string proves the nginx rule that
    # an empty `add_header` value is omitted from the response.
    map $http_x_absent $empty_map_result {
        default  "";
    }

    limit_req_zone  $binary_remote_addr  zone=httpreq:1m  rate=1r/s;
    limit_conn_zone $binary_remote_addr  zone=httpconn:1m;
    # Separate zones for the configurable-status host so its request burst
    # cannot consume the default host's tokens (and vice versa).
    limit_req_zone  $binary_remote_addr  zone=httpreq429:1m  rate=1r/s;
    limit_conn_zone $binary_remote_addr  zone=httpconn429:1m;

    # http-level `add_header` policy. nginx inherits this ordered array into
    # every server that declares no `add_header` of its own (replace-on-declare),
    # and each entry is emitted only for the default status list (200, 201, 204,
    # 206, 301, 302, 303, 304, 307, 308) unless it carries `always`. The
    # `headers.example.com` host overrides this array, which is what proves the
    # replacement rule; the other hosts inherit it and therefore exercise the
    # status matrix on every response kind.
    add_header X-Http-Level http;
    add_header X-Http-Always http-always always;

    # ---- default host: static, routing, error pages, gzip, limits, proxy ----
    server {
        listen 127.0.0.1:@PORT@ default_server;
        server_name diff.example.com;

        root @PUBLIC@;
        index index.html;

        absolute_redirect off;

        # Server-level default error mapping: a 404 renders the fixture page
        # under the original status.
        error_page 404 /notfound.html;
        recursive_error_pages on;

        # ---- static delivery / routing ----------------------------------
        location / {
            try_files $uri $uri/ =404;
        }

        # `alias` points every case at the same physical documents as the
        # server root, so a MIME case cannot be confused with a routing case.
        location /alias/ {
            alias @PUBLIC@/;
        }

        # ---- bounded rewrite/variable engine -----------------------------
        # `set` values feed a request-time `proxy_pass`; the echoed upstream
        # path proves the expanded target reached the upstream.
        location = /rw/set/echo {
            set $backend "http://127.0.0.1:@UPSTREAM@";
            proxy_pass $backend$request_uri;
        }

        # A true `if` runs its body (here a literal add_header); a false one
        # must not.
        location = /rw/if/true {
            set $rw_on 1;
            if ($rw_on) {
                add_header X-Rewrite-If "yes";
            }
            return 200 "if-true";
        }

        location = /rw/if/false {
            set $rw_off "";
            if ($rw_off) {
                add_header X-Rewrite-If "no";
            }
            return 200 "if-false";
        }

        # Regex `if` with captures evaluated against `$host`.
        location = /rw/if/regex {
            if ($host ~* "^([a-z]+)\.example\.com$") {
                add_header X-Rewrite-Regex "match";
            }
            return 200 "if-regex";
        }

        # Location-regex capture `$1` used in a request-time `proxy_pass`.
        location ~ ^/rw/capture/([a-z]+)$ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/echo/$1$request_uri;
        }

        # Request-time `alias $variable`, confined by the operator allowlist
        # (@PUBLIC@ is supplied to the gateway as documentRootAllowlist).
        location /rw/root/ {
            set $rw_doc "@PUBLIC@";
            alias $rw_doc/;
        }

        location = /exact {
            return 200 "exact-body";
        }

        location /exact/ {
            return 200 "prefix-body";
        }

        # Regex locations are evaluated after prefix locations; `^~` below
        # suppresses the regex for /assets/.
        location ~ \.png$ {
            return 200 "regex-png";
        }

        location ^~ /assets/ {
            alias @PUBLIC@/;
        }

        location = /ret-status {
            return 204;
        }

        location = /ret-body {
            return 200 "ret-body";
        }

        location = /ret-url {
            return 301 https://diff.example.com/moved;
        }

        # `return 404` under a server-level `error_page 404` proves the mapping
        # applies to rewrite-phase statuses too.
        location = /ret-404 {
            return 404;
        }

        location /rw-last/ {
            rewrite ^/rw-last/(.*)$ /$1 last;
        }

        location /rw-break/ {
            rewrite ^/rw-break/(.*)$ /hello.txt break;
        }

        # The replacement is proxied so the mock upstream can report the
        # rewritten path: that makes captures observable instead of implied.
        location /cap/ {
            rewrite ^/cap/([a-z]+)/([0-9]+)$ /echo/cap-$1-num-$2 last;
        }

        location /rw-redirect/ {
            rewrite ^/rw-redirect/(.*)$ /hello.txt redirect;
        }

        location /rw-perm/ {
            rewrite ^/rw-perm/(.*)$ /hello.txt permanent;
        }

        location /app/ {
            try_files $uri $uri/ /app/index.html;
        }

        # Location-level error_page replaces the host mapping for this route.
        location /lost/ {
            error_page 404 /alt.html;
            try_files $uri =404;
        }

        # `=200` overrides the mapped status.
        location /lost-code/ {
            error_page 404 =200 /alt.html;
            try_files $uri =404;
        }

        # A missing error target recurses into the host-level mapping.
        location /chain/ {
            error_page 404 /missing-1.html;
            try_files $uri =404;
        }

        # ---- access control / auth --------------------------------------
        # Access and auth phases run before the content handler, so these proxy:
        # a rewrite-phase `return` would short-circuit them in nginx. The
        # upstream reports the received request target, so a routing difference
        # cannot hide behind an identical "allowed" body.
        location /admin/ {
            allow 127.0.0.0/8;
            deny all;
            proxy_pass http://127.0.0.1:@UPSTREAM@;
        }

        location /blocked/ {
            deny all;
            proxy_pass http://127.0.0.1:@UPSTREAM@;
        }

        # First matching rule wins: deny 127/8 is evaluated before allow all.
        location /deny-first/ {
            deny 127.0.0.0/8;
            allow all;
            proxy_pass http://127.0.0.1:@UPSTREAM@;
        }

        location /private/ {
            auth_basic "diff realm";
            auth_basic_user_file @HTPASSWD@;
            proxy_pass http://127.0.0.1:@UPSTREAM@;
        }

        # ---- request limits ---------------------------------------------
        location /rate/ {
            limit_req zone=httpreq burst=1 nodelay;
            proxy_pass http://127.0.0.1:@UPSTREAM@;
        }

        location /conn/ {
            limit_conn httpconn 1;
            proxy_pass http://127.0.0.1:@UPSTREAM@;
        }

        # ---- upstream proxying -------------------------------------------
        location /proxy/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@;
        }

        # A URI part on proxy_pass is spliced onto the matched-location
        # remainder exactly as written (see proxy.pass-uri-* cases).
        location /proxy-uri/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/v1/;
        }

        # Non-trailing-slash URI part: nginx appends the remainder directly, so
        # `/proxy-prefix/inner` reaches the upstream as `/v1inner`.
        location /proxy-prefix/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/v1;
        }

        location /proxy-host/ {
            proxy_set_header Host $host;
            proxy_pass http://127.0.0.1:@UPSTREAM@/echo/host;
        }

        # Default upstream request headers are suppressed on the locations that
        # echo the full header map, so the comparison sees the request fields
        # under test instead of the runtime's forwarding defaults.
        location /proxy-fwd/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host "";
            proxy_pass http://127.0.0.1:@UPSTREAM@;
        }

        location /proxy-hbh/ {
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Host "";
            proxy_pass http://127.0.0.1:@UPSTREAM@;
        }

        location /proxy-headers/ {
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Host "";
            proxy_pass http://127.0.0.1:@UPSTREAM@;
        }

        # nginx `proxy_method`: forward with a different method than the
        # client used. The mock upstream echoes the method it received.
        location /proxy-method/ {
            proxy_method POST;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Host "";
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }

        # Upstream error statuses pass through untouched by default.
        location /proxy-status/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/status/;
        }

        # Unreachable upstream: the runtime maps the transport failure to 502.
        location /proxy-dead/ {
            proxy_pass http://127.0.0.1:@DEAD@;
        }
    }

    # ---- gzip-policy host --------------------------------------------------
    # The gzip policy lives on its own host so generated error/limit/proxy
    # responses on the default host cannot pick up a `Vary` their engine does not
    # emit: the runtime only routes the server-level compression policy on the
    # final content path, while nginx's header filter also varies its own
    # generated error pages. Keeping the policy host separate means the gzip
    # cases compare only the negotiation contract, and the default host compares
    # generated responses without that orthogonal axis.
    server {
        listen 127.0.0.1:@PORT@;
        server_name gzip.example.com;

        root @PUBLIC@;
        index index.html;
        absolute_redirect off;

        # `gzip_vary on` states the negotiation policy explicitly: the runtime
        # declares `Vary: Accept-Encoding` on every representation the gzip policy
        # selects (whatever encoding it chooses), which is what nginx does with
        # gzip_vary on and not with its default off.
        gzip on;
        gzip_types text/plain application/json;
        gzip_min_length 64;
        gzip_vary on;

        location /gz/ {
            alias @PUBLIC@/;
        }

        # Location-level `gzip off` overrides the host policy.
        location /gzplain/ {
            gzip off;
            alias @PUBLIC@/;
        }
    }

    # ---- header-policy host ------------------------------------------------
    # Owns the `add_header` matrix: status gating (`always` vs the default
    # status list), replace-on-declare inheritance (this host replaces the
    # http-level array above), declaration order with duplicate names, variable
    # expansion, and the interaction with `error_page` internal redirects.
    server {
        listen 127.0.0.1:@PORT@;
        server_name headers.example.com;

        root @PUBLIC@;
        index index.html;

        absolute_redirect off;
        add_header X-Server-Level srv;
        add_header X-Server-Always srv-always always;
        # A security header declared the nginx way: emitted on every status
        # (`always`) exactly once, and replaced (not merged) by a location that
        # declares its own `add_header` array.
        add_header X-Content-Type-Options nosniff always;

        # Catch-all so an `error_page` target (and ordinary files) resolve on
        # this host exactly as they would in a real site block.
        location / {
            try_files $uri $uri/ =404;
        }

        location /alias/ {
            alias @PUBLIC@/;
        }

        location /rw-perm/ {
            rewrite ^/rw-perm/(.*)$ /hello.txt permanent;
        }

        # Default status list: neither field is emitted for a 404 (X-Server-Always
        # is, because it is `always`).
        location = /hdr-404 {
            return 404;
        }

        # A location that declares `add_header` replaces the server array for
        # that location; duplicate names keep declaration order.
        location = /hdr-loc {
            add_header X-Loc-Level loc;
            add_header X-Loc-Dup one;
            add_header X-Loc-Dup two;
            return 200 "hdr-loc";
        }

        # Variable expansion in an `add_header` value.
        location = /hdr-vars {
            add_header X-Vars "$host|$request_uri|$scheme|$request_method";
            return 200 "hdr-vars";
        }

        # `return <3xx> <url>` under an `error_page <3xx>` mapping: nginx serves
        # the mapped page under the 301 status and keeps the redirect Location.
        location = /hdr-301 {
            error_page 301 /alt.html;
            return 301 /hello.txt;
        }

        # Location-level `always` field on a static representation: present on a
        # 200 and on a generated 404, while the replaced server array is absent.
        location /hdrfiles/ {
            alias @PUBLIC@/;
            add_header X-Loc-File locfile always;
        }

        # A generated 403 from the access phase: its location's `always` field
        # must still be emitted (nginx runs the headers filter for every response).
        location /hdrdenied/ {
            deny all;
            alias @PUBLIC@/;
            add_header X-Loc-Denied denied always;
        }
    }

    # ---- unmatched-route host ----------------------------------------------
    # A host with an exact location only: a request that matches no location is
    # answered by nginx's generated 404, which still carries the inherited
    # http-level `add_header` policy. Kept off the gzip host so the compression
    # axis cannot colour the comparison.
    server {
        listen 127.0.0.1:@PORT@;
        server_name noroute.example.com;

        root @PUBLIC@;
        index index.html;
        absolute_redirect off;

        location = /only {
            return 200 "only";
        }
    }

    # ---- MIME-table host ---------------------------------------------------
    # Owns the `types` / `default_type` matrix. The `types` block is declared at
    # the http level above; this host replaces it with its own table and a
    # different `default_type`, so a level-declared table that did NOT replace
    # the inherited one is visible as a wrong content type. A location below
    # replaces the host table again (nginx: replace-on-declare, `default_type`
    # inherits independently).
    server {
        listen 127.0.0.1:@PORT@;
        server_name mime.example.com;

        root @PUBLIC@;
        index index.html;
        absolute_redirect off;

        default_type application/x-host-default;
        types {
            application/x-host-txt  txt;
            text/html               html;
            text/css                css;
            application/json        json;
            application/javascript  js;
            image/png               png;
        }

        location /m/ {
            alias @PUBLIC@/;
        }

        location /m-loc/ {
            types {
                application/x-loc-txt  txt;
            }
            default_type application/x-loc-default;
            alias @PUBLIC@/;
        }

        # A location table that declares no `default_type` inherits the host
        # default independently of the replaced table.
        location /m-loc-inherit/ {
            types {
                application/x-inherit-txt  txt;
            }
            alias @PUBLIC@/;
        }

        # An explicitly empty `types {}` table replaces the inherited table, so
        # every extension falls through to `default_type`.
        location /m-raw/ {
            types { }
            alias @PUBLIC@/;
        }

        # A `return` body derives its content type from the request URI
        # extension through the resolved table (`default_type` when there is no
        # extension), not from the response body.
        location = /m-ret {
            return 200 "ret-body";
        }

        location = /m-ret.txt {
            return 200 "ret-txt-body";
        }
    }

    # ---- precompressed-sidecar host ----------------------------------------
    # Owns the `gzip_static` / `gzip_vary` matrix. `static/page.txt` has a
    # `static/page.txt.gz` sidecar whose bytes differ from the identity file, so
    # the served representation, its `Content-Length` and its validators prove
    # which file answered. `static/plain.txt` has no sidecar.
    server {
        listen 127.0.0.1:@PORT@;
        server_name gzstatic.example.com;

        absolute_redirect off;

        # `gzip_static on`: sidecar only when the client accepts gzip.
        location /on/ {
            gzip_static on;
            alias @PUBLIC@/static/;
        }

        # `gzip_static on` + `gzip_vary on`: the negotiation field is declared
        # on both representations (nginx only sets it in `on` mode).
        location /onvary/ {
            gzip_static on;
            gzip_vary on;
            alias @PUBLIC@/static/;
        }

        # `gzip_static always`: sidecar regardless of `Accept-Encoding`, no
        # `Vary` (the representation is not negotiated).
        location /always/ {
            gzip_static always;
            alias @PUBLIC@/static/;
        }

        # No `gzip_static`: identity file only.
        location /off/ {
            alias @PUBLIC@/static/;
        }

        # Dynamic gzip with `gzip_vary` declared / defaulted off.
        location /dynvary/ {
            gzip on;
            gzip_types text/plain;
            gzip_min_length 20;
            gzip_vary on;
            alias @PUBLIC@/static/;
        }

        location /dynnovary/ {
            gzip on;
            gzip_types text/plain;
            gzip_min_length 20;
            gzip_vary off;
            alias @PUBLIC@/static/;
        }

        # No `gzip_vary` declared at all: nginx's default is off.
        location /dyndefault/ {
            gzip on;
            gzip_types text/plain;
            gzip_min_length 20;
            alias @PUBLIC@/static/;
        }
    }


    # ---- redirect-construction policy hosts --------------------------------
    # nginx builds the client-visible `Location` in its header filter
    # (`ngx_http_header_filter`): a relative target is made absolute from the
    # resolved host/port unless `absolute_redirect off`. These four hosts pin
    # every dimension the differential battery compares — absolute vs relative,
    # port in/out, `server_name` vs request `Host` — and each host also covers
    # the directory redirect, `return 301 /path`, rewrite `redirect`/`permanent`
    # and an absolute `return` URL that must pass through untouched.
    server {
        listen 127.0.0.1:@PORT@;
        server_name redirect.example.com;

        root @PUBLIC@;
        index index.html;
        absolute_redirect on;
        port_in_redirect on;
        server_name_in_redirect off;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /ret-rel {
            return 301 /hello.txt;
        }

        # An absolute target is authoritative and never rewritten.
        location = /ret-abs {
            return 301 https://other.example.com/moved;
        }

        location /rw-redirect/ {
            rewrite ^/rw-redirect/(.*)$ /hello.txt redirect;
        }

        # `error_page` mapping of a `return 3xx`: the mapped page keeps the
        # redirect status and its Location, which is still constructed under the
        # host policy.
        location = /mapped-301 {
            error_page 301 /alt.html;
            return 301 /hello.txt;
        }
    }

    server {
        listen 127.0.0.1:@PORT@;
        server_name redirect-rel.example.com;

        root @PUBLIC@;
        index index.html;
        absolute_redirect off;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /ret-rel {
            return 301 /hello.txt;
        }
    }

    server {
        listen 127.0.0.1:@PORT@;
        server_name redirect-noport.example.com;

        root @PUBLIC@;
        index index.html;
        absolute_redirect on;
        port_in_redirect off;

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 127.0.0.1:@PORT@;
        # The request presents the *second* name so the absolute Location proves
        # `server_name_in_redirect on` uses the first declared server_name.
        server_name redirect-srvname.example.com redirect-alias.example.com;

        root @PUBLIC@;
        index index.html;
        absolute_redirect on;
        server_name_in_redirect on;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /ret-rel {
            return 301 /hello.txt;
        }
    }

    # ---- max_ranges hosts --------------------------------------------------
    # `max_ranges 0` disables byte-range processing entirely (200 full body and
    # no `Accept-Ranges`); a ceiling `n` declines range processing when the
    # request asks for more than `n` ranges, answering the full 200 while still
    # advertising `Accept-Ranges`.
    server {
        listen 127.0.0.1:@PORT@;
        server_name ranges.example.com;

        root @PUBLIC@;
        absolute_redirect off;

        location /zero/ {
            max_ranges 0;
            alias @PUBLIC@/static/;
        }

        location /one/ {
            max_ranges 1;
            alias @PUBLIC@/static/;
        }

        location /two/ {
            max_ranges 2;
            alias @PUBLIC@/static/;
        }
    }

    # ---- configurable limit-status host ------------------------------------
    # `limit_req_status`/`limit_conn_status` default to 503; this host proves
    # the configured 429 replaces it (location-level for rate limiting,
    # server-level inheritance for connection limiting).
    server {
        listen 127.0.0.1:@PORT@;
        server_name limits.example.com;

        root @PUBLIC@;
        absolute_redirect off;
        limit_conn_status 429;

        location /rate429/ {
            limit_req zone=httpreq429 burst=1 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:@UPSTREAM@;
        }

        location /conn429/ {
            limit_conn httpconn429 1;
            proxy_pass http://127.0.0.1:@UPSTREAM@;
        }
    }

    # ---- map-variable host -------------------------------------------------
    # Owns the `map` differential matrix. It declares its own `add_header`
    # array (which replaces the inherited http-level one), so the map values
    # are observable on static responses without disturbing the header-policy
    # cases above.
    server {
        listen 127.0.0.1:@PORT@;
        server_name maps.example.com;

        root @PUBLIC@;
        index index.html;
        absolute_redirect off;

        add_header X-Map-Tenant "$tenant_zone";
        add_header X-Map-Role "$host_role";
        add_header X-Map-Method "$method_tag";
        add_header X-Map-Arg "$tag_value";
        add_header X-Map-Empty "$empty_map_result";

        location /alias/ {
            alias @PUBLIC@/;
        }

        # A `return` body is a variable script in nginx: every declared map
        # result expands here.
        location = /m-ret {
            return 200 "zone=$tenant_zone|role=$host_role|method=$method_tag|arg=$tag_value";
        }

        # A `return` URL expands map results exactly like `$host`/`$scheme`.
        location = /m-url {
            return 302 https://maps.example.com/$tenant_zone;
        }

        # `rewrite` replacements are scripts: `$tenant_zone` resolves after the
        # regex captures are substituted.
        location /m-rw/ {
            rewrite ^/m-rw/(.*)$ /m-shared/$tenant_zone/$1 last;
        }

        location /m-shared/ {
            return 200 "uri=$uri";
        }

        # `proxy_set_header` values expand map results; the mock upstream
        # reports the received value.
        location = /m-proxy {
            proxy_set_header X-Map-Zone $tenant_zone;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Host "";
            proxy_pass http://127.0.0.1:@UPSTREAM@/echo/header/x-map-zone;
        }
    }

    # ---- proxy response-header policy host --------------------------------
    # Pins nginx `proxy_hide_header` / `proxy_pass_header` (on top of the
    # default-hidden upstream header set Date, Server, X-Pad, X-Accel-*),
    # `proxy_redirect` (off / default / explicit rules, including the Refresh
    # header), and `proxy_cookie_path` / `proxy_cookie_domain` attribute
    # rewriting. `absolute_redirect off` keeps a rewritten relative `Location`
    # relative; the separate `proxyhdr-abs` host pins the header filter's
    # absolutization of a rewritten target.
    server {
        listen 127.0.0.1:@PORT@;
        server_name proxyhdr.example.com;

        root @PUBLIC@;
        absolute_redirect off;

        location /plain/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }

        # One extra hidden field and one force-passed default-hidden field.
        location /hide/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
            proxy_hide_header X-Secret;
        }

        location /pass/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
            proxy_pass_header X-Pad;
            proxy_pass_header X-Accel-Buffering;
        }

        location /redirect-default/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
            proxy_redirect default;
        }

        location /redirect-off/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
            proxy_redirect off;
        }

        location /redirect-explicit/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
            proxy_redirect http://127.0.0.1:@UPSTREAM@/ /client/;
        }

        location /redirect-explicit-absolute/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
            proxy_redirect http://other.example.com/ https://edge.example.com/;
        }

        location /cookie-path/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
            proxy_cookie_path /upstream /client;
        }

        location /cookie-domain/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
            proxy_cookie_domain upstream.example.com edge.example.com;
        }

        # A leading dot on the configured domain is normalized away; the
        # matched attribute's own dot is preserved (differential-confirmed).
        location /cookie-domain-dot/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
            proxy_cookie_domain .upstream.example.com edge.example.com;
        }

        location /cookie-both/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
            proxy_cookie_path /upstream /client/;
            proxy_cookie_domain upstream.example.com edge.example.com;
        }

        location /cookie-off/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
            proxy_cookie_path off;
            proxy_cookie_domain off;
        }
    }

    # `absolute_redirect on`: a rewritten relative Location is made absolute by
    # the header filter from the request host and listener port.
    server {
        listen 127.0.0.1:@PORT@;
        server_name proxyhdr-abs.example.com;

        root @PUBLIC@;
        absolute_redirect on;
        port_in_redirect on;
        server_name_in_redirect off;

        location /redirect-default/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
            proxy_redirect default;
        }

        location /redirect-explicit/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
            proxy_redirect http://127.0.0.1:@UPSTREAM@/ /client/;
        }
    }

    # ---- internal-location host -------------------------------------------
    # An `internal` location is reachable only through an internal redirect; an
    # external request is answered with the generated 404, and the internal
    # location's own `add_header` array plus the host `error_page` mapping still
    # apply to that 404.
    server {
        listen 127.0.0.1:@PORT@;
        server_name internal.example.com;

        root @PUBLIC@;
        absolute_redirect off;
        add_header X-Srv srv always;
        error_page 404 /server-404.html;

        # A real site block: the `error_page` target resolves through it (and
        # a matching external 404 therefore carries this location's inherited
        # header policy, exactly like nginx re-running location selection).
        location / {
            try_files $uri $uri/ =404;
        }

        location /pub/ {
            return 200 "pub";
        }

        location /internal/ {
            internal;
            add_header X-Int int always;
            return 200 "internal-body";
        }

        # `rewrite … last` is the internal redirect that makes it reachable.
        location /int-rewrite/ {
            rewrite ^/int-rewrite/(.*)$ /internal/$1 last;
        }

        # `error_page` internally redirects into the internal location; the
        # original 404 status is kept (no `=` override).
        location /int-errpage/ {
            error_page 404 /internal/notfound;
            return 404;
        }
    }

    # No `error_page` mapping: the external-internal 404 is nginx's generated
    # page, carrying the server `always` header.
    server {
        listen 127.0.0.1:@PORT@;
        server_name internal-plain.example.com;

        root @PUBLIC@;
        absolute_redirect off;
        add_header X-Plain plain always;

        location /internal-plain/ {
            internal;
            return 200 "internal-plain";
        }
    }

    # ---- merge_slashes off host -------------------------------------------
    # `merge_slashes off` keeps repeated adjacent slashes: an exact location
    # only matches the unmerged spelling, `$uri` keeps them, and static
    # resolution still finds the same file (the OS collapses them).
    server {
        listen 127.0.0.1:@PORT@;
        server_name merge.example.com;

        root @PUBLIC@;
        absolute_redirect off;

        location = /merge/exact {
            return 200 "merge-exact";
        }

        location /merge/ {
            return 200 "merge-prefix";
        }

        location /merge/show/ {
            return 200 "uri=$uri|request_uri=$request_uri";
        }

        location /merge/files/ {
            alias @PUBLIC@/;
        }
    }

    # ---- request header acceptance policy ---------------------------------
    # nginx `underscores_in_headers` defaults to off (underscore-named request
    # headers are dropped at the request boundary); the second host turns it on
    # and the mocked upstream reports the headers it actually received.
    server {
        listen 127.0.0.1:@PORT@;
        server_name headers-underscore-off.example.com;

        location /echo/ {
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Host "";
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }
    }

    server {
        listen 127.0.0.1:@PORT@;
        server_name headers-underscore-on.example.com;
        underscores_in_headers on;

        location /echo/ {
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Forwarded-Host "";
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }
    }

    # `ignore_invalid_headers off`: a header line whose name is not a valid
    # token is still a hard parse error in nginx 1.29.6 (it answers 400), which
    # is also the runtime's strict HTTP-boundary behavior. The directive is
    # pinned here because it changes the accepted configuration surface.
    server {
        listen 127.0.0.1:@PORT@;
        server_name headers-invalid-strict.example.com;
        ignore_invalid_headers off;

        location /echo/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }
    }

    # ---- charset family hosts ---------------------------------------------
    # nginx's charset header filter: `charset` appends `; charset=<name>` to
    # matching media types (default list: text/html, text/xml, text/plain,
    # text/vnd.wap.wml, application/javascript, application/rss+xml), a
    # declared `charset_types` list is seeded with `text/html` first, `*`
    # matches every type, `charset off` disables the inherited value, and a
    # 301/302 never publishes a charset. The proxy locations pin the
    # `override_charset` interaction with an upstream `Content-Type`.
    server {
        listen 127.0.0.1:@PORT@;
        server_name charset.example.com;

        root @PUBLIC@;
        absolute_redirect off;
        # Server-level declaration, inherited by every location that declares
        # nothing; no `charset_types` here, so the built-in default list applies.
        charset utf-8;

        location /plain/ {
            alias @PUBLIC@/;
        }

        location /off/ {
            charset off;
            alias @PUBLIC@/;
        }

        # A declared list is `text/html` plus the declared types
        # (differential-confirmed against nginx 1.29.6).
        location /types-css/ {
            charset_types text/css;
            alias @PUBLIC@/;
        }

        location /wild/ {
            charset_types *;
            alias @PUBLIC@/;
        }

        location /ret/ {
            return 200 "charset-ret";
        }

        location /ret-301/ {
            return 301 /hello.txt;
        }

        # Upstream response without a charset: the configured charset applies.
        # Upstream response with a charset: kept unless override_charset is on.
        location /p-off/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }

        location /p-on/ {
            override_charset on;
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }
    }

    # Server-level `charset_types` inheritance: this host's list is
    # `text/html` + `application/json`; the `/loc-css/` location replaces it
    # with `text/html` + `text/css`.
    server {
        listen 127.0.0.1:@PORT@;
        server_name charset-types.example.com;

        root @PUBLIC@;
        absolute_redirect off;
        charset utf-8;
        charset_types application/json;

        location /plain/ {
            alias @PUBLIC@/;
        }

        location /loc-css/ {
            charset_types text/css;
            alias @PUBLIC@/;
        }
    }

    # ---- gzip refinement host -------------------------------------------------
    # `gzip_disable` (case-insensitive UA regex, plus the predefined `msie6`
    # selector) and `gzip_proxied` (conditions for a request carrying `Via`).
    # Static locations pin the UA gate; proxy locations pin the proxied-request
    # policy against deterministic upstream response headers.
    server {
        listen 127.0.0.1:@PORT@;
        server_name gzipref.example.com;

        root @PUBLIC@;
        absolute_redirect off;
        gzip on;
        gzip_types text/plain;
        gzip_min_length 10;

        # Control: no UA gate, no `Via` gate.
        location /plain/ {
            alias @PUBLIC@/;
        }

        location /disable-ua/ {
            gzip_disable "googlebot";
            alias @PUBLIC@/;
        }

        location /disable-msie6/ {
            gzip_disable "msie6";
            alias @PUBLIC@/;
        }

        # Proxied-request policy: the mock upstream answers with a text/plain
        # body (and deterministic cache headers per path).
        location /px-only/ {
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }

        location /px-off/ {
            gzip_proxied off;
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }

        location /px-any/ {
            gzip_proxied any;
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }

        location /px-nocache/ {
            gzip_proxied no-cache;
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }

        location /px-lm/ {
            gzip_proxied no_last_modified;
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }

        location /px-auth/ {
            gzip_proxied auth;
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }

        location /px-expired/ {
            gzip_proxied expired;
            proxy_pass http://127.0.0.1:@UPSTREAM@/;
        }
    }

    # ---- autoindex host ---------------------------------------------------
    # nginx's generated directory listings (`ngx_http_autoindex_module`):
    # html (default), json, jsonp and xml shapes, exact vs human-readable
    # sizes, the localtime variant, `autoindex off` retaining the 403, and an
    # `index` file winning over the listing. All fixture mtimes (files and
    # directories) are pinned by the battery, so the listings are deterministic
    # apart from the `localtime` variant, for which the gateway is spawned with
    # TZ=UTC exactly like the oracle.
    server {
        listen 127.0.0.1:@PORT@;
        server_name autoindex.example.com;

        root @PUBLIC@;
        absolute_redirect off;

        location /list/ {
            autoindex on;
            alias @PUBLIC@/autoindex/;
        }

        location /list-human/ {
            autoindex on;
            autoindex_exact_size off;
            alias @PUBLIC@/autoindex/;
        }

        location /list-localtime/ {
            autoindex on;
            autoindex_localtime on;
            alias @PUBLIC@/autoindex/;
        }

        location /list-json/ {
            autoindex on;
            autoindex_format json;
            alias @PUBLIC@/autoindex/;
        }

        location /list-jsonp/ {
            autoindex on;
            autoindex_format jsonp;
            alias @PUBLIC@/autoindex/;
        }

        location /list-xml/ {
            autoindex on;
            autoindex_format xml;
            alias @PUBLIC@/autoindex/;
        }

        location /list-off/ {
            autoindex off;
            alias @PUBLIC@/autoindex/;
        }

        # A directory that has an `index.html`: the index module serves it and
        # the listing never runs.
        location /with-index/ {
            autoindex on;
            alias @PUBLIC@/autoindex_index/;
        }
    }

    # ---- empty_gif host ---------------------------------------------------
    # `empty_gif` is a location handler (GET/HEAD only) serving the canonical
    # 43-byte 1x1 transparent GIF with `Content-Type: image/gif`.
    server {
        listen 127.0.0.1:@PORT@;
        server_name emptygif.example.com;

        root @PUBLIC@;
        absolute_redirect off;

        location = /pixel.gif {
            empty_gif;
        }
    }

    # ---- stub_status host -------------------------------------------------
    # `stub_status` is a location handler; the conventional deployment gates it
    # with `allow 127.0.0.1; deny all;` (the runtime additionally refuses
    # non-loopback clients).
    server {
        listen 127.0.0.1:@PORT@;
        server_name status.example.com;

        root @PUBLIC@;
        absolute_redirect off;

        location = /status {
            allow 127.0.0.1;
            deny all;
            stub_status;
        }
    }

    # ---- referer host -----------------------------------------------------
    # `valid_referers` + `$invalid_referer`: add_header publishes "1" when the
    # Referer is rejected and omits the field when it is valid (nginx omits an
    # empty expanded value).
    server {
        listen 127.0.0.1:@PORT@;
        server_name referer.example.com;

        root @PUBLIC@;
        absolute_redirect off;

        valid_referers none blocked server_names *.allowed.test allowed.org/galleries ~\.google\.;
        add_header X-Referer-Invalid $invalid_referer always;

        location = /ref/ {
            return 200 "ref-ok";
        }

        # A location declaration replaces the inherited list.
        location = /ref-own/ {
            valid_referers server_names;
            return 200 "ref-own";
        }
    }

    # ---- geo / split_clients host -----------------------------------------
    server {
        listen 127.0.0.1:@PORT@;
        server_name geosplit.example.com;

        root @PUBLIC@;
        absolute_redirect off;

        location = /gs/ {
            add_header X-Geo $geo_zone always;
            add_header X-Xff $xff_zone always;
            add_header X-V6 $v6_zone always;
            add_header X-Split $split_bucket always;
            return 200 "gs";
        }
    }
}
