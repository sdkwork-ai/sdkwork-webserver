daemon off;
master_process off;
error_log stderr notice;

# Differential upstream-protocol fixture (Wave 5 FastCGI slice).
#
# One template is rendered twice: the oracle listens on @PORT@ and talks to the
# mock FastCGI responder on @FCGI@; the Rust data plane listens on a different
# port and talks to its own responder instance. `battery.py` sends the same
# requests to both sides; the responder's JSON body echoes the received
# `PARAMS`/`STDIN`, so parameter mapping is compared byte for byte.
#
# Placeholders: @ROOT@ fixture root, @PORT@ listener port, @FCGI@/@UWSGI@/
# @SCGI@/@MEMCACHED@ responder ports, @UWSGI_TLS_OK@/@UWSGI_TLS_UNTRUSTED@
# TLS uWSGI responders, @GRPC@ plaintext gRPC responder,
# @GRPC_TLS_OK@/@GRPC_TLS_UNTRUSTED@ TLS gRPC responders (the second port keeps
# nginx's upstream connection reuse from carrying a verified connection into the
# untrusted-CA case), @DEAD@ loopback port nothing listens on (next_upstream
# failover).
#
# All `fastcgi_param` entries live at the http level: nginx inherits them into
# every location that declares none (replace-on-declare), which also exercises
# the runtime's http → server → location parameter inheritance.

events {
    worker_connections 256;
}

http {
    access_log off;
    default_type text/plain;

    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param DOCUMENT_ROOT $document_root;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param CONTENT_LENGTH $content_length;
    fastcgi_param CONTENT_TYPE $content_type;
    fastcgi_param SERVER_PROTOCOL $server_protocol;
    fastcgi_param HTTP_X_SENT $http_x_sent;

    uwsgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    uwsgi_param SCRIPT_NAME $fastcgi_script_name;
    uwsgi_param PATH_INFO $fastcgi_path_info;
    uwsgi_param DOCUMENT_ROOT $document_root;
    uwsgi_param REQUEST_METHOD $request_method;
    uwsgi_param REQUEST_URI $request_uri;
    uwsgi_param QUERY_STRING $query_string;
    uwsgi_param CONTENT_LENGTH $content_length;
    uwsgi_param CONTENT_TYPE $content_type;
    uwsgi_param SERVER_PROTOCOL $server_protocol;
    uwsgi_param HTTP_X_SENT $http_x_sent;

    scgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    scgi_param SCRIPT_NAME $fastcgi_script_name;
    scgi_param DOCUMENT_ROOT $document_root;
    scgi_param REQUEST_METHOD $request_method;
    scgi_param REQUEST_URI $request_uri;
    scgi_param QUERY_STRING $query_string;
    scgi_param CONTENT_TYPE $content_type;
    scgi_param SERVER_PROTOCOL $server_protocol;
    scgi_param HTTP_X_SENT $http_x_sent;

    memcached_read_timeout 10s;

    upstream fastcgi_mock {
        server 127.0.0.1:@DEAD@;
        server 127.0.0.1:@FCGI@;
    }

    # Wave 7A: `fastcgi_keep_conn on` + an upstream keepalive cache, so two
    # sequential requests are answered on one responder connection and the
    # mock can prove reuse with its per-connection id.
    upstream fastcgi_keepalive {
        server 127.0.0.1:@FCGI@;
        keepalive 16;
    }

    upstream grpc_retry_upstream {
        server 127.0.0.1:@DEAD@;
        server 127.0.0.1:@GRPC@;
    }

    server {
        listen 127.0.0.1:@PORT@ default_server;
        server_name fcgi.example.com;
        root @ROOT@;

        location /echo/ {
            fastcgi_pass 127.0.0.1:@FCGI@;
        }

        location /split/ {
            fastcgi_split_path_info ^(/split/[^/]+\.php)(/.*)$;
            fastcgi_pass 127.0.0.1:@FCGI@;
        }

        location /dir/ {
            fastcgi_index index.php;
            fastcgi_pass 127.0.0.1:@FCGI@;
        }

        location /headers {
            fastcgi_hide_header X-Mock-Hide;
            fastcgi_hide_header X-Mock-Pass;
            fastcgi_pass_header X-Mock-Pass;
            fastcgi_pass 127.0.0.1:@FCGI@;
        }

        location /errors/ {
            fastcgi_intercept_errors on;
            error_page 404 /fallback.txt;
            fastcgi_pass 127.0.0.1:@FCGI@;
        }

        # The error_page target is an explicit exact location: both sides run
        # the same internal redirect and serve the same fixture file.
        location = /fallback.txt {
            root @ROOT@;
        }

        # Wave 7A transport: bind the upstream source address; the responder
        # echoes the accepted peer so the differential proves the bind.
        location /bind/ {
            fastcgi_bind 127.0.0.2;
            fastcgi_pass 127.0.0.1:@FCGI@;
        }

        location /bind-uwsgi/ {
            uwsgi_bind 127.0.0.2;
            uwsgi_pass 127.0.0.1:@UWSGI@;
        }

        location /bind-scgi/ {
            scgi_bind 127.0.0.2;
            scgi_pass 127.0.0.1:@SCGI@;
        }

        location /bind-cache/ {
            set $memcached_key $uri;
            memcached_bind 127.0.0.2;
            memcached_pass 127.0.0.1:@MEMCACHED@;
        }

        location /keepconn/ {
            fastcgi_keep_conn on;
            fastcgi_pass fastcgi_keepalive;
        }

        location /uwsgi/ {
            uwsgi_pass 127.0.0.1:@UWSGI@;
            uwsgi_modifier1 0;
            uwsgi_modifier2 0;
            uwsgi_string "extra=1";
            uwsgi_hide_header X-Mock-Hide;
            uwsgi_pass_header X-Mock-Hide;
            uwsgi_intercept_errors on;
            error_page 404 /fallback.txt;
        }

        # ---- Wave 7B: uWSGI upstream TLS (`suwsgi://` + `uwsgi_ssl_*`) ----
        # The server certificate carries only `DNS:uwsgi-tls.test`, so the
        # trusted-CA case succeeds only when `uwsgi_ssl_name` (SNI and
        # verification name override) is honored.
        location /uwsgi-tls/ {
            uwsgi_pass suwsgi://127.0.0.1:@UWSGI_TLS_OK@;
            uwsgi_ssl_verify on;
            uwsgi_ssl_trusted_certificate grpc-ca.pem;
            uwsgi_ssl_server_name on;
            uwsgi_ssl_name uwsgi-tls.test;
            uwsgi_ssl_protocols TLSv1.2 TLSv1.3;
        }

        location /uwsgi-tls-untrusted/ {
            uwsgi_pass suwsgi://127.0.0.1:@UWSGI_TLS_UNTRUSTED@;
            uwsgi_ssl_verify on;
            uwsgi_ssl_trusted_certificate grpc-other-ca.pem;
            uwsgi_ssl_server_name on;
            uwsgi_ssl_name uwsgi-tls.test;
        }

        location /uwsgi-tls-mtls/ {
            uwsgi_pass suwsgi://127.0.0.1:@UWSGI_TLS_OK@;
            uwsgi_ssl_verify on;
            uwsgi_ssl_trusted_certificate grpc-ca.pem;
            uwsgi_ssl_server_name on;
            uwsgi_ssl_name uwsgi-tls.test;
            uwsgi_ssl_certificate uwsgi-tls-client.pem;
            uwsgi_ssl_certificate_key uwsgi-tls-client.key;
        }

        location /scgi/ {
            scgi_pass 127.0.0.1:@SCGI@;
            scgi_hide_header X-Mock-Hide;
            scgi_pass_header X-Mock-Hide;
        }

        location /mc/ {
            set $memcached_key $uri;
            memcached_pass 127.0.0.1:@MEMCACHED@;
        }

        location /mc-raw/ {
            set $memcached_key $uri;
            memcached_pass 127.0.0.1:@MEMCACHED@;
        }

        location /retry/ {
            fastcgi_pass fastcgi_mock;
            fastcgi_next_upstream error timeout;
            fastcgi_next_upstream_tries 2;
        }

        # ---- gRPC over HTTP/2 (ngx_http_grpc_module) --------------------
        # The mock dispatch is keyed by the final path segment, and every
        # location forwards the request target unchanged (nginx grpc_pass has no
        # URI replacement semantics).
        location = /grpc.test.Echo/Unary { grpc_pass grpc://127.0.0.1:@GRPC@; }
        location = /grpc.test.Echo/Error { grpc_pass grpc://127.0.0.1:@GRPC@; }
        location = /grpc.test.Echo/StatusError { grpc_pass grpc://127.0.0.1:@GRPC@; }
        location = /grpc.test.Echo/Stream { grpc_pass grpc://127.0.0.1:@GRPC@; }
        location = /grpc.test.Echo/BadTrailers { grpc_pass grpc://127.0.0.1:@GRPC@; }
        location = /grpc.test.Echo/Headers {
            grpc_set_header X-Sent literal-sent;
            grpc_set_header X-Host $host;
            grpc_set_header X-Client "";
            grpc_pass grpc://127.0.0.1:@GRPC@;
        }
        location = /grpc.test.Echo/Hide {
            grpc_hide_header X-Mock-Hide;
            grpc_pass_header X-Mock-Pass;
            grpc_pass grpc://127.0.0.1:@GRPC@;
        }
        location = /grpc.test.Echo/Slow {
            grpc_read_timeout 1s;
            grpc_pass grpc://127.0.0.1:@GRPC@;
        }
        location = /grpc.test.Echo/TlsOk {
            grpc_ssl_verify on;
            grpc_ssl_trusted_certificate grpc-ca.pem;
            grpc_ssl_server_name on;
            grpc_ssl_name localhost;
            grpc_pass grpcs://127.0.0.1:@GRPC_TLS_OK@;
        }
        location = /grpc.test.Echo/TlsUntrusted {
            grpc_ssl_verify on;
            grpc_ssl_trusted_certificate grpc-other-ca.pem;
            grpc_ssl_server_name on;
            grpc_ssl_name localhost;
            grpc_pass grpcs://127.0.0.1:@GRPC_TLS_UNTRUSTED@;
        }
        location = /grpc.test.Echo/Retry {
            grpc_pass grpc_retry_upstream;
            grpc_next_upstream error timeout;
            grpc_next_upstream_tries 2;
        }
        location = /grpc.test.Echo/Dead {
            grpc_pass grpc://127.0.0.1:@DEAD@;
        }
        location = /grpc.test.Echo/InterceptHttp {
            grpc_intercept_errors on;
            error_page 503 /grpc-fallback.txt;
            grpc_pass grpc://127.0.0.1:@GRPC@;
        }
        location = /grpc-fallback.txt {
            return 200 "grpc-fallback";
        }
    }

    # Oracle render only: the runner injects `unix-server.conf` here for real
    # nginx. The gateway side runs unix transport through a typed JSON
    # configuration in a separate process, because the nginx plane fails closed
    # on `unix:` pass targets by design.
    # @UNIX_SERVER_INJECT@
}
