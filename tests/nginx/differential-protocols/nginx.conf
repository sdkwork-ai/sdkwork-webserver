daemon off;
master_process off;
error_log stderr notice;

# Differential upstream-protocol fixture (Wave 5 FastCGI slice).
#
# One template is rendered twice: the oracle listens on @PORT@ and talks to the
# mock FastCGI responder on @FCGI@; the Rust data plane listens on a different
# port and talks to its own responder instance. `battery.py` sends the same
# requests to both sides; the responder's JSON body echoes the received
# `PARAMS`/`STDIN`, so parameter mapping is compared byte for byte.
#
# Placeholders: @ROOT@ fixture root, @PORT@ listener port, @FCGI@/@UWSGI@/
# @SCGI@/@MEMCACHED@ responder ports, @DEAD@ loopback port nothing listens on
# (next_upstream failover).
#
# All `fastcgi_param` entries live at the http level: nginx inherits them into
# every location that declares none (replace-on-declare), which also exercises
# the runtime's http → server → location parameter inheritance.

events {
    worker_connections 256;
}

http {
    access_log off;
    default_type text/plain;

    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param DOCUMENT_ROOT $document_root;
    fastcgi_param REQUEST_METHOD $request_method;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param CONTENT_LENGTH $content_length;
    fastcgi_param CONTENT_TYPE $content_type;
    fastcgi_param SERVER_PROTOCOL $server_protocol;
    fastcgi_param HTTP_X_SENT $http_x_sent;

    uwsgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    uwsgi_param SCRIPT_NAME $fastcgi_script_name;
    uwsgi_param PATH_INFO $fastcgi_path_info;
    uwsgi_param DOCUMENT_ROOT $document_root;
    uwsgi_param REQUEST_METHOD $request_method;
    uwsgi_param REQUEST_URI $request_uri;
    uwsgi_param QUERY_STRING $query_string;
    uwsgi_param CONTENT_LENGTH $content_length;
    uwsgi_param CONTENT_TYPE $content_type;
    uwsgi_param SERVER_PROTOCOL $server_protocol;
    uwsgi_param HTTP_X_SENT $http_x_sent;

    scgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    scgi_param SCRIPT_NAME $fastcgi_script_name;
    scgi_param DOCUMENT_ROOT $document_root;
    scgi_param REQUEST_METHOD $request_method;
    scgi_param REQUEST_URI $request_uri;
    scgi_param QUERY_STRING $query_string;
    scgi_param CONTENT_TYPE $content_type;
    scgi_param SERVER_PROTOCOL $server_protocol;
    scgi_param HTTP_X_SENT $http_x_sent;

    memcached_read_timeout 10s;

    upstream fastcgi_mock {
        server 127.0.0.1:@DEAD@;
        server 127.0.0.1:@FCGI@;
    }

    server {
        listen 127.0.0.1:@PORT@ default_server;
        server_name fcgi.example.com;
        root @ROOT@;

        location /echo/ {
            fastcgi_pass 127.0.0.1:@FCGI@;
        }

        location /split/ {
            fastcgi_split_path_info ^(/split/[^/]+\.php)(/.*)$;
            fastcgi_pass 127.0.0.1:@FCGI@;
        }

        location /dir/ {
            fastcgi_index index.php;
            fastcgi_pass 127.0.0.1:@FCGI@;
        }

        location /headers {
            fastcgi_hide_header X-Mock-Hide;
            fastcgi_hide_header X-Mock-Pass;
            fastcgi_pass_header X-Mock-Pass;
            fastcgi_pass 127.0.0.1:@FCGI@;
        }

        location /errors/ {
            fastcgi_intercept_errors on;
            error_page 404 /fallback.txt;
            fastcgi_pass 127.0.0.1:@FCGI@;
        }

        # The error_page target is an explicit exact location: both sides run
        # the same internal redirect and serve the same fixture file.
        location = /fallback.txt {
            root @ROOT@;
        }

        location /uwsgi/ {
            uwsgi_pass 127.0.0.1:@UWSGI@;
            uwsgi_modifier1 0;
            uwsgi_modifier2 0;
            uwsgi_string "extra=1";
            uwsgi_hide_header X-Mock-Hide;
            uwsgi_pass_header X-Mock-Hide;
            uwsgi_intercept_errors on;
            error_page 404 /fallback.txt;
        }

        location /scgi/ {
            scgi_pass 127.0.0.1:@SCGI@;
            scgi_hide_header X-Mock-Hide;
            scgi_pass_header X-Mock-Hide;
        }

        location /mc/ {
            set $memcached_key $uri;
            memcached_pass 127.0.0.1:@MEMCACHED@;
        }

        location /mc-raw/ {
            set $memcached_key $uri;
            memcached_pass 127.0.0.1:@MEMCACHED@;
        }

        location /retry/ {
            fastcgi_pass fastcgi_mock;
            fastcgi_next_upstream error timeout;
            fastcgi_next_upstream_tries 2;
        }
    }
}
