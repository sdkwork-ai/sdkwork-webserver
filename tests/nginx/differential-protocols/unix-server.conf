# Wave 7A unix-socket transport listener (oracle side).
#
# Real nginx accepts `fastcgi_pass unix:` / `uwsgi_pass unix:` directly; the
# Rust data plane deliberately accepts unix targets only through the typed
# configuration plane (`[http] unixSocketRoot`), so the gateway side of these
# cases runs from a typed JSON configuration instead of this file.
server {
    listen 127.0.0.1:@UNIX_PORT@ default_server;
    server_name unix.example.com;
    root @ROOT@;

    location /unix-fcgi/ {
        fastcgi_pass unix:@FCGI_SOCKET@;
    }

    location /unix-uwsgi/ {
        uwsgi_pass unix:@UWSGI_SOCKET@;
    }
}
