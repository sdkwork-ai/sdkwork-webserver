daemon off;
master_process off;
error_log stderr notice;

# Mail residual differential fixture: `smtp_capabilities` / `imap_capabilities`
# / `pop3_capabilities` custom capability advertisement and mail `set_real_ip_from`
# trusted PROXY protocol peers. The pinned nginx 1.29.6 oracle is built with
# `--with-mail` but without `--with-mail_ssl_module`, so this fixture is
# deliberately plaintext-only (the TLS fixture lives in the parent directory).
#
# Placeholders:
#   @SMTP_DEFAULT@ / @SMTP_CUSTOM@       SMTP listeners (built-in / custom caps)
#   @IMAP_DEFAULT@ / @IMAP_CUSTOM@       IMAP listeners
#   @POP3_DEFAULT@ / @POP3_CUSTOM@       POP3 listeners
#   @SMTP_PROXY_TRUSTED@                 proxy_protocol + set_real_ip_from 127.0.0.1
#   @SMTP_PROXY_UNTRUSTED@               proxy_protocol, no trusted peer
#   @AUTH@                               mock auth_http service
#   @BACKEND@                            mock SMTP backend

events {
    worker_connections 128;
}

mail {
    auth_http 127.0.0.1:@AUTH@/auth;
    auth_http_timeout 5s;
    server_name mail.example.com;
    timeout 10s;

    # A mail-level trust entry that does not match loopback: a server-level
    # `set_real_ip_from` must replace it (nginx realip merge semantics).
    set_real_ip_from 10.0.0.0/8;

    server {
        listen 127.0.0.1:@SMTP_DEFAULT@;
        protocol smtp;
        smtp_greeting_delay 0;
    }

    server {
        listen 127.0.0.1:@SMTP_CUSTOM@;
        protocol smtp;
        smtp_greeting_delay 0;
        smtp_capabilities "SIZE 10485760" ENHANCEDSTATUSCODES 8BITMIME DSN;
    }

    server {
        listen 127.0.0.1:@IMAP_DEFAULT@;
        protocol imap;
    }

    server {
        listen 127.0.0.1:@IMAP_CUSTOM@;
        protocol imap;
        imap_capabilities IMAP4rev2 LITERAL+;
    }

    server {
        listen 127.0.0.1:@POP3_DEFAULT@;
        protocol pop3;
    }

    server {
        listen 127.0.0.1:@POP3_CUSTOM@;
        protocol pop3;
        pop3_capabilities TOP USER PIPELINING;
    }

    server {
        listen 127.0.0.1:@SMTP_PROXY_TRUSTED@ proxy_protocol;
        protocol smtp;
        smtp_greeting_delay 0;
        set_real_ip_from 127.0.0.1;
    }

    server {
        listen 127.0.0.1:@SMTP_PROXY_UNTRUSTED@ proxy_protocol;
        protocol smtp;
        smtp_greeting_delay 0;
    }
}
