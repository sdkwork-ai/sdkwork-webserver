daemon off;
master_process off;
error_log stderr notice;

# Mail client-certificate differential fixture (Wave 14B).
#
# One mail {} configuration is rendered twice with different listener/auth/
# backend ports: once for real nginx 1.29.6 built with `--with-mail
# --with-mail_ssl_module`, once for the Rust data plane (`serve-nginx`). The
# battery drives scripted SMTP/IMAP/POP3 clients (with and without a client
# certificate) and records the client-visible bytes plus every auth_http
# request header.
#
# Placeholders:
#   @AUTH@ @BACKEND@            mock auth_http service / mock SMTP backend
#   @SMTP_ON@                   implicit TLS, ssl_verify_client on, CA bundle, pass cert
#   @SMTP_ON_PASS_OFF@          same without auth_http_pass_client_cert
#   @SMTP_TRUSTED_ONLY@         ssl_trusted_certificate-only verification store
#   @SMTP_OPTIONAL@             ssl_verify_client optional
#   @SMTP_NO_CA@                ssl_verify_client optional_no_ca, no bundle
#   @SMTP_DEPTH0@ @SMTP_DEPTH1@ @SMTP_DEPTH2@  ssl_verify_depth matrix
#   @SMTP_TRUSTED_INTERMEDIATE@ ssl_trusted_certificate supplies the intermediate
#   @SMTP_STARTTLS@             STARTTLS frontend with client verification
#   @SMTP_VERIFY_OFF@           implicit TLS with ssl_verify_client off
#   @IMAP_ON@ @POP3_ON@         protocol-specific rejection lines
#   @SERVER_CERT@ @SERVER_KEY@  frontend certificate
#   @CA@ @INTERMEDIATE_CA@     client verification bundles

events {
    worker_connections 128;
}

mail {
    auth_http 127.0.0.1:@AUTH@/auth;
    auth_http_timeout 5s;
    server_name mail.example.com;
    timeout 10s;

    server {
        listen 127.0.0.1:@SMTP_ON@ ssl;
        protocol smtp;
        smtp_greeting_delay 0;
        ssl_certificate @SERVER_CERT@;
        ssl_certificate_key @SERVER_KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_client_certificate @CA@;
        ssl_verify_client on;
        ssl_verify_depth 1;
        auth_http_pass_client_cert on;
    }

    server {
        listen 127.0.0.1:@SMTP_ON_PASS_OFF@ ssl;
        protocol smtp;
        smtp_greeting_delay 0;
        ssl_certificate @SERVER_CERT@;
        ssl_certificate_key @SERVER_KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_client_certificate @CA@;
        ssl_verify_client on;
    }

    server {
        listen 127.0.0.1:@SMTP_TRUSTED_ONLY@ ssl;
        protocol smtp;
        smtp_greeting_delay 0;
        ssl_certificate @SERVER_CERT@;
        ssl_certificate_key @SERVER_KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_trusted_certificate @CA@;
        ssl_verify_client on;
        auth_http_pass_client_cert on;
    }

    server {
        listen 127.0.0.1:@SMTP_OPTIONAL@ ssl;
        protocol smtp;
        smtp_greeting_delay 0;
        ssl_certificate @SERVER_CERT@;
        ssl_certificate_key @SERVER_KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_client_certificate @CA@;
        ssl_verify_client optional;
        auth_http_pass_client_cert on;
    }

    server {
        listen 127.0.0.1:@SMTP_NO_CA@ ssl;
        protocol smtp;
        smtp_greeting_delay 0;
        ssl_certificate @SERVER_CERT@;
        ssl_certificate_key @SERVER_KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_verify_client optional_no_ca;
        auth_http_pass_client_cert on;
    }

    server {
        listen 127.0.0.1:@SMTP_DEPTH0@ ssl;
        protocol smtp;
        smtp_greeting_delay 0;
        ssl_certificate @SERVER_CERT@;
        ssl_certificate_key @SERVER_KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_client_certificate @CA@;
        ssl_verify_client on;
        ssl_verify_depth 0;
        auth_http_pass_client_cert on;
    }

    server {
        listen 127.0.0.1:@SMTP_DEPTH1@ ssl;
        protocol smtp;
        smtp_greeting_delay 0;
        ssl_certificate @SERVER_CERT@;
        ssl_certificate_key @SERVER_KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_client_certificate @CA@;
        ssl_verify_client on;
        ssl_verify_depth 1;
        auth_http_pass_client_cert on;
    }

    server {
        listen 127.0.0.1:@SMTP_DEPTH2@ ssl;
        protocol smtp;
        smtp_greeting_delay 0;
        ssl_certificate @SERVER_CERT@;
        ssl_certificate_key @SERVER_KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_client_certificate @CA@;
        ssl_verify_client on;
        ssl_verify_depth 2;
        auth_http_pass_client_cert on;
    }

    server {
        listen 127.0.0.1:@SMTP_TRUSTED_INTERMEDIATE@ ssl;
        protocol smtp;
        smtp_greeting_delay 0;
        ssl_certificate @SERVER_CERT@;
        ssl_certificate_key @SERVER_KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_client_certificate @CA@;
        ssl_trusted_certificate @INTERMEDIATE_CA@;
        ssl_verify_client on;
        ssl_verify_depth 1;
        auth_http_pass_client_cert on;
    }

    server {
        listen 127.0.0.1:@SMTP_STARTTLS@;
        protocol smtp;
        smtp_greeting_delay 0;
        starttls on;
        ssl_certificate @SERVER_CERT@;
        ssl_certificate_key @SERVER_KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_client_certificate @CA@;
        ssl_verify_client on;
        auth_http_pass_client_cert on;
    }

    server {
        listen 127.0.0.1:@SMTP_VERIFY_OFF@ ssl;
        protocol smtp;
        smtp_greeting_delay 0;
        ssl_certificate @SERVER_CERT@;
        ssl_certificate_key @SERVER_KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        auth_http_pass_client_cert on;
    }

    server {
        listen 127.0.0.1:@IMAP_ON@ ssl;
        protocol imap;
        ssl_certificate @SERVER_CERT@;
        ssl_certificate_key @SERVER_KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_client_certificate @CA@;
        ssl_verify_client on;
    }

    server {
        listen 127.0.0.1:@POP3_ON@ ssl;
        protocol pop3;
        ssl_certificate @SERVER_CERT@;
        ssl_certificate_key @SERVER_KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_client_certificate @CA@;
        ssl_verify_client on;
    }
}
