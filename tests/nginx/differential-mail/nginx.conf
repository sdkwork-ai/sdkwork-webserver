daemon off;
master_process off;
error_log stderr notice;

# Differential mail fixture (Wave 9B): one configuration is rendered twice with
# different proxy/auth/backend ports, served by real nginx 1.29.6 (`mail {}`,
# built --with-mail --with-mail_ssl_module) and by the Rust data plane
# (`serve-nginx`). `battery.py` drives scripted POP3/IMAP/SMTP clients against
# both and records the client-visible bytes, the backend lines and the
# auth_http requests.
#
# Placeholders:
#   @AUTH@              mock auth_http service port
#   @POP3@ @IMAP@ @SMTP@ proxy listener ports (plaintext)
#   @SMTP_TLS@          SMTP listener with implicit TLS
#   @SMTP_STARTTLS@     SMTP listener with STARTTLS
#   @CERT@ @KEY@        shared self-signed fixture certificate/key

events {
    worker_connections 128;
}

mail {
    auth_http 127.0.0.1:@AUTH@/auth;
    auth_http_timeout 5s;
    auth_http_header X-Tenant acme;
    server_name mail.example.com;
    timeout 30s;

    server {
        listen 127.0.0.1:@POP3@;
        protocol pop3;
    }

    server {
        listen 127.0.0.1:@IMAP@;
        protocol imap;
    }

    server {
        listen 127.0.0.1:@SMTP@;
        protocol smtp;
        smtp_greeting_delay 0;
    }

    server {
        listen 127.0.0.1:@SMTP_TLS@ ssl;
        protocol smtp;
        ssl_certificate @CERT@;
        ssl_certificate_key @KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
    }

    server {
        listen 127.0.0.1:@SMTP_STARTTLS@;
        protocol smtp;
        starttls on;
        ssl_certificate @CERT@;
        ssl_certificate_key @KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
    }
}
