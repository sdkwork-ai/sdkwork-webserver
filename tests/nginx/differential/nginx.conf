daemon off;
master_process off;
error_log stderr notice;

# Differential fixture: the same file is served by real nginx (in WSL, TZ=UTC)
# and by the Rust data plane, so the two response sets can be diffed byte
# header by header. `@PUBLIC@` is rendered per side but resolves to the same
# physical document, which keeps Last-Modified identical on both.
#
# `@PORT@` differs per side: WSL localhost forwarding can route a Windows
# connection into real nginx, so the two endpoints must never share a port.

events {
    worker_connections 128;
}

http {
    access_log off;

    server {
        listen 127.0.0.1:@PORT@;
        server_name diff.example.com;

        # default policy: etag on, if_modified_since exact
        location /cond/ {
            alias @PUBLIC@/;
        }

        location /noetag/ {
            etag off;
            alias @PUBLIC@/;
        }

        location /ims-off/ {
            if_modified_since off;
            alias @PUBLIC@/;
        }

        location /ims-before/ {
            if_modified_since before;
            alias @PUBLIC@/;
        }

        location /exp-off/ {
            expires off;
            alias @PUBLIC@/;
        }

        location /exp-1h/ {
            expires 1h;
            alias @PUBLIC@/;
        }

        location /exp-max/ {
            expires max;
            alias @PUBLIC@/;
        }

        location /exp-epoch/ {
            expires epoch;
            alias @PUBLIC@/;
        }

        location /exp-neg/ {
            expires -1h;
            alias @PUBLIC@/;
        }

        location /exp-daily/ {
            expires @0;
            alias @PUBLIC@/;
        }

        location /exp-mod/ {
            expires modified 1h;
            alias @PUBLIC@/;
        }

        location /exp-zero/ {
            expires 0;
            alias @PUBLIC@/;
        }
    }
}
