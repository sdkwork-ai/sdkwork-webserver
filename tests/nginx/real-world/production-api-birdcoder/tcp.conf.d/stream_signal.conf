# tcp
stream {
  # tcp负载均衡
  upstream wukongimtcp { 
    server 172.21.0.14:5100 max_fails=3 weight=20;
    server 172.21.0.8:5100 max_fails=3 weight=10;
    server 172.21.0.10:5100 max_fails=3 weight=5;
  }
  server {
    listen 15100;
    proxy_connect_timeout 4s;
    proxy_timeout 120s;
    proxy_pass wukongimtcp;
  }
}