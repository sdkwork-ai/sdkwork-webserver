# sdkwork-api-cloud-gateway public edge (additive file; existing sites untouched).
# Default API domain: api.birdcoder.com. Additional allow-listed API domains are
# served by the same server blocks so one deployment answers every registered
# production host family.
upstream sdkwork_api_gateway {
    server 127.0.0.1:3913;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.birdcoder.com api.birdcoder.cn api.dtupay.com api.dtupay.cn
                api.skubc.com api.skubc.cn api.zowalk.com api.zowalk.cn
                api.offer86.com api.offer86.cn api.86offer.com api.86offer.cn
                api.sdkwork.cn api.noaper.cn;

    access_log /var/log/nginx/sdkwork-api-gateway.access.log;
    error_log  /var/log/nginx/sdkwork-api-gateway.error.log;
    client_max_body_size 100m;

    # ACME HTTP-01 webroot (self-contained; lets certbot issue the trusted
    # certificate for these names once their DNS A record points here).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        access_log off;
    }

    location / {
        proxy_pass http://sdkwork_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.birdcoder.com api.birdcoder.cn api.dtupay.com api.dtupay.cn
                api.skubc.com api.skubc.cn api.zowalk.com api.zowalk.cn
                api.offer86.com api.offer86.cn api.86offer.com api.86offer.cn
                api.sdkwork.cn api.noaper.cn;

    access_log /var/log/nginx/sdkwork-api-gateway.access.log;
    error_log  /var/log/nginx/sdkwork-api-gateway.error.log;
    client_max_body_size 100m;

    # Self-signed SAN certificate until DNS points at this host; replace the two
    # files below with the CA-issued certificate for the served names.
    ssl_certificate     /opt/certs/selfsigned/sdkwork-api-gateway/fullchain.pem;
    ssl_certificate_key /opt/certs/selfsigned/sdkwork-api-gateway/privkey.pem;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://sdkwork_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
