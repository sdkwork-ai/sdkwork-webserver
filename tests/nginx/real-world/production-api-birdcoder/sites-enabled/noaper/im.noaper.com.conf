

server {
    listen       443 ssl;
    server_name  im-dev.noaper.com  im-dev1.noaper.com im-dev2.noaper.com im-dev3.noaper.com; 
    ssl_certificate /opt/certs/letsencrypt/live/noaper.com/fullchain.pem;
    ssl_certificate_key /opt/certs/letsencrypt/live/noaper.com/privkey.pem; 
    ssl_session_timeout 5m;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
    ssl_prefer_server_ciphers on;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 2;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png application/wasm;
    gzip_vary off;
    gzip_disable "MSIE [1-6].";

    default_type application/wasm; 
    set $env prod;
    # 匹配不同的域名格式
    if ($host ~* "^([a-zA-Z0-9_-]+)-(dev|test|beta|pre|prod)([0-9]*).([a-zA-Z0-9.-]+)$") {
        set $env $2;  # 提取 dev/test/beta
        set $domain $4;  # 提取 noaper.com 或其他动态域名部分
    } 
    set $openim_web_servers "openim_pc_web_$env";
    # 检查主机名是否以 imadmin 开头
    if ($host ~* "^imadmin.*..*") {
        set $openim_web_servers "openim_admin_$env";
    }     
    # 处理 .txt 文件请求
    location ~ ^/([a-zA-Z0-9_-]+).txt$ {
        # 提取文件名和主机名
        set $filename $1.txt;        # 从请求的 URL 提取文件名（例如 testxxxx）
        set $host_name $host;     # 获取请求的主机名（例如 mp.noaper.com）
 
        # 构建请求的完整 URL
        set $proxy_url http://api_servers_$env/dns_verify_record/verify?filename=$filename&host=$host_name;

        # 转发到对应的后端服务器池，并传递文件名和主机名作为查询参数
        proxy_pass $proxy_url;

        # 传递请求头信息给后端服务
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 设置超时时间
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }  
      
    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_next_upstream off; 

        # 使用动态选择的 upstream 进行代理
        proxy_pass http://$openim_web_servers;
    }

    location /msg_gateway{
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://openim_msg_gateway_dev/;
    }

    location ^~/api/{
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Api $scheme://$host/api;
        proxy_pass http://openim_im_api_dev/;
    }

    location ^~/chat/{
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://openim_im_chat_api_dev/;
    }

    location ^~/im-minio-api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
        proxy_pass http://openim_minio_s3_2_dev/;
    }
     location ^~/complete_admin/{
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-real-ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://openim_im_admin_api_dev/;
    }    
}  
 

