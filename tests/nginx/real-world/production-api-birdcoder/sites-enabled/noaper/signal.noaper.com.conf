
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
} 
server {
       listen       443 ssl;
       server_name  signal.noaper.com ~^(signal[a-zA-Z0-9_-]+).noaper.com$;
       ssl_certificate /opt/certs/letsencrypt/live/noaper.com/fullchain.pem;
       ssl_certificate_key /opt/certs/letsencrypt/live/noaper.com/privkey.pem;
       ssl_session_timeout 5m;
       ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
       ssl_ciphers ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+SSLv2:+EXP;
       ssl_prefer_server_ciphers on;
       
       
        keepalive_timeout 1000;
        proxy_connect_timeout 1000;
        proxy_read_timeout 1000;
        proxy_send_timeout 1000;
        gzip on;
        gzip_min_length 1k;
        gzip_buffers 4 16k;
        gzip_comp_level 2;
        gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png application/wasm;
        gzip_vary off;
        gzip_disable "MSIE [1-6].";
        error_page 405 =200 $uri;

        default_type application/wasm;

        set $env prod;
       # 匹配不同的域名格式
       if ($host ~* "^([a-zA-Z0-9_-]+)-(dev|test|beta|pre|prod)([0-9]*).([a-zA-Z0-9.-]+)$") {
        set $env $2;  # 提取 dev/test/beta
        set $domain $4;  # 提取 noaper.com 或其他动态域名部分
       }
        # 处理 .txt 文件请求
        location ~ ^/([a-zA-Z0-9_-]+).txt$ {
          # 提取文件名和主机名
          set $filename $1.txt;        # 从请求的 URL 提取文件名（例如 testxxxx）
          set $host_name $host;     # 获取请求的主机名（例如 mp.noaper.com）
 
          # 构建请求的完整 URL
          set $proxy_url http://api_servers_${env}/dns_verify_record/verify?filename=$filename&host=$host_name;

          # 转发到对应的后端服务器池，并传递文件名和主机名作为查询参数
          proxy_pass $proxy_url;

          # 传递请求头信息给后端服务
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          # 设置超时时间
          proxy_connect_timeout 10s;
          proxy_send_timeout 10s;
          proxy_read_timeout 10s;
        }   
        location ^~/api/ { #api port:5001
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header X-real-ip $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_pass http://signal_api_servers_prod/;
        }
        location /wk_ws { # webservice port:5200
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header X-real-ip $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_pass http://signal_ws_servers_${env}/;
        }
        location /msg_gateway { # webservice port:5200
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header X-real-ip $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_pass http://signal_ws_servers_${env}/;
        }
        location /chatdemo/{ #demo port:5172
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header X-real-ip $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_pass http://signal_demo_${env}/chatdemo/;
        }
        location /monitor{ #monitor port:5300
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "Upgrade";
                proxy_set_header X-real-ip $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_pass http://signal_monitor_servers_${env}/;
        }

        location ~ /.well-known {
                allow all;
        }

}
server {
       listen       80;
       server_name  signal.noaper.com ~^(signal[a-zA-Z0-9_-]+).noaper.com$; 
       rewrite ^(.*)$ https://${server_name}$1 permanent;
}
