daemon off;
master_process off;
error_log stderr notice;

# Differential stream fixture: one configuration is rendered twice, with a
# different listener-port base, and served by real nginx (the oracle) and by the
# Rust data plane (`serve-nginx`). `battery.py` drives the same connection
# scripts against both sides and records the observable byte-level outcomes.
#
# Placeholders:
#   @PORT0@ .. @PORT7@  the eight stream listener ports of the side measured
#   @PORT8@ .. @PORT11@ Wave 7E: inbound PROXY, upstream TLS (verified and
#                       untrusted), and proxy_half_close listeners
#   @UPSTREAM@          port the battery's deterministic TCP echo upstream binds
#   @UPSTREAM_TLS@      port the battery's TLS echo upstream binds
#   @UPSTREAM_TLS2@     second TLS echo for the untrusted-CA listener
#   @UPSTREAM_HC@       port the battery's half-close echo upstream binds
#   @TLS_CA@ / @OTHER_CA@  verified / unrelated CA bundles for proxy_ssl
#
# Listener map (the nginx module semantics under test):
#   PORT0  echo proxy behind `allow 127.0.0.1; deny all;`
#   PORT1  echo proxy behind `deny 127.0.0.1; allow all;` (order matters)
#   PORT2  `return 403;` (no upstream)
#   PORT3  `limit_conn addr 1;`
#   PORT4  `limit_conn addr 1; limit_conn_dry_run on;`
#   PORT5  `set $tag "tagged"; return $tag;`   (bounded stream variable engine)
#   PORT6  `map $remote_addr $who { … }` + `return $who;`
#   PORT7  `ssl_preread on;` + `map $ssl_preread_server_name …` + `return $backend;`

events {
    worker_connections 64;
}

stream {
    # The stream module owns a separate limit_conn zone table from HTTP.
    limit_conn_zone $binary_remote_addr zone=addr:1m;

    # Bounded stream variable engine: the plane evaluates these against the
    # facts known at accept/preread time.
    map $remote_addr $who {
        default "other";
        127.0.0.1 "loopback";
    }

    map $ssl_preread_server_name $backend {
        default "none";
        a.example "backend-a";
    }

    server {
        listen 127.0.0.1:@PORT0@;
        allow 127.0.0.1;
        deny all;
        proxy_pass 127.0.0.1:@UPSTREAM@;
    }

    server {
        listen 127.0.0.1:@PORT1@;
        deny 127.0.0.1;
        allow all;
        proxy_pass 127.0.0.1:@UPSTREAM@;
    }

    server {
        listen 127.0.0.1:@PORT2@;
        return 403;
    }

    server {
        listen 127.0.0.1:@PORT3@;
        limit_conn addr 1;
        proxy_pass 127.0.0.1:@UPSTREAM@;
    }

    server {
        listen 127.0.0.1:@PORT4@;
        limit_conn_dry_run on;
        limit_conn addr 1;
        proxy_pass 127.0.0.1:@UPSTREAM@;
    }

    server {
        listen 127.0.0.1:@PORT5@;
        set $tag "tagged";
        return $tag;
    }

    server {
        listen 127.0.0.1:@PORT6@;
        return $who;
    }

    server {
        listen 127.0.0.1:@PORT7@;
        ssl_preread on;
        return $backend;
    }

    # Wave 7E: inbound PROXY protocol (v1/v2) on the listener.
    server {
        listen 127.0.0.1:@PORT8@ proxy_protocol;
        proxy_protocol_timeout 3s;
        proxy_pass 127.0.0.1:@UPSTREAM@;
    }

    # Wave 7E: upstream TLS client with verified CA and the name override.
    server {
        listen 127.0.0.1:@PORT9@;
        proxy_pass 127.0.0.1:@UPSTREAM_TLS@;
        proxy_ssl on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate @TLS_CA@;
        proxy_ssl_server_name on;
        proxy_ssl_name tls-stream.test;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Wave 7E: upstream TLS client whose CA bundle does not sign the target.
    server {
        listen 127.0.0.1:@PORT10@;
        # A distinct upstream port keeps nginx's upstream TLS session cache from
        # reusing the verified listener's session (session reuse is on by
        # default and would skip verification on the resumed connection).
        proxy_pass 127.0.0.1:@UPSTREAM_TLS2@;
        proxy_ssl on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate @OTHER_CA@;
        proxy_ssl_server_name on;
        proxy_ssl_name tls-stream.test;
    }

    # Wave 7E: relay half-close semantics.
    server {
        listen 127.0.0.1:@PORT11@;
        proxy_pass 127.0.0.1:@UPSTREAM_HC@;
        proxy_half_close on;
    }
}
