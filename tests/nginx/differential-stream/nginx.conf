daemon off;
master_process off;
error_log stderr notice;

# Differential stream fixture: one configuration is rendered twice, with a
# different listener-port base, and served by real nginx (the oracle) and by the
# Rust data plane (`serve-nginx`). `battery.py` drives the same connection
# scripts against both sides and records the observable byte-level outcomes.
#
# Placeholders:
#   @PORT0@ .. @PORT7@  the eight stream listener ports of the side measured
#   @UPSTREAM@          port the battery's deterministic TCP echo upstream binds
#
# Listener map (the nginx module semantics under test):
#   PORT0  echo proxy behind `allow 127.0.0.1; deny all;`
#   PORT1  echo proxy behind `deny 127.0.0.1; allow all;` (order matters)
#   PORT2  `return 403;` (no upstream)
#   PORT3  `limit_conn addr 1;`
#   PORT4  `limit_conn addr 1; limit_conn_dry_run on;`
#   PORT5  `set $tag "tagged"; return $tag;`   (bounded stream variable engine)
#   PORT6  `map $remote_addr $who { … }` + `return $who;`
#   PORT7  `ssl_preread on;` + `map $ssl_preread_server_name …` + `return $backend;`

events {
    worker_connections 64;
}

stream {
    # The stream module owns a separate limit_conn zone table from HTTP.
    limit_conn_zone $binary_remote_addr zone=addr:1m;

    # Bounded stream variable engine: the plane evaluates these against the
    # facts known at accept/preread time.
    map $remote_addr $who {
        default "other";
        127.0.0.1 "loopback";
    }

    map $ssl_preread_server_name $backend {
        default "none";
        a.example "backend-a";
    }

    server {
        listen 127.0.0.1:@PORT0@;
        allow 127.0.0.1;
        deny all;
        proxy_pass 127.0.0.1:@UPSTREAM@;
    }

    server {
        listen 127.0.0.1:@PORT1@;
        deny 127.0.0.1;
        allow all;
        proxy_pass 127.0.0.1:@UPSTREAM@;
    }

    server {
        listen 127.0.0.1:@PORT2@;
        return 403;
    }

    server {
        listen 127.0.0.1:@PORT3@;
        limit_conn addr 1;
        proxy_pass 127.0.0.1:@UPSTREAM@;
    }

    server {
        listen 127.0.0.1:@PORT4@;
        limit_conn_dry_run on;
        limit_conn addr 1;
        proxy_pass 127.0.0.1:@UPSTREAM@;
    }

    server {
        listen 127.0.0.1:@PORT5@;
        set $tag "tagged";
        return $tag;
    }

    server {
        listen 127.0.0.1:@PORT6@;
        return $who;
    }

    server {
        listen 127.0.0.1:@PORT7@;
        ssl_preread on;
        return $backend;
    }
}
