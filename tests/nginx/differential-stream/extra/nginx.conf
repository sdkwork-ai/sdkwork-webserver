daemon off;
master_process off;
error_log stderr notice;

# Stream residual differential fixture: `split_clients` bucket assignment and
# `pass` re-dispatch. Unlike the main stream fixture this file uses only
# directives compiled into the pinned nginx 1.29.6 oracle (no `ssl_preread`),
# so the baseline can be captured from the oracle itself rather than relying on
# a historical capture.
#
# Placeholders:
#   @SPLIT@               port bound on 127.0.0.1 .. 127.0.0.6
#   @PASS_TARGET@         server that answers `return "via-pass"`
#   @PASS@                server that `pass`es to @PASS_TARGET@
#   @PASS_PROXY_TARGET@   server that proxies to the battery's echo upstream
#   @PASS_PROXY@          server that `pass`es to @PASS_PROXY_TARGET@
#   @UPSTREAM@            the battery's echo upstream port
#
# `$server_addr` is used as the split source so the bucket assignment is
# reproducible across the oracle and the runtime: the loopback alias is the
# same on both sides, while every listener port differs between the two.

events {
    worker_connections 64;
}

stream {
    split_clients "$server_addr" $by_addr {
        20% "b1";
        20% "b2";
        20% "b3";
        20% "b4";
        20% "b5";
        * "rest";
    }

    split_clients "$remote_addr-$server_addr" $by_pair {
        20% "p1";
        20% "p2";
        20% "p3";
        20% "p4";
        20% "p5";
        * "prest";
    }

    split_clients "$remote_addr" $by_remote {
        50% "left";
        * "right";
    }

    server {
        listen 127.0.0.1:@SPLIT@;
        set $chosen "$by_addr/$by_pair/$by_remote";
        return $chosen;
    }

    server {
        listen 127.0.0.2:@SPLIT@;
        set $chosen "$by_addr/$by_pair/$by_remote";
        return $chosen;
    }

    server {
        listen 127.0.0.3:@SPLIT@;
        set $chosen "$by_addr/$by_pair/$by_remote";
        return $chosen;
    }

    server {
        listen 127.0.0.4:@SPLIT@;
        set $chosen "$by_addr/$by_pair/$by_remote";
        return $chosen;
    }

    server {
        listen 127.0.0.5:@SPLIT@;
        set $chosen "$by_addr/$by_pair/$by_remote";
        return $chosen;
    }

    server {
        listen 127.0.0.6:@SPLIT@;
        set $chosen "$by_addr/$by_pair/$by_remote";
        return $chosen;
    }

    server {
        listen 127.0.0.1:@PASS_TARGET@;
        return "via-pass";
    }

    server {
        listen 127.0.0.1:@PASS@;
        pass 127.0.0.1:@PASS_TARGET@;
    }

    server {
        listen 127.0.0.1:@PASS_PROXY_TARGET@;
        proxy_pass 127.0.0.1:@UPSTREAM@;
    }

    server {
        listen 127.0.0.1:@PASS_PROXY@;
        pass 127.0.0.1:@PASS_PROXY_TARGET@;
    }
}
