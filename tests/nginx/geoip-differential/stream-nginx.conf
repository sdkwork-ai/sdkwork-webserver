worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events {
    worker_connections 64;
}
stream {
    # Oracle side of the stream GeoIP variable-plumbing differential. The
    # pinned nginx 1.29.6 build has no --with-stream_geoip_module, so the
    # module's variables are fixed with `set`; the gateway side performs the
    # real accept-time MMDB lookup. This proves the stream variable plumbing
    # (`map` source and `return` template), not a GeoIP lookup differential.
    map $geoip_country_code $geoip_zone {
        US "zone-us";
        default "zone-other";
    }

    server {
        listen 127.0.0.1:@STREAM_PORT@;
        set $geoip_country_code "US";
        set $geoip_country_code3 "USA";
        set $geoip_country_name "United States";
        set $geoip_city_country_code "US";
        set $geoip_city_country_code3 "USA";
        set $geoip_city_country_name "United States";
        set $geoip_region "CA";
        set $geoip_region_name "California";
        set $geoip_city "Testville";
        set $geoip_postal_code "90210";
        set $geoip_city_continent_code "NA";
        set $geoip_latitude "34.0522";
        set $geoip_longitude "-118.2437";
        set $geoip_org "Example Org";
        set $geoip_dma_code "807";
        set $geoip_area_code "";
        return "$geoip_country_code|$geoip_country_code3|$geoip_country_name|$geoip_city_country_code|$geoip_city_country_code3|$geoip_city_country_name|$geoip_region|$geoip_region_name|$geoip_city|$geoip_postal_code|$geoip_city_continent_code|$geoip_latitude|$geoip_longitude|$geoip_org|$geoip_dma_code|$geoip_area_code|$geoip_zone";
    }
}
