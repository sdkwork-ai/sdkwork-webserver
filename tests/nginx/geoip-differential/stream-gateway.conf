worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events {
    worker_connections 64;
}
stream {
    # Gateway side: the GeoIP databases are resolved at accept time from the
    # loopback peer address (the fixture records 127.0.0.1/32 as the US test
    # record). @COUNTRY_DB@, @CITY_DB@ and @ORG_DB@ are rendered to absolute
    # paths.
    geoip_country @COUNTRY_DB@;
    geoip_city @CITY_DB@;
    geoip_org @ORG_DB@;

    map $geoip_country_code $geoip_zone {
        US "zone-us";
        default "zone-other";
    }

    server {
        listen 127.0.0.1:@STREAM_PORT@;
        return "$geoip_country_code|$geoip_country_code3|$geoip_country_name|$geoip_city_country_code|$geoip_city_country_code3|$geoip_city_country_name|$geoip_region|$geoip_region_name|$geoip_city|$geoip_postal_code|$geoip_city_continent_code|$geoip_latitude|$geoip_longitude|$geoip_org|$geoip_dma_code|$geoip_area_code|$geoip_zone";
    }
}
