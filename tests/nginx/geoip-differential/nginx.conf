worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events {
    worker_connections 64;
}
http {
    access_log off;
    default_type text/plain;

    # The real nginx 1.29.6 oracle is NOT built with
    # --with-http_geoip_module, so the module's variables cannot be produced by
    # the oracle. This slice fixes them with `set` and asserts that nginx's
    # variable expansion (return bodies, map results, add_header) produces the
    # same bytes as the gateway's real MMDB lookup. It is a variable-plumbing
    # proxy differential, not a GeoIP-lookup differential.
    map $geoip_country_code $geoip_zone {
        US "zone-us";
        DE "zone-de";
        default "zone-other";
    }

    server {
        listen 127.0.0.1:@PORT@;
        server_name geoip.example.com;

        location = /us {
            set $geoip_country_code "US";
            set $geoip_country_code3 "USA";
            set $geoip_country_name "United States";
            set $geoip_city_country_code "US";
            set $geoip_city_country_code3 "USA";
            set $geoip_city_country_name "United States";
            set $geoip_region "CA";
            set $geoip_region_name "California";
            set $geoip_city "Testville";
            set $geoip_postal_code "90210";
            set $geoip_city_continent_code "NA";
            set $geoip_latitude "34.0522";
            set $geoip_longitude "-118.2437";
            set $geoip_org "Example Org";
            set $geoip_dma_code "807";
            set $geoip_area_code "";
            add_header X-Geoip-Country $geoip_country_code always;
            add_header X-Geoip-Zone $geoip_zone always;
            return 200 "$geoip_country_code|$geoip_country_code3|$geoip_country_name|$geoip_city_country_code|$geoip_city_country_code3|$geoip_city_country_name|$geoip_region|$geoip_region_name|$geoip_city|$geoip_postal_code|$geoip_city_continent_code|$geoip_latitude|$geoip_longitude|$geoip_org|$geoip_dma_code|$geoip_area_code|$geoip_zone";
        }

        location = /de {
            set $geoip_country_code "DE";
            set $geoip_country_code3 "DEU";
            set $geoip_country_name "Germany";
            set $geoip_city_country_code "DE";
            set $geoip_city_country_code3 "DEU";
            set $geoip_city_country_name "Germany";
            set $geoip_region "BE";
            set $geoip_region_name "Berlin";
            set $geoip_city "Testburg";
            set $geoip_postal_code "10115";
            set $geoip_city_continent_code "EU";
            set $geoip_latitude "52.5200";
            set $geoip_longitude "13.4050";
            set $geoip_org "Beispiel GmbH";
            set $geoip_dma_code "0";
            set $geoip_area_code "";
            add_header X-Geoip-Country $geoip_country_code always;
            add_header X-Geoip-Zone $geoip_zone always;
            return 200 "$geoip_country_code|$geoip_country_code3|$geoip_country_name|$geoip_city_country_code|$geoip_city_country_code3|$geoip_city_country_name|$geoip_region|$geoip_region_name|$geoip_city|$geoip_postal_code|$geoip_city_continent_code|$geoip_latitude|$geoip_longitude|$geoip_org|$geoip_dma_code|$geoip_area_code|$geoip_zone";
        }

        location = /empty {
            set $geoip_country_code "";
            set $geoip_country_code3 "";
            set $geoip_country_name "";
            set $geoip_city_country_code "";
            set $geoip_city_country_code3 "";
            set $geoip_city_country_name "";
            set $geoip_region "";
            set $geoip_region_name "";
            set $geoip_city "";
            set $geoip_postal_code "";
            set $geoip_city_continent_code "";
            set $geoip_latitude "";
            set $geoip_longitude "";
            set $geoip_org "";
            set $geoip_dma_code "";
            set $geoip_area_code "";
            add_header X-Geoip-Country $geoip_country_code always;
            add_header X-Geoip-Zone $geoip_zone always;
            return 200 "$geoip_country_code|$geoip_country_code3|$geoip_country_name|$geoip_city_country_code|$geoip_city_country_code3|$geoip_city_country_name|$geoip_region|$geoip_region_name|$geoip_city|$geoip_postal_code|$geoip_city_continent_code|$geoip_latitude|$geoip_longitude|$geoip_org|$geoip_dma_code|$geoip_area_code|$geoip_zone";
        }
    }
}
