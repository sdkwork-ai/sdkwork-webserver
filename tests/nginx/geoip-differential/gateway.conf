worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events {
    worker_connections 64;
}
http {
    access_log off;
    default_type text/plain;

    # Gateway side of the GeoIP variable-plumbing differential. The databases
    # are synthetic MMDB fixtures under tests/nginx/geoip; @COUNTRY_DB@,
    # @CITY_DB@ and @ORG_DB@ are rendered to their absolute paths.
    #
    # `geoip_proxy 127.0.0.1` makes the loopback battery client a trusted hop,
    # so the X-Forwarded-For address the battery sends is the lookup address.
    # `geoip_proxy_recursive on` keeps walking through trusted hops.
    geoip_country @COUNTRY_DB@;
    geoip_city @CITY_DB@;
    geoip_org @ORG_DB@;
    geoip_proxy 127.0.0.1;
    geoip_proxy_recursive on;

    map $geoip_country_code $geoip_zone {
        US "zone-us";
        DE "zone-de";
        default "zone-other";
    }

    server {
        listen 127.0.0.1:@PORT@;
        server_name geoip.example.com;

        location = /us {
            add_header X-Geoip-Country $geoip_country_code always;
            add_header X-Geoip-Zone $geoip_zone always;
            return 200 "$geoip_country_code|$geoip_country_code3|$geoip_country_name|$geoip_city_country_code|$geoip_city_country_code3|$geoip_city_country_name|$geoip_region|$geoip_region_name|$geoip_city|$geoip_postal_code|$geoip_city_continent_code|$geoip_latitude|$geoip_longitude|$geoip_org|$geoip_dma_code|$geoip_area_code|$geoip_zone";
        }

        location = /de {
            add_header X-Geoip-Country $geoip_country_code always;
            add_header X-Geoip-Zone $geoip_zone always;
            return 200 "$geoip_country_code|$geoip_country_code3|$geoip_country_name|$geoip_city_country_code|$geoip_city_country_code3|$geoip_city_country_name|$geoip_region|$geoip_region_name|$geoip_city|$geoip_postal_code|$geoip_city_continent_code|$geoip_latitude|$geoip_longitude|$geoip_org|$geoip_dma_code|$geoip_area_code|$geoip_zone";
        }

        location = /empty {
            add_header X-Geoip-Country $geoip_country_code always;
            add_header X-Geoip-Zone $geoip_zone always;
            return 200 "$geoip_country_code|$geoip_country_code3|$geoip_country_name|$geoip_city_country_code|$geoip_city_country_code3|$geoip_city_country_name|$geoip_region|$geoip_region_name|$geoip_city|$geoip_postal_code|$geoip_city_continent_code|$geoip_latitude|$geoip_longitude|$geoip_org|$geoip_dma_code|$geoip_area_code|$geoip_zone";
        }
    }
}
