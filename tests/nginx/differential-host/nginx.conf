daemon off;
master_process off;
error_log stderr notice;

# Differential host-selection fixture (PRD-nginx-compatibility §5/§6).
#
# The same file is executed by real nginx 1.29.6 and by the Rust data plane
# (`serve-nginx`); battery.py records only status and body per Host authority,
# so a difference is a virtual-host selection difference and not header
# formatting. `@PUBLIC@`, `@PORT@`, and `@MOCK@` are rendered per side but
# resolve to the same document root and mock upstream, keeping both runs
# comparable.
#
# `@PORT@` differs per side so a leaked listener can never make one endpoint
# answer for the other.
#
# Every expectation recorded in nginx-oracle.json was produced by this file
# running on the real binary; the Rust side is compared against it.

events {
    worker_connections 128;
}

http {
    access_log off;
    server_names_hash_bucket_size 128;

    # The first server on the address is the listener default server; the
    # explicit `default_server` flag makes that independent of declaration
    # order revisions.
    server {
        listen 127.0.0.1:@PORT@ default_server;
        server_name default.invalid;
        return 200 "default\n";
    }

    # exact name, also matched by `*.lead.example.com` and `exact.*`; exact
    # table wins.
    server {
        listen 127.0.0.1:@PORT@;
        server_name exact.example.com;
        return 200 "exact\n";
    }

    server {
        listen 127.0.0.1:@PORT@;
        server_name *.lead.example.com;
        return 200 "lead-short\n";
    }

    # Longest matching leading wildcard wins when both match.
    server {
        listen 127.0.0.1:@PORT@;
        server_name *.deep.lead.example.com;
        return 200 "lead-long\n";
    }

    server {
        listen 127.0.0.1:@PORT@;
        server_name www.trail.*;
        return 200 "trail-short\n";
    }

    # Longest matching trailing wildcard wins when both match.
    server {
        listen 127.0.0.1:@PORT@;
        server_name www.trail.example.*;
        return 200 "trail-long\n";
    }

    # Dot-prefixed name: the bare name and any subdomain.
    server {
        listen 127.0.0.1:@PORT@;
        server_name .dot.example;
        return 200 "dot\n";
    }

    # Regexes are evaluated in authored (server declaration) order; the first
    # matching pattern wins.
    server {
        listen 127.0.0.1:@PORT@;
        server_name ~^order\.example\.com$;
        return 200 "regex-first\n";
    }

    server {
        listen 127.0.0.1:@PORT@;
        server_name ~^order\.;
        return 200 "regex-second\n";
    }

    # A pattern containing ASCII uppercase letters is compiled case-insensitively
    # by nginx because the request host is lower-cased before matching.
    server {
        listen 127.0.0.1:@PORT@;
        server_name ~^UPPER\.case\.example$;
        return 200 "regex-upper\n";
    }

    # Wildcard precedence: the leading-wildcard table is searched before the
    # trailing-wildcard table, and both are searched before regexes.
    server {
        listen 127.0.0.1:@PORT@;
        server_name *.mix.example;
        return 200 "mix-lead\n";
    }

    server {
        listen 127.0.0.1:@PORT@;
        server_name trail.mix.*;
        return 200 "mix-trail\n";
    }

    server {
        listen 127.0.0.1:@PORT@;
        server_name ~\.mix\.example$;
        return 200 "mix-regex\n";
    }

    # Trailing wildcard that only exists to prove exact precedence.
    server {
        listen 127.0.0.1:@PORT@;
        server_name exact.*;
        return 200 "exact-trail\n";
    }

    # ---- bounded named-location internal redirects --------------------
    #
    # try_files probes the request path under the document root and redirects
    # once to a named location on a miss. Named targets execute return,
    # proxy_pass, and static serving, exactly like nginx.
    server {
        listen 127.0.0.1:@PORT@;
        server_name named.example.com;
        root @PUBLIC@;

        # nginx always has an implicit prefix-`/` location; the explicit one
        # keeps error_page target files (`/custom-404.html`) resolvable from
        # the server root in both implementations.
        location / {
        }

        # Unmapped-ish 404s in this server redirect through the host-level
        # `error_page 404 = @named-return;` (bare `=`: target status wins).
        error_page 404 = @named-return;

        location /static/ {
            try_files $uri $uri/ @named-return;
        }

        location /nf/ {
            try_files $uri @named-return;
        }

        location /proxy/ {
            try_files $uri @named-proxy;
        }

        # A named location executes its own access phase: both the allow and
        # the deny case prove the internal redirect does not bypass it.
        location /gate/ {
            try_files $uri @named-allow;
        }

        location /deny/ {
            try_files $uri @named-deny;
        }

        location /sdeny/ {
            try_files $uri @named-static-deny;
        }

        location /sallow/ {
            try_files $uri @named-static-allow;
        }

        location /redir/ {
            try_files $uri @named-redirect;
        }

        # Static serving that produces a 404, mapped by the host error_page.
        location /err-default/ {
        }

        # Location-level error_page to a static document: the custom page body
        # is served under the original 404 status (no `=code`).
        location /custom/ {
            error_page 404 /custom-404.html;
        }

        location @named-return {
            return 200 "named-return\n";
        }

        location @named-proxy {
            proxy_pass http://127.0.0.1:@MOCK@;
        }

        location @named-allow {
            allow 127.0.0.1;
            deny all;
            return 200 "named-allow\n";
        }

        location @named-deny {
            deny all;
            return 200 "named-denied\n";
        }

        location @named-redirect {
            return 302 /login;
        }

        # Static named targets run the access phase.
        location @named-static-deny {
            deny all;
            root @PUBLIC@;
        }

        location @named-static-allow {
            allow 127.0.0.1;
            deny all;
            root @PUBLIC@;
        }
    }

    # A host with no error_page mapping: the unmapped 404 body is nginx's
    # built-in error page. The runtime answers the same status with its own
    # bounded body; compare.py catalogues that one intentional difference.
    server {
        listen 127.0.0.1:@PORT@;
        server_name plain.example.com;
        root @PUBLIC@;
        location /plain/ {
        }
    }
}
