daemon off;
master_process off;
error_log stderr notice;

# Full-surface single-page nginx behavioral regression fixture.
#
# One configuration exercising every runtime-executable http-core-v1
# directive family of specs/nginx-gap.catalog.json against the Rust data
# plane (sdkwork-api-webserver-standalone-gateway serve-nginx). The
# companion probe.py owns the mock upstreams, the runtime materials
# (htpasswd, TLS certs) and the whole case matrix; see probe.py for the
# canonical run command.
#
# Port map (all loopback, offsets from --port-base, default 19890):
#   +0  19890 http: static/proxy/filters vhosts + *.example.com wildcard
#   +1  19891 echo_backend     mock upstream (probe-owned)
#   +2  19892 target-a         mock LB target (probe-owned)
#   +3  19893 target-b         mock LB target (probe-owned)
#   +4  19894 target-backup    mock LB target (probe-owned)
#   +5  19895 http: load-balancing strategies vhost
#   +6  19896 stream: plaintext TCP proxy listener
#   +7  19897 stream_echo      mock TCP echo upstream (probe-owned)
#   +8  19898 http: TLS SNI + http2 listener (a/b.example.local)
#   +9  19899 intentionally dead (lb_backup primary)

events {
    worker_connections 512;
}

http {
    access_log off;
    http2 on;

    limit_req_zone  $binary_remote_addr  zone=reqpage:1m  rate=4r/s;
    limit_conn_zone $binary_remote_addr  zone=connpage:1m;

    proxy_cache_path @CACHE@ levels=1:2 keys_zone=pagecache:1m max_size=8m inactive=60s;

    upstream echo_backend {
        server 127.0.0.1:19891;
        keepalive 16;
    }

    upstream lb_rr {
        server 127.0.0.1:19892 weight=3;
        server 127.0.0.1:19893 weight=1;
    }

    upstream lb_lc {
        least_conn;
        server 127.0.0.1:19892;
        server 127.0.0.1:19893;
    }

    upstream lb_iphash {
        ip_hash;
        server 127.0.0.1:19892;
        server 127.0.0.1:19893;
    }

    upstream lb_hash {
        hash $request_uri consistent;
        server 127.0.0.1:19892;
        server 127.0.0.1:19893;
    }

    upstream lb_backup {
        server 127.0.0.1:19899 max_fails=1 fail_timeout=30s;
        server 127.0.0.1:19894 backup;
    }

    # ---- default_server: static content, routing, URI semantics ----
    server {
        listen 127.0.0.1:19890 default_server;
        server_name static.example.com;

        root @PUBLIC@;
        index index.html;
        add_header X-Served-By full-surface;

        # server-level rewrite (nginx server context, runs before locations)
        rewrite ^/srv/(.*)$ /$1 last;

        # server-level error_page mappings (nginx server context)
        error_page 404 /notfound.html;
        error_page 416 =200 /notfound.html;
        recursive_error_pages on;

        location = /exact {
            return 200 "exact";
        }

        location /exact/ {
            return 200 "prefix";
        }

        location = /norm {
            return 200 "norm-ok";
        }

        location /echo/ {
            proxy_pass http://echo_backend;
        }

        location /cap/ {
            rewrite ^/cap/([a-z]+)/([0-9]+)$ /echo/cap-$1-num-$2 last;
        }

        location /perm/ {
            rewrite ^/perm/(.*)$ https://perm.example.com/p/$1 permanent;
        }

        location /redir/ {
            rewrite ^/redir/(.*)$ /goto/$1 redirect;
        }

        location /brk/ {
            rewrite ^/brk/(.*)$ /$1 break;
        }

        location /app/ {
            try_files $uri $uri/ /app/index.html;
        }

        location /docs/ {
            alias @PUBLIC@/docs/;
        }

        # ^~ suppresses regex evaluation for /assets/* even when the
        # request ends in a regex-matching suffix.
        location ^~ /assets/ {
            try_files $uri =404;
        }

        location ~ \.png$ {
            return 200 "re-png";
        }

        location ~* \.ico$ {
            return 200 "re-ico";
        }

        location /files/ {
            secure_link_secret s3cret;
            root @PUBLIC@;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Location-level error_page replaces the host set for this route.
        location /lost/ {
            error_page 404 /alt.html;
            try_files $uri =404;
        }

        # 404 maps to a missing target: with recursive_error_pages the chain
        # continues into the host-level 404 mapping (/notfound.html).
        location /chain/ {
            error_page 404 /missing-1.html;
            try_files $uri =404;
        }
    }

    # ---- proxying: header policy, caching, body limits, dynamic target ----
    server {
        listen 127.0.0.1:19890;
        server_name proxy.example.com;

        proxy_set_header X-Level server;
        proxy_set_header X-Custom-Hello "h-$host";

        location /echo/ {
            proxy_pass http://echo_backend;
        }

        # proxy_pass URI part replaces the matched location prefix.
        location /api/ {
            proxy_pass http://echo_backend/v1/;
        }

        # A child proxy_set_header set fully replaces the inherited one.
        location /hdr-loc/ {
            proxy_set_header X-Level location;
            proxy_pass http://echo_backend/echo;
        }

        location /hdr-inherit/ {
            proxy_pass http://echo_backend/echo;
        }

        location /hdr-strip/ {
            proxy_pass_request_headers off;
            proxy_pass http://echo_backend/echo;
        }

        location /dyn/ {
            proxy_pass http://$http_x_upstream_authority;
        }

        location /upload/ {
            client_max_body_size 1k;
            proxy_pass http://echo_backend/echo;
        }

        location /chunk/ {
            proxy_pass http://echo_backend/echo;
        }

        location /cached/ {
            proxy_cache pagecache;
            proxy_cache_valid 200 10s;
            proxy_pass http://echo_backend/who;
        }

        location /stream/ {
            proxy_pass http://echo_backend/stream;
        }

        location /ws/ {
            proxy_pass http://echo_backend;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # proxy_intercept_errors: a mapped upstream error status is replaced
        # by the error page; the control location passes the error through.
        error_page 503 /static-pages/down.html;

        location /static-pages/ {
            root @PUBLIC@;
        }

        location /perr/ {
            proxy_intercept_errors on;
            proxy_pass http://echo_backend/status/503;
        }

        location /perr-pass/ {
            proxy_pass http://echo_backend/status/503;
        }
    }

    # ---- response filters, limits, access control, auth ----
    server {
        listen 127.0.0.1:19890;
        server_name filters.example.com;

        # server-level gzip (nginx server context; scoped to this host)
        gzip on;
        gzip_types text/plain application/json;
        gzip_min_length 64;

        # server-level sub_filter: locations without their own sub_filter
        # inherit it; declaring locations replace it (nginx semantics)
        sub_filter beta delta;
        sub_filter_once off;
        sub_filter_types text/plain;

        location /gz/ {
            root @PUBLIC@;
        }

        # Location-level gzip off overrides the host policy for this route.
        location /gzplain/ {
            gzip off;
            alias @PUBLIC@/;
        }

        location /sub/ {
            sub_filter alpha omega;
            sub_filter_once off;
            sub_filter_types text/plain;
            proxy_pass http://echo_backend/text;
        }

        location /sub-srv/ {
            proxy_pass http://echo_backend/text;
        }

        location /rate/ {
            limit_req zone=reqpage burst=6 nodelay;
            proxy_pass http://echo_backend/who;
        }

        location /conn/ {
            limit_conn connpage 1;
            proxy_pass http://echo_backend/slow;
        }

        location /admin/ {
            allow 127.0.0.0/8;
            deny 10.0.0.0/8;
            proxy_pass http://echo_backend/who;
        }

        location /blocked/ {
            deny all;
            proxy_pass http://echo_backend/who;
        }

        location /mixed/ {
            allow 192.168.0.0/16;
            proxy_pass http://echo_backend/who;
        }

        location /private/ {
            auth_basic "Full Surface";
            auth_basic_user_file @HTPASSWD@;
            proxy_pass http://echo_backend/who;
        }

        location / {
            return 200 "filters-root";
        }
    }

    # ---- leading-wildcard vhost: exact names win, unknown subdomains land here ----
    server {
        listen 127.0.0.1:19890;
        server_name *.example.com;

        # server-level return: answers every request before locations
        return 200 "wild";
    }

    # ---- load-balancing strategies ----
    server {
        listen 127.0.0.1:19895;
        server_name lb.example.com;

        location /rr/ {
            proxy_pass http://lb_rr/who;
        }

        location /lc/ {
            proxy_pass http://lb_lc/who;
        }

        location /iphash/ {
            proxy_pass http://lb_iphash/who;
        }

        location /hash/ {
            proxy_pass http://lb_hash/who;
        }

        location /backup/ {
            proxy_pass http://lb_backup/who;
        }

        location /slow/ {
            proxy_pass http://lb_lc/slow;
        }
    }

    # ---- TLS: SNI certificate selection + http2 over ALPN ----
    server {
        listen 127.0.0.1:19898 ssl;
        server_name a.example.local;

        ssl_certificate cert-a.pem;
        ssl_certificate_key key-a.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            return 200 "tls-a";
        }
    }

    server {
        listen 127.0.0.1:19898 ssl;
        server_name b.example.local;

        ssl_certificate cert-b.pem;
        ssl_certificate_key key-b.pem;

        location / {
            return 200 "tls-b";
        }
    }
}

stream {
    upstream stream_echo {
        server 127.0.0.1:19897;
    }

    server {
        listen 127.0.0.1:19896;
        proxy_pass stream_echo;
    }
}
