                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - items
                      - pageInfo
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/RootDomainResponse'
                        pageInfo:
                          $ref: '#/components/schemas/PageInfo'
    post:
      operationId: rootDomains.create
      summary: Define a tenant root-domain Zone
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.write
      x-sdkwork-idempotent: true
      x-sdkwork-owner: sdkwork-webserver
      parameters:
