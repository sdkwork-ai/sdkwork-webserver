                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/ServerProjectOperations'
    post:
      operationId: serverFiles.node.operations.create
      summary: Run a project operation on a deployment node
      description: Runs a classified project lifecycle operation as fixed argv.
        Build/package operations run to completion under a hard timeout with
        byte-capped output capture and kill the process tree on expiry.
        Start/stop/restart manage the project's single managed process through
        a pid file (start refuses a duplicate live process; stop is idempotent).
        Managed operations require the `web.servers.files.deploy` permission
        and are rejected with 403 when the principal lacks it. Deployment is
        not a shell operation; application releases go through the durable
        deployment command plane.
