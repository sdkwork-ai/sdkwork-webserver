      responses:
        '201':
          description: Tenant root-domain Zone defined successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/RootDomainResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /backend/v3/api/root_domains/{rootDomainId}:
    parameters:
    - $ref: '#/components/parameters/RootDomainIdParam'
    get:
      operationId: rootDomains.retrieve
      summary: Retrieve a tenant root-domain Zone
      tags:
