    IssueCertificateRequest:
      type: object
      additionalProperties: false
      required:
      - domainIds
      - certType
      properties:
        domainIds:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          description: Ordered exact or wildcard domain identifiers included in the
            certificate SAN extension.
          items:
            type: string
            format: uuid
        certType:
          type: integer
          enum:
          - 1
          - 3
          description: 1=Let's Encrypt, 3=self-signed. Custom import is a separate
            future workflow.
        keyAlgorithm:
          type: string
          enum:
          - ECDSA
          - RSA
          default: RSA
          description: >-
            Key algorithm of the issued leaf. Defaults to RSA: a managed
            certificate is renewed unattended and RSA-2048 is the leaf key every TLS
            client accepts, so a certificate requested without an opinion on this
            stays reachable from old stacks as well. Ask for ECDSA explicitly where
            every client is known to support P-256.
        autoRenew:
          type: boolean
          default: true
    CertificateIdentifierResponse:
      type: object
      additionalProperties: false
      required:
      - domainId
      - hostname
      - identifierType
      - position
