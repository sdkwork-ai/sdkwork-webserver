            query parameters, and fragments are forbidden.
        artifactDriveUri:
          type: string
          maxLength: 500
          pattern: ^drive://spaces/[^/?#]+/nodes/[^/?#]+$
          description: Stable Drive resource identity for package deployments. Signed
            delivery URLs are forbidden.
        artifactSize:
