openapi: 3.1.2
info:
  title: SDKWork Webserver Backend API
  description: SDKWork Web Server management and control-plane API.
  version: 1.0.0
servers:
- url: https://api.server.sdkwork.com
  description: Production
- url: http://localhost:3800
  description: Local Development
security:
- AuthToken: []
  AccessToken: []
paths:
  /backend/v3/api/applications:
    get:
      operationId: applications.list
      summary: List managed applications
      x-sdkwork-pagination-mode: offset
      tags:
      - application
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.read
      x-sdkwork-owner: sdkwork-webserver
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - name: application_type
        in: query
        schema:
          type: string
          enum:
          - WEB
          - API
      - name: site_type
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 6
      - name: status
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 3
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
      responses:
        '200':
          description: Managed application list returned successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - items
                      - pageInfo
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/ApplicationResponse'
                        pageInfo:
                          $ref: '#/components/schemas/PageInfo'
    post:
      operationId: applications.create
      summary: Create a managed application
      tags:
      - application
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.write
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-sdkwork-owner: sdkwork-webserver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Managed application created successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/ApplicationResponse'
  /backend/v3/api/applications/{applicationId}:
    parameters:
    - $ref: '#/components/parameters/ApplicationIdParam'
    get:
      operationId: applications.retrieve
      summary: Retrieve a managed application
      tags:
      - application
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.read
      x-sdkwork-owner: sdkwork-webserver
      responses:
        '200':
          description: Managed application returned successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters: []
    patch:
      operationId: applications.update
      summary: Update a managed application
      tags:
      - application
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.write
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-sdkwork-owner: sdkwork-webserver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: Managed application updated successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: applications.delete
      summary: Delete a managed application
      tags:
      - application
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.write
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-sdkwork-rate-limit-tier: auth-critical
      x-sdkwork-owner: sdkwork-webserver
      responses:
        '204':
          description: Managed application deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'
  /backend/v3/api/applications/{applicationId}/activate:
    parameters:
    - $ref: '#/components/parameters/ApplicationIdParam'
    post:
      operationId: applications.activate
      summary: Activate a managed application
      tags:
      - application
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.write
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-sdkwork-rate-limit-tier: auth-critical
      x-sdkwork-owner: sdkwork-webserver
      responses:
        '200':
          description: Managed application activated successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /backend/v3/api/applications/{applicationId}/pause:
    parameters:
    - $ref: '#/components/parameters/ApplicationIdParam'
    post:
      operationId: applications.pause
      summary: Pause a managed application
      tags:
      - application
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.write
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-sdkwork-rate-limit-tier: auth-critical
      x-sdkwork-owner: sdkwork-webserver
      responses:
        '200':
          description: Managed application paused successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /backend/v3/api/applications/{applicationId}/domains:
    parameters:
    - $ref: '#/components/parameters/ApplicationIdParam'
    get:
      operationId: applications.domains.list
      summary: List application domains
      x-sdkwork-pagination-mode: offset
      tags:
      - applicationDomain
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.read
      x-sdkwork-owner: sdkwork-webserver
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Application domain list returned successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - items
                      - pageInfo
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/ApplicationDomainResponse'
                        pageInfo:
                          $ref: '#/components/schemas/PageInfo'
    post:
      operationId: applications.domains.create
      summary: Bind a public domain to an application
      tags:
      - applicationDomain
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.write
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-sdkwork-owner: sdkwork-webserver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationDomainRequest'
      responses:
        '201':
          description: Application domain bound successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/ApplicationDomainResponse'
  /backend/v3/api/applications/{applicationId}/domains/{domainId}:
    parameters:
    - $ref: '#/components/parameters/ApplicationIdParam'
    - $ref: '#/components/parameters/DomainIdParam'
    delete:
      operationId: applications.domains.delete
      summary: Unbind an application public domain
      tags:
      - applicationDomain
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.write
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-sdkwork-rate-limit-tier: auth-critical
      x-sdkwork-owner: sdkwork-webserver
      responses:
        '204':
          description: Application domain unbound successfully.
        '404':
          $ref: '#/components/responses/NotFound'
  /backend/v3/api/applications/{applicationId}/domains/{domainId}/verify:
    parameters:
    - $ref: '#/components/parameters/ApplicationIdParam'
    - $ref: '#/components/parameters/DomainIdParam'
    post:
      operationId: applications.domains.verify
      summary: Create or check an application-domain ownership challenge
      tags:
      - applicationDomain
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.write
      x-sdkwork-idempotent: true
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-sdkwork-owner: sdkwork-webserver
      responses:
        '200':
          description: Domain ownership challenge and latest external observation
            returned successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/DomainVerifyResponse'
  /backend/v3/api/applications/{applicationId}/domains/{domainId}/listener_certificate_bindings:
    parameters:
    - $ref: '#/components/parameters/ApplicationIdParam'
    - $ref: '#/components/parameters/DomainIdParam'
    get:
      operationId: applications.domains.listenerCertificateBindings.list
      summary: List certificates active on an application domain listener
      description: Returns an offset-paginated P1 list ordered by default status,
        priority, and stable binding id.
      x-sdkwork-pagination-mode: offset
      tags:
      - certificate
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.certificates.read
      x-sdkwork-owner: sdkwork-webserver
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Listener certificate bindings returned successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - items
                      - pageInfo
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/ListenerCertificateBindingResponse'
                        pageInfo:
                          $ref: '#/components/schemas/PageInfo'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: applications.domains.listenerCertificateBindings.create
      summary: Bind a certificate version to an application domain listener
      tags:
      - certificate
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.certificates.write
      x-sdkwork-idempotent: true
      x-sdkwork-rate-limit-tier: auth-critical
      x-sdkwork-owner: sdkwork-webserver
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateListenerCertificateBindingRequest'
      responses:
        '201':
          description: Certificate version bound to the listener successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/ListenerCertificateBindingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /backend/v3/api/applications/{applicationId}/domains/{domainId}/listener_certificate_bindings/{bindingId}:
    parameters:
    - $ref: '#/components/parameters/ApplicationIdParam'
    - $ref: '#/components/parameters/DomainIdParam'
    - $ref: '#/components/parameters/ListenerCertificateBindingIdParam'
    delete:
      operationId: applications.domains.listenerCertificateBindings.delete
      summary: Remove a certificate from an application domain listener
      tags:
      - certificate
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.certificates.write
      x-sdkwork-idempotent: true
      x-sdkwork-rate-limit-tier: auth-critical
      x-sdkwork-owner: sdkwork-webserver
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Listener certificate binding removed successfully.
        '404':
          $ref: '#/components/responses/NotFound'
  /backend/v3/api/root_domains:
    get:
      operationId: rootDomains.list
      summary: List tenant root-domain Zones
      x-sdkwork-pagination-mode: offset
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
