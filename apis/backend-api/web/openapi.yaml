  /backend/v3/api/traffic_usage:
    get:
      operationId: trafficUsages.retrieve
      summary: Retrieve aggregated traffic usage of the caller's own tenant
      description: >-
        Aggregates the traffic facts this edge recorded for the caller's tenant
        over a date window. The reach is fixed by this operation: it is always
        the caller's own tenant, taken from the authenticated context, so no
        query parameter can widen it. The platform-wide reading lives at
        `/backend/v3/api/platform_traffic_usage` and is restricted to the
        platform operator tenant.
      tags:
      - trafficUsage
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.traffic.read
      x-sdkwork-owner: sdkwork-webserver
      parameters:
      - name: date_from
        in: query
        description: Inclusive UTC calendar day (`YYYY-MM-DD`). Defaults to the trailing 30 days.
        schema:
          type: string
          minLength: 10
          maxLength: 10
      - name: date_to
        in: query
        description: Exclusive UTC calendar day (`YYYY-MM-DD`). Defaults to tomorrow (UTC).
        schema:
          type: string
          minLength: 10
          maxLength: 10
      - name: dimension
        in: query
        description: Restrict the totals and the series to one usage dimension.
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: top_apps
        in: query
        description: Size of the per-app breakdown.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Aggregated traffic usage returned successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/TrafficUsageStatisticsResponse'
  /backend/v3/api/platform_traffic_usage:
    get:
      operationId: platformTrafficUsages.retrieve
      summary: Retrieve aggregated traffic usage of every tenant
      description: >-
        Aggregates the traffic facts this edge recorded for every tenant it
        serves, and additionally fills the per-tenant breakdown. Restricted to
        the platform operator tenant: a tenant-bound context is rejected with
        40301 rather than narrowed to its own slice, so a misrouted admin page
        fails loudly instead of rendering one tenant's traffic as the platform
        total.
      tags:
      - trafficUsage
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.traffic.read
      x-sdkwork-owner: sdkwork-webserver
      parameters:
      - name: date_from
        in: query
        description: Inclusive UTC calendar day (`YYYY-MM-DD`). Defaults to the trailing 30 days.
        schema:
          type: string
          minLength: 10
          maxLength: 10
      - name: date_to
        in: query
        description: Exclusive UTC calendar day (`YYYY-MM-DD`). Defaults to tomorrow (UTC).
        schema:
          type: string
          minLength: 10
          maxLength: 10
      - name: dimension
        in: query
        description: Restrict the totals and the series to one usage dimension.
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: top_apps
        in: query
        description: Size of the per-app breakdown.
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Aggregated traffic usage returned successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/TrafficUsageStatisticsResponse'
  /backend/v3/api/metrics_summaries:
    get:
      operationId: metricsSummaries.retrieve
      summary: Retrieve the dashboard metric summary of the caller's own tenant
      description: >-
        The dashboard's cardinal metrics — how many users and applications the
        caller's tenant has, and how much traffic this edge metered for it —
        each reported across four windows: `today`, `last_7_days`,
        `current_month`, and `lifetime`.

        The reach is fixed by this operation: the counts and the traffic cover
        the caller's own tenant, taken from the authenticated context, so no
        query parameter can widen it. The platform-wide reading lives at
        `/backend/v3/api/platform_metrics_summaries` and is restricted to the
        platform operator tenant.

        Every figure is an aggregate. No user, tenant, or application is
        returned, so the reading reports the size of an estate without becoming
        a second, quieter way to enumerate its subjects.

        The tenant count is absent here rather than reported at `1`: a tenant
        counting itself is a constant, and a surface handed one would draw it.

        `date_from` and `date_to` bound the **series** — the per-day trend —
        and never the four card windows, which stay resolved server-side from
        the clock. The series window is the caller's because the same window
        control drives the traffic trend drawn beside it on one chart; the two
        readings must resolve the same period or their lines would be plotted
        against a domain their days were not cut against.
      tags:
      - metricsSummary
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.traffic.read
      x-sdkwork-owner: sdkwork-webserver
      parameters:
      - name: date_from
        in: query
        description: >-
          Inclusive UTC calendar day (`YYYY-MM-DD`) the per-day series starts
          on. Defaults to the trailing 30 days. The card windows ignore it.
        schema:
          type: string
          minLength: 10
          maxLength: 10
      - name: date_to
        in: query
        description: >-
          Exclusive UTC calendar day (`YYYY-MM-DD`) the per-day series ends
          before. Defaults to tomorrow (UTC). The card windows ignore it.
        schema:
          type: string
          minLength: 10
          maxLength: 10
      responses:
        '200':
          description: Dashboard metric summary returned successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/MetricsSummaryResponse'
  /backend/v3/api/platform_metrics_summaries:
    get:
      operationId: platformMetricsSummaries.retrieve
      summary: Retrieve the dashboard metric summary of every tenant
      description: >-
        The dashboard's cardinal metrics over every tenant this edge serves, and
        the only reading that reports a **tenant count**: on the own-tenant
        operation that figure is structurally one.

        Restricted to the platform operator tenant: a tenant-bound context is
        rejected with 40301 rather than narrowed to its own slice, so a
        misrouted admin page fails loudly instead of presenting one tenant's
        estate as the platform's.

        Reads across three owners — the IAM subjects, the metered usage facts,
        and the Web Server's own application table — and reports the capability
        as unavailable (`503`) when this deployment does not assemble all of
        them, because a count of zero and an inability to count are opposite
        claims that draw the same picture.

        A fourth owner is **optional**: the agents catalog is not declared by
        any topology profile, so a deployment that does not run the agents
        module still answers — with the agents metric named in
        `unassembledMetrics` rather than reported at `0`.

        `date_from` and `date_to` bound the **series** only; see the own-tenant
        operation for why that window is the caller's while the cards' are not.
      tags:
      - metricsSummary
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.traffic.read
      x-sdkwork-owner: sdkwork-webserver
      parameters:
      - name: date_from
        in: query
        description: >-
          Inclusive UTC calendar day (`YYYY-MM-DD`) the per-day series starts
          on. Defaults to the trailing 30 days. The card windows ignore it.
        schema:
          type: string
          minLength: 10
          maxLength: 10
      - name: date_to
        in: query
        description: >-
          Exclusive UTC calendar day (`YYYY-MM-DD`) the per-day series ends
          before. Defaults to tomorrow (UTC). The card windows ignore it.
        schema:
          type: string
          minLength: 10
          maxLength: 10
      responses:
        '200':
          description: Dashboard metric summary returned successfully.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/MetricsSummaryResponse'
components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
    AgentToken:
      type: apiKey
      in: header
      name: X-SDKWork-Agent-Token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ApplicationIdParam:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DomainIdParam:
      name: domain_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RootDomainIdParam:
      name: rootDomainId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentIdParam:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceVersionIdParam:
      name: sourceVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CertificateIdParam:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CertificateOperationIdParam:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ListenerCertificateBindingIdParam:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    CursorParam:
      name: cursor
      in: query
      description: Opaque keyset continuation token for cursor-paginated operations;
        must not be combined with page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    ClusterIdParam:
      name: clusterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClusterHostIdParam:
      name: hostId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClusterInstanceIdParam:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ClusterHeartbeatSampleResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - metrics
      - reportedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          type: integer
          minimum: 0
          maximum: 5
        latencyMs:
          type: integer
          minimum: 0
        metrics:
          type: object
          description: Resource metrics snapshot captured at heartbeat time.
        reportedAt:
          type: string
          format: date-time
    PublishClusterSyncRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      - payload
      properties:
        kind:
          type: string
          enum:
          - config
          - applications
          description: Desired-state track to publish.
        payload:
          type: object
          description: Track-specific desired-state payload; opaque to the transport.
    ClusterSyncManifest:
      type: object
      additionalProperties: false
      required:
      - clusterId
      - kind
      - revision
      - sha256
      - payload
      - createdAt
      properties:
        clusterId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - config
          - applications
        revision:
          type: string
          minLength: 1
          maxLength: 128
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Canonical payload digest the node verifies before applying.
        payload:
          type: object
          description: Track-specific desired-state payload; opaque to the transport.
        createdAt:
          type: string
          format: date-time
    ProbeClusterInstanceRequest:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          maxLength: 2048
          default: /
          description: Probe path; defaults to `/`.
        timeoutMs:
          type: integer
          minimum: 100
          maximum: 10000
          default: 3000
          description: Probe timeout, clamped to 100..=10000 ms.
    ClusterProbeRunResponse:
      type: object
      additionalProperties: false
      required:
      - healthy
      - latencyMs
      - failures
      - ejected
      - recovered
      properties:
        healthy:
          type: boolean
          description: Probe reached the instance and got a healthy answer.
        latencyMs:
          type: integer
          minimum: 0
          description: Round-trip latency of the probe.
        failures:
          type: integer
          minimum: 0
          description: Consecutive probe failures after this run; 0 when healthy.
        ejected:
          type: boolean
          description: Auto-eject transition happened on this run.
        recovered:
          type: boolean
          description: Auto-recovery transition happened on this run.
    EnqueueClusterPeerMessagesRequest:
      type: object
      additionalProperties: false
      required:
      - clusterId
      - messageType
      properties:
        clusterId:
          type: string
          format: uuid
        toInstanceId:
          type: string
          format: uuid
          description: Target instance; omitted broadcasts to every online member.
        fromInstanceId:
          type: string
          format: uuid
          description: Sender instance; omitted for control-plane-originated messages.
        messageType:
          type: string
          minLength: 1
          maxLength: 64
        payload:
          type: object
          description: Message payload JSON; bounded to 16 KiB.
        expiresInSeconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 3600
    EnqueueClusterPeerMessagesResponse:
      type: object
      additionalProperties: false
      required:
      - enqueued
      properties:
        enqueued:
          $ref: '#/components/schemas/Int64String'
          description: Rows materialized (one per target member).
    Int64String:
      type: string
      format: int64
      pattern: ^[0-9]+$
      x-sdkwork-int64-string: true
      x-sdkwork-rust-type: i64
    ProblemDetail:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/SdkWorkPlatformErrorCode'
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    CreateNginxConfigRequest:
      type: object
      additionalProperties: false
      required:
      - configType
      - configName
      - configContent
      - siteId
      properties:
        configType:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
        configName:
          type: string
          minLength: 1
          maxLength: 200
        configContent:
          type: string
          minLength: 1
          maxLength: 1048576
        siteId:
          type: string
          format: uuid
    UpdateNginxConfigRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        configContent:
          type: string
          minLength: 1
          maxLength: 1048576
        configName:
          type: string
          minLength: 1
          maxLength: 200
    MediaChecksum:
      type: object
      additionalProperties: false
      required:
      - algorithm
      - value
      properties:
        algorithm:
          type: string
          enum:
          - sha256
        value:
          type: string
          pattern: ^[a-f0-9]{64}$
    MediaResource:
      type: object
      additionalProperties: false
      required:
      - kind
      - source
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - image
          - video
          - audio
          - voice
          - document
          - archive
          - model
          - other
        source:
          type: string
          enum:
          - drive
          - external_url
          - data_url
          - provider_asset
          - generated
        url:
          type: string
          format: uri
        publicUrl:
          type: string
          format: uri
        uri:
          type: string
          maxLength: 500
        objectBlobId:
          type: string
        fileName:
          type: string
          maxLength: 512
        mimeType:
          type: string
          maxLength: 256
        sizeBytes:
          type: string
          pattern: ^[0-9]+$
        checksum:
          $ref: '#/components/schemas/MediaChecksum'
        width:
          type: integer
