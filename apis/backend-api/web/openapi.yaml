  /backend/v3/api/root_domains/{rootDomainId}/subdomains:
    parameters:
    - $ref: '#/components/parameters/RootDomainIdParam'
    get:
      operationId: rootDomains.subdomains.list
      summary: List publishable hostnames in a root-domain Zone
      x-sdkwork-pagination-mode: offset
      tags:
      - domain
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.sites.read
      x-sdkwork-owner: sdkwork-webserver
      parameters:
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/PageSizeParam'
