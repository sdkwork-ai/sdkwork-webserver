  /backend/v3/api/clusters/{clusterId}/sync:
    parameters:
    - $ref: '#/components/parameters/ClusterIdParam'
    post:
      operationId: clusters.sync
      summary: Publish a desired-state revision to every instance of the cluster
      description: |-
        Publishes one desired-state revision for the `config` or `applications`
        track and flips every instance of the cluster to PENDING. Instances read
        the revision through the machine-only internal API, apply it, and
        acknowledge IN_SYNC or FAILED; a drifting node is visible on the admin
        surface through the aggregate sync status.
      tags:
      - cluster
      security:
      - AuthToken: []
        AccessToken: []
      x-sdkwork-api-surface: backend-api
      x-sdkwork-api-authority: sdkwork-webserver-backend-api
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.cluster.write
      x-sdkwork-rate-limit-tier: auth-critical
      x-sdkwork-owner: sdkwork-webserver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishClusterSyncRequest'
      responses:
        '200':
          description: Sync revision published.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SdkWorkApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required:
                      - item
                      properties:
                        item:
                          $ref: '#/components/schemas/ClusterSyncManifest'
