          type: string
          format: date-time
    TrafficUsageStatisticsResponse:
      type: object
      additionalProperties: false
      description: >-
        Aggregated traffic usage over a **half-open** date window
        (`dateFrom <= day < dateTo`). Every view is derived from the same
        append-only traffic facts, so the totals, the daily series, and the
        per-app breakdown are consistent with each other by construction rather
        than by a reconciliation job having run most recently.
      required:
      - dateFrom
      - dateTo
      - platformScope
      - totals
      - daily
      - apps
      - tenants
      properties:
        dateFrom:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        dateTo:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        platformScope:
          type: boolean
          description: >-
            Whether the figures cover every tenant rather than the caller's own.
            Reported so a surface cannot render a platform-wide number as if it
            were the caller's own, or the reverse.
        totals:
          type: array
          items:
            $ref: '#/components/schemas/TrafficUsageTotal'
        daily:
          type: array
          items:
            $ref: '#/components/schemas/TrafficUsageDailyPoint'
        apps:
          type: array
          items:
            $ref: '#/components/schemas/TrafficUsageAppTotal'
        tenants:
          type: array
          description: >-
            Per-tenant breakdown. Empty for a tenant-scoped read, where the
            answer would be the caller's own totals repeated once per dimension.
          items:
            $ref: '#/components/schemas/TrafficUsageTenantTotal'
    TrafficUsageTotal:
      type: object
      additionalProperties: false
      required:
      - dimension
      - quantity
      - unit
      properties:
        dimension:
          type: string
          minLength: 1
          maxLength: 64
        quantity:
          $ref: '#/components/schemas/Int64String'
        unit:
          type: string
          minLength: 1
          maxLength: 32
    TrafficUsageDailyPoint:
      type: object
      additionalProperties: false
      required:
      - usageDate
      - dimension
      - quantity
      properties:
        usageDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        dimension:
          type: string
          minLength: 1
          maxLength: 64
        quantity:
          $ref: '#/components/schemas/Int64String'
    TrafficUsageAppTotal:
      type: object
      additionalProperties: false
      description: >-
        One app's aggregate over the window. A row carrying neither `appUuid`
        nor `appSlug` is the **unattributed** bucket: traffic served for a
        hostname the edge could not resolve to an app. It is reported rather
        than dropped so the per-app rows keep summing back to the total; a
        surface must render it as its own row, or the breakdown appears to lose
        traffic.
      required:
      - dimension
      - quantity
      - unit
      properties:
        appUuid:
          type: string
          maxLength: 36
        appSlug:
          type: string
          maxLength: 128
        dimension:
          type: string
          minLength: 1
          maxLength: 64
        quantity:
          $ref: '#/components/schemas/Int64String'
        unit:
          type: string
          minLength: 1
          maxLength: 32
    TrafficUsageTenantTotal:
      type: object
      additionalProperties: false
      required:
      - tenantId
      - dimension
      - quantity
      - unit
      properties:
        tenantId:
          $ref: '#/components/schemas/Int64String'
        dimension:
          type: string
          minLength: 1
          maxLength: 64
        quantity:
          $ref: '#/components/schemas/Int64String'
        unit:
          type: string
          minLength: 1
          maxLength: 32

    MetricsSummaryResponse:
      type: object
      additionalProperties: false
      description: >-
        The dashboard's cardinal metrics, each reported across the same four
        **half-open** windows (`today`, `last_7_days`, `current_month`,
        `lifetime`). Three groups share the window vocabulary but not its
        meaning: for the entity counts a window names when the subjects arrived,
        and `lifetime` is therefore the live population rather than an arrival
        count; for the metered traffic every window is a volume accumulated
        inside it, and `lifetime` is everything the facts cover — which is why
        `trafficSince` reports the day they start on; for the storage figures a
        narrow window is the part of the current holding added inside it, and
        `lifetime` is what is held *now* — a held figure rather than a running
        total, since an object removed from storage stops counting in every
        window including the one it was born in.

        `series` reports the same entity metrics at **per-day** granularity,
        over the window named by `seriesWindow` rather than over the four above:
        the four card windows belong to the product and are resolved server-side
        from the clock, while the series window belongs to the caller and comes
        from the query string, because the plot it feeds also draws the traffic
        reading's per-day series and that plot has one x domain. A caller that
        draws both must pass one pair of bounds to both operations rather than
        omitting them: each operation resolves an omitted bound from the clock
        on its own, and two defaults are two windows. The two are reported
        separately so a surface cannot label a day's figure with a period it was
        not cut against.
      required:
      - asOf
      - platformScope
      - windows
      - entities
      - traffic
      - storage
      - series
      - seriesWindow
      - unassembledMetrics
      properties:
        asOf:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: >-
            The UTC day the windows were resolved against. Reported because the
            windows are relative to a clock, and a surface labelling "today"
            from its own date while the figures were cut against this one would
            name a window the numbers do not cover.
        platformScope:
          type: boolean
          description: >-
            Whether the figures cover every tenant rather than the caller's own.
            Reported so a surface cannot render a platform-wide count as if it
            were the caller's own, or the reverse.
        trafficSince:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: >-
            Earliest UTC day the metered traffic facts cover. The basis of the
            lifetime traffic figures: without it, "lifetime" would read as the
            life of the product rather than the life of the fact table.
        windows:
          type: array
          items:
            $ref: '#/components/schemas/MetricsWindowBounds'
        entities:
          type: array
          description: >-
            The entity counts. The platform reading reports users, tenants,
            applications, and agents; the own-tenant reading reports users,
            applications, and agents, because a tenant counting itself is always
            one. A metric this deployment cannot read at all is **absent** here
            and named in `unassembledMetrics` instead of being reported as `0`.
          items:
            $ref: '#/components/schemas/MetricsMetricTotals'
        traffic:
          type: array
          items:
            $ref: '#/components/schemas/MetricsMetricTotals'
        storage:
          type: array
          description: >-
            The occupied storage, as `storage.used_bytes` (`BYTE`) and
            `storage.object_count` (`COUNT`). Sourced from sdkwork-drive's own
            occupancy predicate, so the figure here and the figure Drive refuses
            an upload against are the same number. Reported by both reaches:
            unlike the tenant count, a tenant's own consumption is answerable
            for that tenant.
          items:
            $ref: '#/components/schemas/MetricsMetricTotals'
        series:
          type: array
          description: >-
            The per-day entity arrivals over `seriesWindow`, one entry per
            metric, each with its days ascending. Separate from `entities`
            rather than a fifth window on them: the cards' windows are the
            server's, this one's is the caller's, and folding them together
            would give one row two meanings for "the window".

            Only the entities are reported here. The metered volumes have their
            own per-day shape in the traffic readings, and storage has none
            because a day's occupancy is not reconstructable: a deleted object
            leaves the catalog, and its absence is indistinguishable from never
            having existed.
          items:
            $ref: '#/components/schemas/MetricsSeries'
        seriesWindow:
          $ref: '#/components/schemas/MetricsSeriesWindow'
        unassembledMetrics:
          type: array
          description: >-
            Metric ids this deployment could not read, because the source behind
            them is not assembled here. Not metrics that came back empty: a
            metric answered `0` is reported as the figure `0`, and this list is
            the other case, where no figure exists and none was invented. The
            agents figure is the one that can land here — no topology profile
            declares the agents module, so a deployment that does not run it
            cannot count agents, and saying so is the only true answer.

            A surface must draw these as a missing capability rather than as a
            zero, which is the same distinction the whole reading draws with a
            `503`.
          items:
            type: string
            minLength: 1
            maxLength: 64
    MetricsWindowBounds:
      type: object
      additionalProperties: false
      required:
      - window
      - dateTo
      properties:
        window:
          type: string
          minLength: 1
          maxLength: 32
        dateFrom:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: >-
            Inclusive UTC day. Absent for the lifetime window, whose lower bound
            is wherever the figures begin rather than a day this contract could
            invent.
        dateTo:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
    MetricsMetricTotals:
      type: object
      additionalProperties: false
      description: >-
        One metric across every window. `metric` is one of the entity ids
        (`users`, `tenants`, `applications`, `agents`), one of the storage ids
        (`storage.used_bytes`, `storage.object_count`), or a metered dimension
        (`traffic.requests`, …), which is left open on the same terms as the
        traffic readings: a dimension this contract has not heard of reaches the
        surface instead of failing the response.
      required:
      - metric
      - unit
      - values
      properties:
        metric:
          type: string
          minLength: 1
          maxLength: 64
        unit:
          type: string
          minLength: 1
          maxLength: 32
        values:
          type: array
          description: >-
            One entry per window, in the contract's window order. Reported in
            full rather than sparsely: a window that summed nothing is a real
            `0`, and a missing entry would leave a surface guessing between
            "zero" and "not measured".
          items:
            $ref: '#/components/schemas/MetricsWindowValue'
    MetricsWindowValue:
      type: object
      additionalProperties: false
      required:
      - window
      - quantity
      - unit
      properties:
        window:
          type: string
          minLength: 1
          maxLength: 32
        quantity:
          $ref: '#/components/schemas/Int64String'
        unit:
          type: string
          minLength: 1
          maxLength: 32
    MetricsSeriesWindow:
      type: object
      additionalProperties: false
      description: >-
        The window the per-day series was cut against, as the server resolved
        it. Reported because the request's bounds are optional: a surface that
        labelled the series from its own guess at the default would name a
        period the points do not cover. Deliberately separate from the card
        windows, which answer a different question and may not coincide with
        this one.
      required:
      - dateFrom
      - dateTo
      properties:
        dateFrom:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Inclusive UTC day.
        dateTo:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: >-
            **Exclusive** UTC day.
    MetricsSeries:
      type: object
      additionalProperties: false
      description: >-
        One entity metric's per-day arrivals over `MetricsSeriesWindow`, days
        ascending. Points are **sparse**: a day the metric gained nothing may
        carry no point at all, because a `GROUP BY` cannot report a day it never
        saw. A day inside the window with no point is a real `0`; emitting an
        explicit zero for every day would make the response's size a function of
        the window rather than of the data.
      required:
      - metric
      - unit
      - points
      properties:
        metric:
          type: string
          minLength: 1
          maxLength: 64
        unit:
          type: string
          minLength: 1
          maxLength: 32
        points:
          type: array
          items:
            $ref: '#/components/schemas/MetricsSeriesPoint'
    MetricsSeriesPoint:
      type: object
      additionalProperties: false
      required:
      - date
      - quantity
      properties:
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Calendar day in UTC.
        quantity:
          $ref: '#/components/schemas/Int64String'

