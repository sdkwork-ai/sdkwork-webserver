components:
  securitySchemes:
    AuthToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    CursorParam:
      name: cursor
      in: query
      description: Opaque keyset continuation token for cursor-paginated operations;
        must not be combined with page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    ApplicationIdParam:
      name: application_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DomainIdParam:
      name: domain_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CertificateOperationIdParam:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ListenerCertificateBindingIdParam:
      name: bindingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentIdParam:
      name: deploymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceVersionIdParam:
      name: sourceVersionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ProblemDetail:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - code
        - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: "#/components/schemas/SdkWorkPlatformErrorCode"
        traceId:
          type: string
          format: uuid
          description: Server-owned request correlation id.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    MediaChecksum:
      type: object
      additionalProperties: false
      required:
        - algorithm
        - value
      properties:
        algorithm:
          type: string
          enum:
            - sha256
        value:
          type: string
          pattern: ^[a-f0-9]{64}$
    MediaResource:
      type: object
      additionalProperties: false
      required:
        - kind
        - source
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - image
            - video
            - audio
            - voice
            - document
            - archive
            - model
            - other
        source:
          type: string
          enum:
            - drive
            - external_url
            - data_url
            - provider_asset
            - generated
        url:
          type: string
          format: uri
        publicUrl:
          type: string
          format: uri
        uri:
          type: string
          maxLength: 500
        objectBlobId:
          type: string
        fileName:
          type: string
          maxLength: 512
        mimeType:
          type: string
          maxLength: 256
        sizeBytes:
          type: string
          pattern: ^-?[0-9]+$
        checksum:
          $ref: '#/components/schemas/MediaChecksum'
        width:
          type: integer
          minimum: 0
        height:
          type: integer
          minimum: 0
        durationSeconds:
          type: number
          minimum: 0
        altText:
          type: string
          maxLength: 512
        title:
          type: string
          maxLength: 255
        metadata:
          type: object
          additionalProperties: true
    AppKind:
      type: string
      enum:
        - STATIC_WEB
        - SPA_WEB
        - API_SERVICE
        - WECHAT_MINIPROGRAM
        - DOUYIN_MINIPROGRAM
        - IOS_APP
        - ANDROID_APP
        - HARMONYOS_APP
    Platform:
      type: string
      enum:
        - WEB
        - API
        - WECHAT
        - DOUYIN
        - IOS
        - ANDROID
        - HARMONYOS
    TechStack:
      type: string
      enum:
        - FLUTTER
        - NATIVE
        - UNI_APP
        - NODE
        - RUST
        - GO
        - JAVA
        - OTHER
    PlatformTargetResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        targetKey:
          type: string
        platform:
          $ref: '#/components/schemas/Platform'
        techStack:
          $ref: '#/components/schemas/TechStack'
        architectures:
          type: array
          items:
            type: string
        bundleId:
          type: string
        packageName:
          type: string
        appIdValue:
          type: string
        bundleName:
          type: string
        targetStatus:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreatePlatformTargetRequest:
      type: object
      required:
        - targetKey
        - platform
      properties:
        targetKey:
          type: string
          minLength: 1
          maxLength: 120
        platform:
          $ref: '#/components/schemas/Platform'
        techStack:
          $ref: '#/components/schemas/TechStack'
        architectures:
          type: array
          items:
            type: string
            maxLength: 64
          maxItems: 32
        bundleId:
          type: string
          maxLength: 255
        packageName:
          type: string
          maxLength: 255
        appId:
          type: string
          maxLength: 255
          description: Platform application id (WeChat / Douyin mini program)
        bundleName:
          type: string
          maxLength: 255
        allowedChannels:
          type: array
          items:
            type: string
            enum:
              - stable
              - beta
              - alpha
              - qa
          maxItems: 8
    ApplicationStoreListing:
      type: object
      additionalProperties: false
      properties:
        icon:
          $ref: '#/components/schemas/MediaResource'
        cover:
          $ref: '#/components/schemas/MediaResource'
        previews:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MediaResource'
        shortDescription:
          type: string
          minLength: 1
          maxLength: 80
        fullDescription:
          type: string
          minLength: 1
          maxLength: 4000
        releaseNotes:
          type: string
          minLength: 1
          maxLength: 4000
        category:
          type: string
          minLength: 1
          maxLength: 80
        keywords:
          type: array
