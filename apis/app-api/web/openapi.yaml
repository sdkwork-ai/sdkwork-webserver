  /app/v3/api/applications/{applicationId}/domains/{domainId}/listener_certificate_bindings:
    parameters:
      - $ref: "#/components/parameters/ApplicationIdParam"
      - $ref: "#/components/parameters/DomainIdParam"
    get:
      operationId: applications.domains.listenerCertificateBindings.list
      summary: List certificates active on the domain listener
      description: Returns an offset-paginated P1 list ordered by default status,
        priority, and stable binding id.
      tags:
        - certificate
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-api-surface: app-api
      x-sdkwork-api-authority: sdkwork-web.app
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.certificates.read
      x-sdkwork-owner: sdkwork-web
      x-sdkwork-pagination-mode: offset
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: Listener certificate bindings returned successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SdkWorkApiResponse"
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [ items, pageInfo ]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/ListenerCertificateBindingResponse"
                          pageInfo:
                            $ref: "#/components/schemas/PageInfo"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: applications.domains.listenerCertificateBindings.create
      summary: Bind a certificate version to the domain listener
      tags:
        - certificate
      security:
        - AuthToken: []
          AccessToken: []
      x-sdkwork-api-surface: app-api
      x-sdkwork-api-authority: sdkwork-web.app
      x-sdkwork-request-context: WebRequestContext
      x-sdkwork-auth-mode: dual-token
      x-sdkwork-permission: web.certificates.write
      x-sdkwork-idempotent: true
      x-sdkwork-rate-limit-tier: auth-critical
      x-sdkwork-owner: sdkwork-web
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListenerCertificateBindingRequest"
      responses:
        "201":
          description: Certificate version bound to the listener successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SdkWorkApiResponse"
                  - type: object
                    required: [ data ]
                    properties:
                      data:
                        type: object
                        additionalProperties: false
                        required: [ item ]
                        properties:
                          item:
                            $ref: "#/components/schemas/ListenerCertificateBindingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /app/v3/api/applications/{applicationId}/domains/{domainId}/listener_certificate_bindings/{bindingId}:
